[package]
name = "tenferro-cpu"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CPU backend, kernels, provider selection, and CPU resource pools for tenferro."
rust-version.workspace = true
keywords = ["tensor", "cpu", "linear-algebra", "numerical"]
categories = ["science", "mathematics", "hardware-support"]
documentation = "https://docs.rs/tenferro-cpu"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
# One backend, no features: docs.rs builds the same surface every dependent gets.
all-features = true

[lib]
name = "tenferro_cpu"

[features]
# Test support, off by default: the engine reports the `threadteam::ledger` root of every
# token it mints (`CpuEngine::take_ledger_*`), so tests assert placement invariants. The ledger
# allocates per token, so allocation-counting tests run without it; the CI placement job runs
# the ledger tests with `--features ledger` in a build of their own.
ledger = ["threadteam/ledger"]
# Host-check support, off by default: the crate reports the driver and tcontract
# selection reason of every prepared contraction plan (`take_last_plan_route`),
# so `examples/route_faerlimit.rs` can check which way a host and thread budget
# route a c64 product. The record is written on plan preparation only, never per
# contraction.
route-report = []

[dependencies]
tenferro-core-ops = { path = "../tenferro-core-ops", version = "0.11.0" }
tenferro-internal-cpu-kernels = { path = "../tenferro-internal-cpu-kernels", version = "0.11.0" }
tenferro-cpu-basic = { path = "../tenferro-cpu-basic", version = "0.11.0" }
tenferro-cpu-fused = { path = "../tenferro-cpu-fused", version = "0.11.0" }
tenferro-runtime = { path = "../tenferro-runtime", version = "0.11.0", default-features = false }
tenferro-tensor = { path = "../tenferro-tensor", version = "0.11.0" }
cpueinsum.workspace = true
elem-simd-math.workspace = true
libm.workspace = true
num-complex.workspace = true
num-traits.workspace = true
tinyvec.workspace = true
threadteam.workspace = true
strided-kernel.workspace = true
strided-basic = { workspace = true, features = ["parallel"] }
strided-nn.workspace = true
thiserror.workspace = true
faer.workspace = true
lru.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "blas1"
harness = false

[[bench]]
name = "dot_general_overhead"
harness = false

[[bench]]
name = "pairwise_contraction"
harness = false

[[bench]]
name = "view_materialization"
harness = false

[[bench]]
name = "route_matrix"
harness = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "blas1_thread_counts"
path = "tests/blas1_thread_counts.rs"

[[test]]
name = "softmax_pool_ownership"
path = "tests/softmax_pool_ownership.rs"

[[test]]
name = "blas1_pool_aliasing"
path = "tests/blas1_pool_aliasing.rs"

[[test]]
name = "direct_faer_on_engine_pool"
path = "tests/direct_faer_on_engine_pool.rs"

[[example]]
name = "route_faerlimit"
path = "examples/route_faerlimit.rs"
required-features = ["route-report"]
