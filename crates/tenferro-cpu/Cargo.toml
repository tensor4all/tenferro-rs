[package]
name = "tenferro-cpu"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CPU backend, kernels, provider selection, and CPU resource pools for tenferro."

[lib]
name = "tenferro_cpu"

[features]
default = ["cpu-faer"]
cpu-faer = ["dep:faer", "dep:strided-einsum2", "strided-einsum2/faer", "strided-einsum2/parallel"]
cpu-blas = ["dep:cblas-sys", "dep:lapack"]
provider-src = ["cpu-blas", "dep:blas-src", "dep:cblas-src", "dep:lapack-src"]
provider-inject = ["cpu-blas", "dep:cblas-inject", "dep:lapack-inject"]
blas-openblas = [
    "provider-src",
    "dep:strided-einsum2",
    "blas-src/openblas",
    "lapack-src/openblas",
    "strided-einsum2/blas-openblas",
    "strided-einsum2/parallel",
]
blas-accelerate = [
    "provider-src",
    "dep:strided-einsum2",
    "blas-src/accelerate",
    "lapack-src/accelerate",
    "strided-einsum2/blas-accelerate",
    "strided-einsum2/parallel",
]
blas-mkl = [
    "provider-src",
    "dep:strided-einsum2",
    "blas-src/intel-mkl-dynamic-parallel",
    "lapack-src/intel-mkl-dynamic-parallel",
    "strided-einsum2/blas-mkl",
    "strided-einsum2/parallel",
]

[dependencies]
tenferro-tensor = { path = "../tenferro-tensor", version = "0.2.0" }
num-complex.workspace = true
num-traits.workspace = true
rayon = "1"
smallvec.workspace = true
strided-kernel.workspace = true
strided-einsum2 = { workspace = true, optional = true }
thiserror.workspace = true
faer = { workspace = true, optional = true }
cblas-sys = { workspace = true, optional = true }
cblas-inject = { workspace = true, optional = true }
lapack-inject = { workspace = true, optional = true }
cblas-src = { workspace = true, optional = true }
blas-src = { workspace = true, optional = true }
lapack = { workspace = true, optional = true }
lapack-src = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "dot_general_overhead"
harness = false

[[bench]]
name = "pairwise_contraction"
harness = false

[[bench]]
name = "cpu_install_overhead"
harness = false

[[bench]]
name = "openblas_direct_overhead"
harness = false
required-features = ["cpu-blas"]

[[bench]]
name = "grouped_gemm"
harness = false
