[package]
name = "tenferro-tensor"
version.workspace = true
edition = "2024"
license.workspace = true
authors.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Dense runtime tensors, views, backend traits, and backend-independent contracts for tenferro."
rust-version.workspace = true
keywords = ["tensor", "numerical", "array"]
categories = ["science", "mathematics", "data-structures"]
documentation = "https://docs.rs/tenferro-tensor"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

[lib]
name = "tenferro_tensor"

# The Creusot specifications in `types/split_ranges.rs` sit behind `cfg(creusot)`
# so a normal build never sees them or their proc-macro crate. The proof itself
# lives in `ext/proofs/split-ranges` (#2682).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(creusot)'] }

[features]
default = []

[dependencies]
tenferro-tensor-core = { path = "../tenferro-tensor-core", version = "0.13.0" }
num-traits.workspace = true
num-complex.workspace = true
tinyvec.workspace = true
tenferro-core-ops = { path = "../tenferro-core-ops", version = "0.13.0" }
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
trybuild.workspace = true

[[bench]]
name = "element_access"
harness = false

[[bench]]
name = "dot_accumulation"
harness = false
