[package]
name = "tenferro-tensor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Dense runtime tensors, views, backend traits, and backend-independent contracts for tenferro."

[lib]
name = "tenferro_tensor"

[features]
default = []

[dependencies]
tenferro-tensor-core = { path = "../tenferro-tensor-core", version = "0.2.0" }
num-traits.workspace = true
num-complex.workspace = true
smallvec.workspace = true
tenferro-core-ops = { path = "../tenferro-core-ops", version = "0.2.0" }
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "element_access"
harness = false

[[bench]]
name = "dot_accumulation"
harness = false
