[package]
name = "tenferro-fft"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
description = "FFT extension runtime and public concrete/traced FFT APIs for tenferro."

[features]
default = ["cpu-faer"]
cpu-faer = ["tenferro-ad?/cpu-faer", "tenferro-cpu/cpu-faer"]
cpu-blas = ["tenferro-ad?/cpu-blas", "tenferro-cpu/cpu-blas"]
cpu-tblis = ["tenferro-ad?/cpu-tblis", "tenferro-cpu/cpu-tblis"]
cpu-tblis-linked = ["tenferro-ad?/cpu-tblis-linked", "tenferro-cpu/cpu-tblis-linked"]
blas-openblas = ["tenferro-ad?/blas-openblas", "tenferro-cpu/blas-openblas"]
blas-accelerate = ["tenferro-ad?/blas-accelerate", "tenferro-cpu/blas-accelerate"]
blas-mkl = ["tenferro-ad?/blas-mkl", "tenferro-cpu/blas-mkl"]
autodiff = [
    "dep:tidu",
    "dep:tenferro-ad",
    "tenferro-internal-ops/autodiff",
]
cuda = ["tenferro-ad?/cuda", "tenferro-internal-ops/cuda"]
rocm = ["tenferro-ad?/rocm", "tenferro-internal-ops/rocm"]
webgpu = [
    "dep:tenferro-gpu",
    "tenferro-gpu/webgpu",
    "dep:cubecl",
    "dep:cubecl-wgpu",
    "dep:cubek-fft",
]

[dependencies]
tenferro-runtime = { path = "../tenferro-runtime", version = "0.2.0", default-features = false }
tenferro-ad = { path = "../tenferro-ad", version = "0.2.0", default-features = false, optional = true }
tenferro-tensor = { path = "../tenferro-tensor", version = "0.2.0", default-features = false }
tenferro-cpu = { path = "../tenferro-cpu", version = "0.2.0", default-features = false }
tenferro-gpu = { path = "../tenferro-gpu", version = "0.2.0", default-features = false, optional = true }
cubecl = { workspace = true, optional = true }
cubecl-wgpu = { workspace = true, optional = true }
cubek-fft = { workspace = true, optional = true }
tenferro-internal-extension-macros = { path = "../tenferro-internal-extension-macros", version = "0.2.0" }
tenferro-internal-ops = { path = "../tenferro-internal-ops", version = "0.2.0", default-features = false }
tidu = { workspace = true, optional = true }
computegraph.workspace = true
num-complex.workspace = true
num-traits.workspace = true
rustfft = "6"
thiserror.workspace = true

[[test]]
name = "apple_cpu"
path = "tests/apple_cpu.rs"
required-features = ["webgpu"]

[[test]]
name = "webgpu_metal_fft"
path = "tests/webgpu_metal_fft.rs"
required-features = ["webgpu"]
