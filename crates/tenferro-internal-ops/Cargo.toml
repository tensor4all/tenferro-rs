[package]
name = "tenferro-internal-ops"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Graph op vocabulary and AD rule implementations for the tenferro workspace."
rust-version.workspace = true
keywords = ["tensor", "operations", "autodiff", "graph"]
categories = ["science", "mathematics", "algorithms"]
documentation = "https://docs.rs/tenferro-internal-ops"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

[lib]
name = "tenferro_ops"

[features]
default = ["autodiff"]
autodiff = []
cuda = []
webgpu = []
rocm = []

[dependencies]
tenferro-core-ops = { path = "../tenferro-core-ops", version = "0.3.0" }
tenferro-tensor = { path = "../tenferro-tensor", version = "0.3.0", default-features = false }
tenferro-internal-extension-macros = { path = "../tenferro-internal-extension-macros", version = "0.3.0" }
computegraph.workspace = true
num-complex.workspace = true
thiserror.workspace = true
