[package]
name = "tenferro-linalg"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Linear algebra traced APIs, eager helpers, extension runtime, and optional AD rules for tenferro."
rust-version.workspace = true
keywords = ["linear-algebra", "tensor", "mathematics", "numerical"]
categories = ["science", "mathematics", "algorithms"]
documentation = "https://docs.rs/tenferro-linalg"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
features = ["autodiff", "cpu-faer", "cuda", "webgpu"]

[features]
default = ["cpu-faer"]
__bench_unification_semantic_ad_api = []
autodiff = [
    "dep:computegraph",
    "dep:tenferro-ad",
    "tenferro-internal-ops/autodiff",
]
cpu-faer = [
    "dep:faer",
    "tenferro-ad?/cpu-faer",
    "tenferro-cpu/cpu-faer",
]
cpu-blas = [
    "dep:cblas-sys",
    "dep:lapack",
    "tenferro-ad?/cpu-blas",
    "tenferro-cpu/cpu-blas",
]
blas-openblas = [
    "tenferro-ad?/blas-openblas",
    "tenferro-cpu/blas-openblas",
    "tenferro-gpu?/blas-openblas",
]
blas-accelerate = [
    "tenferro-ad?/blas-accelerate",
    "tenferro-cpu/blas-accelerate",
    "tenferro-gpu?/blas-accelerate",
]
blas-mkl = [
    "tenferro-ad?/blas-mkl",
    "tenferro-cpu/blas-mkl",
    "tenferro-gpu?/blas-mkl",
]
provider-inject = [
    "cpu-blas",
    "tenferro-cpu/provider-inject",
    "dep:cblas-inject",
    "dep:lapack-inject",
]
cuda = [
    "tenferro-ad?/cuda",
    "tenferro-internal-ops/cuda",
    "dep:cubecl",
    "dep:cubecl-cuda",
    "dep:cubecl-runtime",
    "dep:cudarc",
    "dep:libloading",
    "dep:tenferro-gpu",
    "tenferro-gpu/cuda",
]
rocm = ["tenferro-ad?/rocm", "tenferro-internal-ops/rocm"]
webgpu = ["dep:tenferro-gpu", "tenferro-gpu/webgpu"]

[dependencies]
tenferro-runtime = { path = "../tenferro-runtime", version = "0.4.0", default-features = false }
tenferro-ad = { path = "../tenferro-ad", version = "0.4.0", default-features = false, optional = true }
tenferro-gpu = { path = "../tenferro-gpu", version = "0.4.0", default-features = false, optional = true }
tenferro-internal-extension-macros = { path = "../tenferro-internal-extension-macros", version = "0.4.0" }
tenferro-internal-ops = { path = "../tenferro-internal-ops", version = "0.4.0", default-features = false }
tenferro-tensor = { path = "../tenferro-tensor", version = "0.4.0", default-features = false }
tenferro-cpu = { path = "../tenferro-cpu", version = "0.4.0", default-features = false }
cblas-sys = { workspace = true, optional = true }
cblas-inject = { workspace = true, optional = true }
computegraph = { workspace = true, optional = true }
cubecl = { workspace = true, optional = true }
cubecl-cuda = { workspace = true, optional = true }
cubecl-runtime = { workspace = true, optional = true }
cudarc = { workspace = true, optional = true }
faer = { workspace = true, optional = true }
lapack = { workspace = true, optional = true }
lapack-inject = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
num-complex.workspace = true
num-traits.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[[bench]]
name = "lu_ad_breakdown"
harness = false
required-features = ["autodiff"]

[[bench]]
name = "linalg_vjp_gate"
harness = false
required-features = ["autodiff", "__bench_unification_semantic_ad_api"]

[[bench]]
name = "eager_extension_dispatch"
harness = false
required-features = ["autodiff"]

[[bench]]
name = "incremental_householder_qr"
harness = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "prelude"
path = "tests/prelude.rs"
