[package]
name = "tenferro-linalg"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Linear algebra traced APIs, eager helpers, extension runtime, and optional AD rules for tenferro."

[features]
default = ["cpu-faer"]
autodiff = [
    "dep:computegraph",
    "dep:tidu",
    "dep:tenferro-ad",
    "tenferro-internal-ops/autodiff",
]
cpu-faer = [
    "tenferro-ad?/cpu-faer",
    "tenferro-cpu/cpu-faer",
]
cpu-blas = [
    "dep:cblas-sys",
    "tenferro-ad?/cpu-blas",
    "tenferro-cpu/cpu-blas",
]
blas-openblas = [
    "tenferro-ad?/blas-openblas",
    "tenferro-cpu/blas-openblas",
    "tenferro-gpu?/blas-openblas",
]
blas-accelerate = [
    "tenferro-ad?/blas-accelerate",
    "tenferro-cpu/blas-accelerate",
    "tenferro-gpu?/blas-accelerate",
]
blas-mkl = [
    "tenferro-ad?/blas-mkl",
    "tenferro-cpu/blas-mkl",
    "tenferro-gpu?/blas-mkl",
]
provider-inject = [
    "cpu-blas",
    "tenferro-cpu/provider-inject",
    "dep:cblas-inject",
    "dep:lapack-inject",
]
cuda = [
    "tenferro-ad?/cuda",
    "tenferro-internal-ops/cuda",
    "dep:cubecl",
    "dep:cubecl-cuda",
    "dep:cubecl-runtime",
    "dep:cudarc",
    "dep:libloading",
    "dep:tenferro-gpu",
    "tenferro-gpu/cuda",
]
rocm = ["tenferro-ad?/rocm", "tenferro-internal-ops/rocm"]

[dependencies]
tenferro-runtime = { path = "../tenferro-runtime", version = "0.2.0", default-features = false }
tenferro-ad = { path = "../tenferro-ad", version = "0.2.0", default-features = false, optional = true }
tenferro-gpu = { path = "../tenferro-gpu", version = "0.2.0", default-features = false, optional = true }
tenferro-internal-extension-macros = { path = "../tenferro-internal-extension-macros", version = "0.2.0" }
tenferro-internal-ops = { path = "../tenferro-internal-ops", version = "0.2.0", default-features = false }
tenferro-tensor = { path = "../tenferro-tensor", version = "0.2.0", default-features = false }
tenferro-cpu = { path = "../tenferro-cpu", version = "0.2.0", default-features = false }
cblas-sys = { workspace = true, optional = true }
cblas-inject = { workspace = true, optional = true }
computegraph = { workspace = true, optional = true }
tidu = { workspace = true, optional = true }
cubecl = { workspace = true, optional = true }
cubecl-cuda = { workspace = true, optional = true }
cubecl-runtime = { workspace = true, optional = true }
cudarc = { workspace = true, optional = true }
faer.workspace = true
lapack.workspace = true
lapack-inject = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
num-complex.workspace = true
num-traits.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "lu_ad_breakdown"
harness = false
required-features = ["autodiff"]
