[package]
name = "tenferro-linalg"
autotests = false
version.workspace = true
edition = "2024"
license.workspace = true
authors.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Linear algebra traced APIs, eager helpers, extension runtime, and optional AD rules for tenferro."
rust-version.workspace = true
keywords = ["linear-algebra", "tensor", "mathematics", "numerical"]
categories = ["science", "mathematics", "algorithms"]
documentation = "https://docs.rs/tenferro-linalg"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
features = ["autodiff", "cuda"]

[features]
# Test support, off by default (see `tenferro-cpu`): placement-ledger assertions.
ledger = ["tenferro-cpu/ledger"]
__bench_unification_semantic_ad_api = []
autodiff = [
    "dep:computegraph",
    "dep:tenferro-ad",
    "tenferro-internal-ops/autodiff",
]
cuda = [
    "tenferro-gpu/cuda",
    "tenferro-ad?/cuda",
    "tenferro-internal-ops/cuda",
    "dep:cudarc",
    "dep:libloading",
    "dep:tenferro-gpu",
]

[dependencies]
tenferro-runtime = { path = "../tenferro-runtime", version = "0.11.0", default-features = false }
tenferro-ad = { path = "../tenferro-ad", version = "0.11.0", default-features = false, optional = true }
tenferro-gpu = { path = "../tenferro-gpu", version = "0.11.0", default-features = false, optional = true }
tenferro-internal-extension-macros = { path = "../tenferro-internal-extension-macros", version = "0.11.0" }
tenferro-internal-ops = { path = "../tenferro-internal-ops", version = "0.11.0", default-features = false }
tenferro-tensor = { path = "../tenferro-tensor", version = "0.11.0", default-features = false }
tenferro-cpu = { path = "../tenferro-cpu", version = "0.11.0", default-features = false }
computegraph = { workspace = true, optional = true }
cudarc = { workspace = true, optional = true }
faer.workspace = true
# The extracted tensor-free linalg provider (tlinalg-rs). The interface it is adapted to lives in
# this crate. Its requirement lives in the workspace manifest, next to the rest of the CPU stack:
# tlinalg 0.11 takes the engine's `tcontract_exec::Exec` bundle by `&mut` (`*_workspace` entries by
# `&`) and forks its batch lanes over that token.
tlinalg.workspace = true
tcontract-exec = { workspace = true, features = ["faer"] }
libloading = { workspace = true, optional = true }
num-complex.workspace = true
strided-view.workspace = true
num-traits.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[[example]]
name = "lstsq_rank_deficient_diag"
required-features = ["autodiff"]

[[bench]]
name = "lu_ad_breakdown"
harness = false
required-features = ["autodiff"]

[[bench]]
name = "traced_small_ad_overhead"
harness = false
required-features = ["autodiff"]

[[bench]]
name = "linalg_vjp_gate"
harness = false
required-features = ["autodiff", "__bench_unification_semantic_ad_api"]

[[bench]]
name = "eager_extension_dispatch"
harness = false
required-features = ["autodiff"]

[[bench]]
name = "incremental_householder_qr"
harness = false

[[bench]]
name = "householder_qr_small_appends"
harness = false
required-features = ["autodiff"]

[[bench]]
name = "cuda_svd_driver"
harness = false
required-features = ["cuda"]

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "prelude"
path = "tests/prelude.rs"

[[test]]
name = "cpu_linalg_allocation"
path = "tests/cpu_linalg_allocation.rs"

[[test]]
name = "lane_allocation"
path = "tests/lane_allocation.rs"

[[test]]
name = "small_linalg_allocation"
path = "tests/small_linalg_allocation.rs"

[[example]]
name = "eigh_hvp_degenerate_pair"
path = "examples/eigh_hvp_degenerate_pair.rs"
required-features = ["autodiff"]
