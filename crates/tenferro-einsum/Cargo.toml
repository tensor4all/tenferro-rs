[package]
name = "tenferro-einsum"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Subscripts, contraction planning, concrete/traced/eager einsum APIs, extension runtime, and AD rule for tenferro."
rust-version.workspace = true
keywords = ["tensor", "einsum", "contraction", "numerical"]
categories = ["science", "mathematics", "algorithms"]
documentation = "https://docs.rs/tenferro-einsum"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
features = ["autodiff", "cuda"]

[features]
# Test support, off by default (see `tenferro-cpu`): placement-ledger assertions.
ledger = ["tenferro-cpu/ledger"]
autodiff = [
    "dep:tenferro-ad",
    "tenferro-internal-ops/autodiff",
]
cuda = [
    "tenferro-ad?/cuda",
    "tenferro-internal-ops/cuda",
    "dep:tenferro-gpu",
    "tenferro-gpu/cuda",
]

[dependencies]
tenferro-runtime = { path = "../tenferro-runtime", version = "0.11.0", default-features = false }
tenferro-ad = { path = "../tenferro-ad", version = "0.11.0", default-features = false, optional = true }
tenferro-internal-extension-macros = { path = "../tenferro-internal-extension-macros", version = "0.11.0" }
tenferro-internal-ops = { path = "../tenferro-internal-ops", version = "0.11.0", default-features = false }
tenferro-tensor = { path = "../tenferro-tensor", version = "0.11.0", default-features = false }
tenferro-cpu = { path = "../tenferro-cpu", version = "0.11.0", default-features = false }
tenferro-cpu-basic = { path = "../tenferro-cpu-basic", version = "0.11.0" }
cpueinsum.workspace = true
tenferro-gpu = { path = "../tenferro-gpu", version = "0.11.0", default-features = false, optional = true }
computegraph.workspace = true
lru.workspace = true
omeco.workspace = true
tinyvec.workspace = true
thiserror.workspace = true

[dev-dependencies]
tenferro-internal-ops = { path = "../tenferro-internal-ops", version = "0.11.0", default-features = false }
criterion.workspace = true
num-complex.workspace = true

[[bench]]
name = "einsum_cpu_bench"
harness = false
required-features = ["autodiff"]

[[bench]]
name = "changing_shape_prepare"
harness = false
required-features = ["autodiff"]

[[bench]]
name = "mps_inner_product"
harness = false

[[bench]]
name = "einsum_session_chain"
harness = false

[[bench]]
name = "mps_inner_product_compile"
harness = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "prelude"
path = "tests/prelude.rs"
