[package]
name = "tenferro-einsum"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Subscripts, contraction planning, concrete/traced/eager einsum APIs, extension runtime, and AD rule for tenferro."
rust-version.workspace = true
keywords = ["tensor", "einsum", "contraction", "numerical"]
categories = ["science", "mathematics", "algorithms"]
documentation = "https://docs.rs/tenferro-einsum"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
features = ["autodiff", "cpu-faer", "cuda", "webgpu"]

[features]
default = ["cpu-faer"]
autodiff = [
    "dep:tenferro-ad",
    "tenferro-internal-ops/autodiff",
]
cpu-faer = [
    "tenferro-ad?/cpu-faer",
    "tenferro-cpu/cpu-faer",
]
cpu-blas = [
    "tenferro-ad?/cpu-blas",
    "tenferro-cpu/cpu-blas",
]
blas-openblas = [
    "tenferro-ad?/blas-openblas",
    "tenferro-cpu/blas-openblas",
]
blas-accelerate = [
    "tenferro-ad?/blas-accelerate",
    "tenferro-cpu/blas-accelerate",
]
blas-mkl = [
    "tenferro-ad?/blas-mkl",
    "tenferro-cpu/blas-mkl",
]
cuda = [
    "tenferro-ad?/cuda",
    "tenferro-internal-ops/cuda",
    "dep:tenferro-gpu",
    "tenferro-gpu/cuda",
]
webgpu = [
    "tenferro-ad?/webgpu",
    "tenferro-internal-ops/webgpu",
    "dep:tenferro-gpu",
    "tenferro-gpu/webgpu",
]
rocm = [
    "tenferro-ad?/rocm",
    "tenferro-internal-ops/rocm",
    "dep:tenferro-gpu",
    "tenferro-gpu/rocm",
]

[dependencies]
tenferro-runtime = { path = "../tenferro-runtime", version = "0.2.0", default-features = false }
tenferro-ad = { path = "../tenferro-ad", version = "0.2.0", default-features = false, optional = true }
tenferro-internal-extension-macros = { path = "../tenferro-internal-extension-macros", version = "0.2.0" }
tenferro-internal-ops = { path = "../tenferro-internal-ops", version = "0.2.0", default-features = false }
tenferro-tensor = { path = "../tenferro-tensor", version = "0.2.0", default-features = false }
tenferro-cpu = { path = "../tenferro-cpu", version = "0.2.0", default-features = false }
tenferro-gpu = { path = "../tenferro-gpu", version = "0.2.0", default-features = false, optional = true }
computegraph.workspace = true
lru.workspace = true
omeco.workspace = true
smallvec.workspace = true
thiserror.workspace = true

[dev-dependencies]
tenferro-internal-ops = { path = "../tenferro-internal-ops", version = "0.2.0", default-features = false }
criterion.workspace = true
num-complex.workspace = true

[[bench]]
name = "einsum_cpu_bench"
harness = false
required-features = ["autodiff"]

[[bench]]
name = "changing_shape_prepare"
harness = false
required-features = ["autodiff"]

[[bench]]
name = "mps_inner_product"
harness = false

[[bench]]
name = "mps_inner_product_compile"
harness = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "prelude"
path = "tests/prelude.rs"
