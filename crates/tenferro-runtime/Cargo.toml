[package]
name = "tenferro-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Concrete tensor helpers, traced tensors, graph execution, and extension runtime support for tenferro."

[lib]
name = "tenferro_runtime"

[features]
default = ["cpu-faer"]
cpu-faer = ["tenferro-cpu/cpu-faer"]
cpu-blas = ["tenferro-cpu/cpu-blas"]
cpu-tblis = ["tenferro-cpu/cpu-tblis"]
cpu-tblis-linked = ["tenferro-cpu/cpu-tblis-linked"]
blas-openblas = ["tenferro-cpu/blas-openblas"]
blas-accelerate = ["tenferro-cpu/blas-accelerate"]
blas-mkl = ["tenferro-cpu/blas-mkl"]

[dependencies]
tenferro-core-ops = { path = "../tenferro-core-ops", version = "0.2.0" }
tenferro-internal-ops = { path = "../tenferro-internal-ops", version = "0.2.0", default-features = false }
tenferro-tensor = { path = "../tenferro-tensor", version = "0.2.0", default-features = false }
computegraph.workspace = true
lru.workspace = true
num-complex.workspace = true
num-traits.workspace = true
smallvec.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
tenferro-cpu = { path = "../tenferro-cpu", version = "0.2.0", default-features = false }

[[bench]]
name = "elementwise_fusion"
harness = false
