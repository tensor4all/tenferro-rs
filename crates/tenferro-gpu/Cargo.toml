[package]
name = "tenferro-gpu"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CubeCL-backed CUDA and WebGPU provider backends for tenferro tensors."
rust-version.workspace = true
keywords = ["tensor", "gpu", "cuda", "webgpu"]
categories = ["science", "hardware-support", "mathematics"]
documentation = "https://docs.rs/tenferro-gpu"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
features = ["native", "cuda", "webgpu"]

[lib]
name = "tenferro_gpu"

[features]
default = ["native"]
native = ["tenferro-cpu/native"]
blas = ["tenferro-cpu/blas"]
blas-openblas = ["tenferro-cpu/blas-openblas"]
blas-accelerate = ["tenferro-cpu/blas-accelerate"]
blas-mkl = ["tenferro-cpu/blas-mkl"]
cpu-reference = []
cuda = [
    "dep:cubecl",
    "dep:lru",
    "cubecl/std",
    "cubecl/stdlib",
    "cubecl/cuda",
    "dep:cubecl-cuda",
    "dep:cubecl-runtime",
    "dep:cubecl-environment",
    "dep:cudarc",
]
# Exposes CubeCL launch types (client, bindings) for running caller-written
# `#[cube]` kernels on a CudaEngine's stream. The only feature under which
# CubeCL types are public; it changes when tenferro replaces CubeCL's runtime.
cubecl-interop = ["cuda"]
# The backend-neutral `gpu/` seam and its CUDA adapter over `t4a-cuda-runtime`
# (issue #2208 U1). Private surface: the public `cuda::` names keep the CubeCL
# implementation until the operation surface moves over (U2-U6).
cuda-next = ["cuda", "dep:t4a-cuda-runtime", "dep:t4a-cuda-kernels"]
webgpu = [
    "dep:cubecl",
    "cubecl/std",
    "cubecl/stdlib",
    "cubecl/wgpu",
    "dep:cubecl-common",
    "dep:cubecl-runtime",
    "dep:cubecl-environment",
    "dep:cubecl-wgpu",
    "dep:cubek-matmul",
    "dep:cubek-std",
    "dep:cubek-fft",
]
rocm = []

[dependencies]
tenferro-core-ops = { path = "../tenferro-core-ops", version = "0.7.1" }
tenferro-tensor = { path = "../tenferro-tensor", version = "0.7.1", default-features = false }
tenferro-cpu = { path = "../tenferro-cpu", version = "0.7.1", default-features = false }
tenferro-runtime = { path = "../tenferro-runtime", version = "0.7.1", default-features = false }
cubecl = { workspace = true, optional = true }
cubecl-cuda = { workspace = true, optional = true }
cubecl-common = { workspace = true, optional = true }
cubecl-environment = { workspace = true, optional = true }
cubecl-runtime = { workspace = true, optional = true }
cubecl-wgpu = { workspace = true, optional = true }
cubek-matmul = { workspace = true, optional = true }
cubek-std = { workspace = true, optional = true }
cubek-fft = { workspace = true, optional = true }
# The standalone CUDA runtime the U1 seam is built on (issue #2208). Both upstream
# crates are `publish = false`, so the dependency is a pinned git revision, recorded
# in docs/design/cuda-seam-u1-2208.md.
t4a-cuda-runtime = { git = "https://github.com/tensor4all/t4a-gpu-backend", rev = "0a101bf19207e0abb2ea169721f63f50af8669b0", optional = true }
# The kernel catalogue and its NVRTC sources (ABI revision 10).
t4a-cuda-kernels = { git = "https://github.com/tensor4all/t4a-cuda-kernels", rev = "5019c713c14c1f5d59ea2cf03bbfff08c40f167e", optional = true }
cudarc = { workspace = true, optional = true, features = ["cublas"] }
libloading.workspace = true
lru = { workspace = true, optional = true }
num-complex.workspace = true
num-traits.workspace = true
smallvec.workspace = true
tinyvec.workspace = true
strided-perm.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
trybuild.workspace = true
# Unit tests build handles that only carry tenferro's own bookkeeping; 0.11's
# `Handle` needs the service id those handles name.
cubecl-common.workspace = true

