[package]
name = "tenferro-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CubeCL-backed CUDA and WebGPU provider backends for tenferro tensors."

[lib]
name = "tenferro_gpu"

[features]
default = ["cpu-faer"]
cpu-faer = ["tenferro-cpu/cpu-faer"]
cpu-blas = ["tenferro-cpu/cpu-blas"]
blas-openblas = ["tenferro-cpu/blas-openblas"]
blas-accelerate = ["tenferro-cpu/blas-accelerate"]
blas-mkl = ["tenferro-cpu/blas-mkl"]
blas-blis = ["tenferro-cpu/blas-blis"]
cpu-reference = []
cuda = [
    "dep:cubecl",
    "cubecl/std",
    "cubecl/stdlib",
    "cubecl/cuda",
    "dep:cubecl-cuda",
    "dep:cubecl-runtime",
    "dep:cudarc",
]
webgpu = [
    "dep:cubecl",
    "cubecl/std",
    "cubecl/stdlib",
    "cubecl/wgpu",
    "dep:cubecl-common",
    "dep:cubecl-runtime",
    "dep:cubecl-wgpu",
    "dep:cubek-matmul",
    "dep:cubek-std",
]
rocm = []

[dependencies]
tenferro-core-ops = { path = "../tenferro-core-ops", version = "0.2.0" }
tenferro-tensor = { path = "../tenferro-tensor", version = "0.2.0", default-features = false }
cubecl = { workspace = true, optional = true }
cubecl-cuda = { workspace = true, optional = true }
cubecl-common = { workspace = true, optional = true }
cubecl-runtime = { workspace = true, optional = true }
cubecl-wgpu = { workspace = true, optional = true }
cubek-matmul = { workspace = true, optional = true }
cubek-std = { workspace = true, optional = true }
cudarc = { workspace = true, optional = true }
libloading.workspace = true
num-complex.workspace = true
num-traits.workspace = true
smallvec.workspace = true
thiserror.workspace = true

[dev-dependencies]
tenferro-cpu = { path = "../tenferro-cpu", version = "0.2.0", default-features = false }
criterion.workspace = true

[[example]]
name = "cuda_quickstart"
required-features = ["cuda"]
