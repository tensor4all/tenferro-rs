[package]
name = "tenferro-ad"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Eager runtime, eager tensors, and traced AD extension traits for tenferro."

[lib]
name = "tenferro_ad"

[features]
default = ["cpu-faer"]
cpu-faer = [
    "tenferro-cpu/cpu-faer",
]
cpu-blas = [
    "tenferro-cpu/cpu-blas",
]
blas-openblas = [
    "tenferro-cpu/blas-openblas",
]
blas-accelerate = [
    "tenferro-cpu/blas-accelerate",
]
blas-mkl = [
    "tenferro-cpu/blas-mkl",
]
cuda = ["dep:tenferro-gpu", "tenferro-gpu/cuda"]
webgpu = ["dep:tenferro-gpu", "tenferro-gpu/webgpu"]
rocm = ["dep:tenferro-gpu", "tenferro-gpu/rocm"]

[dependencies]
tenferro-runtime = { path = "../tenferro-runtime", version = "0.2.0", default-features = false }
tenferro-internal-ops = { path = "../tenferro-internal-ops", version = "0.2.0", default-features = false, features = ["autodiff"] }
tenferro-tensor = { path = "../tenferro-tensor", version = "0.2.0", default-features = false }
tenferro-cpu = { path = "../tenferro-cpu", version = "0.2.0", default-features = false }
tenferro-gpu = { path = "../tenferro-gpu", version = "0.2.0", default-features = false, optional = true }
computegraph.workspace = true
lru.workspace = true
num-complex.workspace = true
num-traits.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "eager_ad_transform_cache"
harness = false

[[bench]]
name = "eager_dispatch_baseline"
harness = false

[[bench]]
name = "eager_backward_shape_churn"
harness = false

[[test]]
name = "integration"
path = "tests/integration.rs"
