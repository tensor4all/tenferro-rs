[package]
name = "tenferro"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "AD-aware ergonomic tensor wrapper on top of tenferro APIs."

[lib]
test = false

[[example]]
name = "cuda_quickstart"
required-features = ["cuda"]

[features]
default = ["cpu-faer"]
cpu-faer = [
    "tenferro-einsum/cpu-faer",
    "tenferro-ops/cpu-faer",
    "tenferro-tensor/cpu-faer",
]
cpu-blas = [
    "tenferro-einsum/cpu-blas",
    "tenferro-ops/cpu-blas",
    "tenferro-tensor/cpu-blas",
]
provider-src = ["cpu-blas", "tenferro-tensor/provider-src"]
src-openblas = ["provider-src", "tenferro-tensor/src-openblas"]
src-accelerate = ["provider-src", "tenferro-tensor/src-accelerate"]
src-intel-mkl-dynamic-parallel = [
    "provider-src",
    "tenferro-tensor/src-intel-mkl-dynamic-parallel",
]
cubecl = [
    "tenferro-einsum/cubecl",
    "tenferro-ops/cubecl",
    "tenferro-tensor/cubecl",
]
cuda = ["cubecl"]

[dependencies]
tenferro-tensor = { path = "../tenferro-tensor", default-features = false }
tenferro-ops = { path = "../tenferro-ops", default-features = false }
tenferro-einsum = { path = "../tenferro-einsum", default-features = false }
omeco.workspace = true
computegraph.workspace = true
chainrules-core.workspace = true
tidu.workspace = true
num-complex.workspace = true
num-traits.workspace = true
thiserror.workspace = true
lru = { workspace = true }

[dev-dependencies]
criterion.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[[bench]]
name = "mps_inner_product"
harness = false

[[bench]]
name = "mps_inner_product_compile"
harness = false

[[bench]]
name = "mps_inner_product_eager"
harness = false
