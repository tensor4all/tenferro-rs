[package]
name = "tenferro"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "AD-aware ergonomic tensor wrapper on top of tenferro APIs."

[lib]
test = false

[features]
default = ["cpu-faer"]
cpu-faer = ["tenferro-tensor/cpu-faer"]
cpu-blas = ["tenferro-tensor/cpu-blas"]
provider-src = ["cpu-blas", "tenferro-tensor/provider-src"]
src-openblas = ["provider-src", "tenferro-tensor/src-openblas"]
src-accelerate = ["provider-src", "tenferro-tensor/src-accelerate"]
src-intel-mkl-dynamic-parallel = ["provider-src", "tenferro-tensor/src-intel-mkl-dynamic-parallel"]
cuda = ["tenferro-tensor/cuda"]
cubecl = ["tenferro-tensor/cubecl"]

[dependencies]
tenferro-tensor = { path = "../tenferro-tensor" }
tenferro-ops = { path = "../tenferro-ops" }
tenferro-einsum = { path = "../tenferro-einsum" }
omeco.workspace = true
computegraph.workspace = true
chainrules-core.workspace = true
tidu.workspace = true
num-complex.workspace = true
num-traits.workspace = true
thiserror.workspace = true
lru = { workspace = true }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
