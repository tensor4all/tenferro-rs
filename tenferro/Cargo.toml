[package]
name = "tenferro"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "AD-aware ergonomic tensor wrapper on top of tenferro APIs."

[lib]
test = false

[[example]]
name = "cuda_quickstart"
required-features = ["cuda"]

[features]
default = ["autodiff", "cpu-faer"]
autodiff = [
    "chainrules-core",
    "tenferro-internal-ops/autodiff",
    "tidu",
]
cpu-faer = [
    "tenferro-internal-runtime/cpu-faer",
    "tenferro-internal-ops/cpu-faer",
    "tenferro-tensor/cpu-faer",
]
cpu-blas = [
    "tenferro-internal-runtime/cpu-blas",
    "tenferro-internal-ops/cpu-blas",
    "tenferro-tensor/cpu-blas",
]
provider-src = ["cpu-blas", "tenferro-tensor/provider-src"]
src-openblas = ["provider-src", "tenferro-tensor/src-openblas"]
src-accelerate = ["provider-src", "tenferro-tensor/src-accelerate"]
src-intel-mkl-dynamic-parallel = [
    "provider-src",
    "tenferro-tensor/src-intel-mkl-dynamic-parallel",
]
gpu = [
    "tenferro-internal-runtime/gpu",
    "tenferro-internal-ops/gpu",
    "tenferro-tensor/gpu",
]
cuda = [
    "gpu",
    "tenferro-internal-runtime/cuda",
    "tenferro-internal-ops/cuda",
    "tenferro-tensor/cuda",
]
rocm = [
    "gpu",
    "tenferro-internal-runtime/rocm",
    "tenferro-internal-ops/rocm",
    "tenferro-tensor/rocm",
]

[dependencies]
tenferro-internal-runtime = { path = "../tenferro-internal-runtime", default-features = false }
tenferro-tensor = { path = "../tenferro-tensor", default-features = false }
tenferro-internal-ops = { path = "../tenferro-internal-ops", default-features = false }
computegraph.workspace = true
chainrules-core = { workspace = true, optional = true }
tidu = { workspace = true, optional = true }
num-complex.workspace = true
num-traits.workspace = true
thiserror.workspace = true
lru = { workspace = true }

[dev-dependencies]
criterion.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[[bench]]
name = "mps_inner_product_eager"
harness = false

[[bench]]
name = "cpu_bench"
harness = false
