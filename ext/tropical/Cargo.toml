[package]
name = "tenferro-ext-tropical"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Hiroshi Shinaoka <h.shinaoka@gmail.com>"]
publish = false
description = "Standalone tropical semiring extension skeleton for tenferro."

# This crate is intentionally a nested standalone workspace while the extension
# surface evolves outside the core tenferro workspace.
[workspace]
resolver = "2"

[lib]
name = "tenferro_ext_tropical"
path = "src/lib.rs"

[features]
default = []
autodiff = [
    "dep:computegraph",
    "dep:tenferro-ad",
    "tenferro-internal-ops/autodiff",
]
tropical-gemm = ["dep:tropical-gemm"]

[dependencies]
tenferro-ad = { path = "../../crates/tenferro-ad", default-features = false, optional = true }
tenferro-einsum = { path = "../../crates/tenferro-einsum" }
tenferro-internal-ops = { path = "../../crates/tenferro-internal-ops", default-features = false }
tenferro-runtime = { path = "../../crates/tenferro-runtime" }
tenferro-tensor = { path = "../../crates/tenferro-tensor" }
computegraph = { version = "=0.1.0", optional = true }
num-traits = "0.2"
thiserror = "2"
tropical-gemm = { version = "0.2", default-features = false, optional = true }

[dev-dependencies]
criterion = "0.5"
tenferro-ad = { path = "../../crates/tenferro-ad", default-features = false }
tenferro-cpu = { path = "../../crates/tenferro-cpu" }

[[bench]]
name = "tropical_matmul"
harness = false

# Match workspace [profile.ci] used by scripts/ci/run_profile.py extensions.
[profile.ci]
inherits = "test"
debug = 0
incremental = false
strip = "symbols"

# Temporary: cpueinsum 0.13.0 (the threadteam 0.6 line) is
# not on crates.io yet. Drop this block, and re-lock, once it is released.
[patch.crates-io]
cpueinsum = { git = "https://github.com/tensor4all/cpueinsum-rs", rev = "c176e290e371761cea72b0fe02eef0d6b4f116e3" }
# The cpueinsum git source above names tcontract-rs by git rev (its workspace
# keeps one source with its private tcontract-capi); a published cpueinsum
# resolves those from crates.io, so point the git source at the same releases.
[patch."https://github.com/tensor4all/tcontract-rs.git"]
tcontract = { version = "0.13.0" }
tcontract-exec = { version = "0.13.0" }
tcontract-kernel = { version = "0.3.1" }
