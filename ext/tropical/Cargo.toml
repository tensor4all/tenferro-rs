[package]
name = "tenferro-ext-tropical"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Hiroshi Shinaoka <h.shinaoka@gmail.com>"]
publish = false
description = "Standalone tropical semiring extension skeleton for tenferro."

# This crate is intentionally a nested standalone workspace while the extension
# surface evolves outside the core tenferro workspace.
[workspace]
resolver = "2"

[lib]
name = "tenferro_ext_tropical"
path = "src/lib.rs"

[features]
default = []
autodiff = [
    "dep:chainrules-core",
    "dep:computegraph",
    "tenferro-internal-ops/autodiff",
]
tropical-gemm = ["dep:tropical-gemm"]

[dependencies]
tenferro-einsum = { path = "../../tenferro-einsum" }
tenferro-internal-ops = { path = "../../tenferro-internal-ops", default-features = false }
tenferro-runtime = { path = "../../tenferro-runtime" }
tenferro-tensor = { path = "../../tenferro-tensor" }
chainrules-core = { git = "https://github.com/tensor4all/chainrules-rs.git", rev = "2d7662140d92f0dd73b2402aefc2272feafc9270", package = "chainrules", optional = true }
computegraph = { git = "https://github.com/tensor4all/computegraph-rs.git", rev = "c20e8912560ef11166418bcea089126ef50443cc", optional = true }
num-traits = "0.2"
tropical-gemm = { version = "0.2", default-features = false, optional = true }

[dev-dependencies]
tenferro-ad = { path = "../../tenferro-ad", default-features = false }
tenferro-cpu = { path = "../../tenferro-cpu" }
