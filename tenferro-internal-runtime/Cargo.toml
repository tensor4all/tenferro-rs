[package]
name = "tenferro-internal-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "Runtime extension dispatch and cache infrastructure for tenferro."

[lib]
name = "tenferro_runtime"

[features]
default = ["cpu-faer"]
cpu-faer = ["tenferro-tensor/cpu-faer"]
cpu-blas = ["tenferro-tensor/cpu-blas"]
gpu = []
cuda = ["gpu"]
rocm = ["gpu"]

[dependencies]
tenferro-internal-ops = { path = "../tenferro-internal-ops", default-features = false }
tenferro-tensor = { path = "../tenferro-tensor", default-features = false }
lru.workspace = true
thiserror.workspace = true
