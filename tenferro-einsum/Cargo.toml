[package]
name = "tenferro-einsum"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "High-level einsum with N-ary contraction tree optimization for the tenferro workspace."

[features]
default = ["autodiff", "cpu-faer"]
autodiff = [
    "chainrules-core",
    "dep:tenferro-ad",
    "tenferro-internal-ops/autodiff",
]
cpu-faer = [
    "tenferro/cpu-faer",
    "tenferro-ad?/cpu-faer",
    "tenferro-internal-ops/cpu-faer",
    "tenferro-tensor/cpu-faer",
]
cpu-blas = [
    "tenferro/cpu-blas",
    "tenferro-ad?/cpu-blas",
    "tenferro-internal-ops/cpu-blas",
    "tenferro-tensor/cpu-blas",
]
gpu = ["tenferro-internal-ops/gpu"]
cuda = ["gpu", "tenferro/cuda", "tenferro-ad?/cuda", "tenferro-internal-ops/cuda"]
rocm = ["gpu", "tenferro/rocm", "tenferro-ad?/rocm", "tenferro-internal-ops/rocm"]

[dependencies]
tenferro = { path = "../tenferro", default-features = false }
tenferro-ad = { path = "../tenferro-ad", default-features = false, optional = true }
tenferro-internal-device = { path = "../tenferro-internal-device" }
tenferro-internal-ops = { path = "../tenferro-internal-ops", default-features = false }
tenferro-tensor = { path = "../tenferro-tensor", default-features = false }
computegraph.workspace = true
chainrules-core = { workspace = true, optional = true }
lru.workspace = true
omeco.workspace = true

[dev-dependencies]
tenferro-internal-ops = { path = "../tenferro-internal-ops", default-features = false }
criterion.workspace = true
num-complex.workspace = true

[[bench]]
name = "einsum_cpu_bench"
harness = false

[[bench]]
name = "mps_inner_product"
harness = false

[[bench]]
name = "mps_inner_product_compile"
harness = false
