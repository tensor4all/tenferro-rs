[package]
name = "tenferro-einsum"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "Subscripts, contraction planning, traced/eager einsum APIs, extension runtime, and AD rule for tenferro."

[features]
default = ["cpu-faer"]
autodiff = [
    "chainrules-core",
    "dep:tenferro-ad",
    "tenferro-internal-ops/autodiff",
]
cpu-faer = [
    "tenferro-ad?/cpu-faer",
    "tenferro-cpu/cpu-faer",
]
cpu-blas = [
    "tenferro-ad?/cpu-blas",
    "tenferro-cpu/cpu-blas",
]
cuda = ["tenferro-ad?/cuda", "tenferro-internal-ops/cuda"]
rocm = ["tenferro-ad?/rocm", "tenferro-internal-ops/rocm"]

[dependencies]
tenferro-runtime = { path = "../tenferro-runtime", default-features = false }
tenferro-ad = { path = "../tenferro-ad", default-features = false, optional = true }
tenferro-internal-device = { path = "../tenferro-internal-device" }
tenferro-internal-extension-macros = { path = "../tenferro-internal-extension-macros" }
tenferro-internal-ops = { path = "../tenferro-internal-ops", default-features = false }
tenferro-tensor = { path = "../tenferro-tensor", default-features = false }
tenferro-cpu = { path = "../tenferro-cpu", default-features = false }
computegraph.workspace = true
chainrules-core = { workspace = true, optional = true }
lru.workspace = true
omeco.workspace = true

[dev-dependencies]
tenferro-internal-ops = { path = "../tenferro-internal-ops", default-features = false }
criterion.workspace = true
num-complex.workspace = true

[[bench]]
name = "einsum_cpu_bench"
harness = false
required-features = ["autodiff"]

[[bench]]
name = "mps_inner_product"
harness = false

[[bench]]
name = "mps_inner_product_compile"
harness = false
