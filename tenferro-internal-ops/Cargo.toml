[package]
name = "tenferro-internal-ops"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "Graph op vocabulary and AD rule implementations for the tenferro workspace."

[lib]
name = "tenferro_ops"

[features]
default = ["autodiff"]
autodiff = ["chainrules-core"]
gpu = []
cuda = ["gpu"]
rocm = ["gpu"]

[dependencies]
tenferro-core-ops = { path = "../tenferro-core-ops" }
tenferro-tensor = { path = "../tenferro-tensor", default-features = false }
tenferro-internal-extension-macros = { path = "../tenferro-internal-extension-macros" }
computegraph.workspace = true
chainrules-core = { workspace = true, optional = true }
num-complex.workspace = true
thiserror.workspace = true
