[package]
name = "tenferro-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "Runtime extension dispatch and cache infrastructure for tenferro."

[features]
default = ["cpu-faer"]
cpu-faer = ["tenferro-tensor/cpu-faer"]
cpu-blas = ["tenferro-tensor/cpu-blas"]
gpu = ["tenferro-tensor/gpu"]
cuda = ["gpu", "tenferro-tensor/cuda"]
rocm = ["gpu", "tenferro-tensor/rocm"]

[dependencies]
tenferro-ops = { path = "../tenferro-ops", default-features = false }
tenferro-tensor = { path = "../tenferro-tensor", default-features = false }
lru.workspace = true
thiserror.workspace = true
