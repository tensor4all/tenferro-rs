[package]
name = "tenferro-linalg"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "Linear algebra extension operations for the tenferro workspace."

[features]
default = ["cpu-faer"]
autodiff = [
    "dep:chainrules-core",
    "dep:computegraph",
    "dep:tenferro-ad",
    "tenferro-internal-ops/autodiff",
]
cpu-faer = [
    "tenferro-runtime/cpu-faer",
    "tenferro-ad?/cpu-faer",
    "tenferro-internal-ops/cpu-faer",
    "tenferro-tensor/cpu-faer",
]
cpu-blas = [
    "tenferro-runtime/cpu-blas",
    "tenferro-ad?/cpu-blas",
    "tenferro-internal-ops/cpu-blas",
    "tenferro-tensor/cpu-blas",
]
cuda = ["tenferro-ad?/cuda", "tenferro-internal-ops/cuda"]
rocm = ["tenferro-ad?/rocm", "tenferro-internal-ops/rocm"]

[dependencies]
tenferro-runtime = { path = "../tenferro-runtime", default-features = false }
tenferro-ad = { path = "../tenferro-ad", default-features = false, optional = true }
tenferro-internal-ops = { path = "../tenferro-internal-ops", default-features = false }
tenferro-tensor = { path = "../tenferro-tensor", default-features = false }
chainrules-core = { workspace = true, optional = true }
computegraph = { workspace = true, optional = true }
num-complex.workspace = true
