[package]
name = "tenferro-tropical"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Tropical semiring tensor operations (MaxPlus, MinPlus, MaxMul) for the tenferro workspace."
publish = false

[dependencies]
tenferro-device = { path = "../../tenferro-device" }
tenferro-algebra = { path = "../../tenferro-algebra" }
tenferro-prims = { path = "../../tenferro-prims" }
strided-view.workspace = true
strided-traits.workspace = true
strided-perm.workspace = true
num-traits = { workspace = true }
tropical-gemm = { git = "https://github.com/TensorBFS/tropical-gemm", version = "0.2" }

[dev-dependencies]
tenferro-einsum = { path = "../../tenferro-einsum" }
tenferro-tensor = { path = "../../tenferro-tensor" }
