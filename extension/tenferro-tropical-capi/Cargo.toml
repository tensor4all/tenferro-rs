[package]
name = "tenferro-ext-tropical-capi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "C-API (FFI) for tropical semiring tensor operations (MaxPlus, MinPlus, MaxMul einsum)."

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
tenferro-algebra = { path = "../../tenferro-algebra" }
tenferro-device = { path = "../../tenferro-device" }
tenferro-capi = { path = "../../tenferro-capi" }
tenferro_tropical = { package = "tenferro-ext-tropical", path = "../tenferro-tropical" }
tenferro-einsum = { path = "../../tenferro-einsum" }
tenferro-prims = { path = "../../tenferro-prims" }
tenferro-tensor = { path = "../../tenferro-tensor" }
