[package]
name = "t4a-tblis-src"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
authors = ["Tensor4All contributors"]
publish = true
readme = "README.md"
repository = "https://github.com/tensor4all/tenferro-rs"
homepage = "https://tensor4all.org/tenferro-rs/"
documentation = "https://docs.rs/t4a-tblis-src"
description = "Tensor4All-maintained source-build link crate for the TBLIS native library."
keywords = ["tensor", "linear-algebra", "ffi", "source-build"]
categories = ["external-ffi-bindings", "mathematics", "science"]
links = "tblis"
build = "build.rs"
include = [
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "NOTICE.md",
    "THIRD_PARTY_LICENSES.md",
    "licenses/**",
    "build.rs",
    "cmake/**",
    "src/**",
]

[features]
default = []
build_from_source = []
static = []

[build-dependencies]
cmake = "0.1"

[workspace]
