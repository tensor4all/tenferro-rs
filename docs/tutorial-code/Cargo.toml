[package]
name = "tenferro-tutorial-code"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["cpu-faer", "xla-pjrt", "doc-snippets"]
cpu-faer = [
    "tenferro-ad/cpu-faer",
    "tenferro-cpu/cpu-faer",
    "tenferro-linalg/cpu-faer",
    "dep:tenferro-tensor",
]
# cpu-blas selects tenferro's BLAS/LAPACK-backed operation path. The direct
# cblas-sys and lapack dependencies are the downstream interop surface for
# issue #1602: they make the native entry points callable from tutorial code.
# The native provider library itself is supplied either by a provider feature
# such as blas-openblas below, or by the build environment (e.g. CI links the
# system OpenBLAS through RUSTFLAGS).
cpu-blas = [
    "tenferro-ad/cpu-blas",
    "tenferro-cpu/cpu-blas",
    "tenferro-linalg/cpu-blas",
    "dep:tenferro-tensor",
    "dep:cblas-sys",
    "dep:lapack",
]
# Exactly one BLAS/LAPACK provider feature may be enabled; tenferro-cpu
# rejects simultaneous native providers at build time. blas-openblas is the
# provider used by the tutorial examples and by the docs CI lane.
# openblas-src is referenced (not just depended on) because the from-source
# provider builds the native library through its build script; an unreferenced
# empty rlib would be pruned from the final link together with its native
# library metadata.
blas-openblas = [
    "cpu-blas",
    "tenferro-cpu/blas-openblas",
    "dep:openblas-src",
]
xla-pjrt = ["tenferro-xla/pjrt"]
apple-shared = [
    "dep:tenferro-fft",
    "dep:tenferro-gpu",
    "dep:tenferro-tensor",
    "tenferro-fft/autodiff",
]
doc-snippets = ["dep:tenferro-fft", "dep:tenferro-gpu", "dep:tenferro-tensor", "dep:tenferro-ext-sparse", "dep:tenferro-ext-tropical", "tenferro-fft/webgpu", "tenferro-gpu/cuda", "tenferro-ext-sparse/autodiff", "tenferro-ext-tropical/autodiff"]
cuda = [
    "dep:tenferro-fft",
    "dep:tenferro-gpu",
    "dep:tenferro-tensor",
    "tenferro-fft/cuda",
    "tenferro-gpu/cuda",
]

[dependencies]
faer.workspace = true
ndarray = "0.16"
num-complex.workspace = true
tenferro-ad = { path = "../../crates/tenferro-ad", default-features = false }
tenferro-cpu = { path = "../../crates/tenferro-cpu", default-features = false }
tenferro-einsum = { path = "../../crates/tenferro-einsum", default-features = false, features = ["autodiff"] }
tenferro-fft = { path = "../../crates/tenferro-fft", default-features = false, features = ["webgpu"], optional = true }
tenferro-gpu = { path = "../../crates/tenferro-gpu", default-features = false, features = ["webgpu"], optional = true }
tenferro-linalg = { path = "../../crates/tenferro-linalg", default-features = false, features = ["autodiff"] }
tenferro-ops = { package = "tenferro-internal-ops", path = "../../crates/tenferro-internal-ops" }
tenferro-runtime = { path = "../../crates/tenferro-runtime", default-features = false }
tenferro-tensor = { path = "../../crates/tenferro-tensor", optional = true }
tenferro-xla = { path = "../../crates/tenferro-xla", default-features = false }
cblas-sys = { workspace = true, optional = true }
lapack = { workspace = true, optional = true }
openblas-src = { version = "0.10", optional = true }
tenferro-ext-sparse = { package = "tenferro-ext-sparse", path = "../../ext/sparse", optional = true, features = ["autodiff"] }
tenferro-ext-tropical = { package = "tenferro-ext-tropical", path = "../../ext/tropical", optional = true, features = ["autodiff"] }

[[bin]]
name = "typed_tensor_non_ad"
path = "src/bin/typed_tensor_non_ad.rs"

[[bin]]
name = "faer_interop"
path = "src/bin/faer_interop.rs"
required-features = ["cpu-faer"]

[[bin]]
name = "blas_interop"
path = "src/bin/blas_interop.rs"
required-features = ["cpu-blas"]

[[bin]]
name = "storage_element_access"
path = "src/bin/storage_element_access.rs"

[[bin]]
name = "direct_linalg_quickstart"
path = "src/bin/direct_linalg_quickstart.rs"

[[bin]]
name = "eager_autodiff_pytorch_style"
path = "src/bin/eager_autodiff_pytorch_style.rs"

[[bin]]
name = "traced_autodiff_jax_style"
path = "src/bin/traced_autodiff_jax_style.rs"

[[bin]]
name = "einsum_subscripts_to_gradients"
path = "src/bin/einsum_subscripts_to_gradients.rs"

[[bin]]
name = "xla_einsum_backend"
path = "src/bin/xla_einsum_backend.rs"

[[bin]]
name = "xla_pjrt_execution"
path = "src/bin/xla_pjrt_execution.rs"

[[bin]]
name = "dynamic_shape_truncated_svd"
path = "src/bin/dynamic_shape_truncated_svd.rs"

[[bin]]
name = "complex_ad_convention"
path = "src/bin/complex_ad_convention.rs"

[[bin]]
name = "core_tensor_snippets"
path = "src/bin/core_tensor_snippets.rs"
required-features = ["doc-snippets"]

[[bin]]
name = "math_snippets"
path = "src/bin/math_snippets.rs"
required-features = ["doc-snippets"]

[[bin]]
name = "execution_snippets"
path = "src/bin/execution_snippets.rs"
required-features = ["doc-snippets"]

[[bin]]
name = "extension_snippets"
path = "src/bin/extension_snippets.rs"
required-features = ["doc-snippets"]

[[bin]]
name = "tenferro_compute_skill"
path = "src/bin/tenferro_compute_skill.rs"
required-features = ["doc-snippets"]

[[bin]]
name = "apple_shared_fft"
path = "src/bin/apple_shared_fft.rs"
required-features = ["apple-shared"]

[[bin]]
name = "apple_shared_cholesky"
path = "src/bin/apple_shared_cholesky.rs"
required-features = ["apple-shared"]

[[bin]]
name = "cuda_fft"
path = "src/bin/cuda_fft.rs"
required-features = ["cuda"]

[[test]]
name = "tutorial_binaries"
path = "tests/tutorial_binaries.rs"
required-features = ["doc-snippets"]
