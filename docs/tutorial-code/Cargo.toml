[package]
name = "tenferro-tutorial-code"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["cpu-faer", "xla-pjrt"]
cpu-faer = ["tenferro-ad/cpu-faer", "tenferro-cpu/cpu-faer", "tenferro-linalg/cpu-faer"]
cpu-blas = ["tenferro-ad/cpu-blas", "tenferro-cpu/cpu-blas", "tenferro-linalg/cpu-blas"]
xla-pjrt = ["tenferro-xla/pjrt"]

[dependencies]
num-complex.workspace = true
tenferro-ad = { path = "../../crates/tenferro-ad", default-features = false }
tenferro-cpu = { path = "../../crates/tenferro-cpu", default-features = false }
tenferro-einsum = { path = "../../crates/tenferro-einsum", default-features = false, features = ["autodiff"] }
tenferro-linalg = { path = "../../crates/tenferro-linalg", default-features = false, features = ["autodiff"] }
tenferro-runtime = { path = "../../crates/tenferro-runtime", default-features = false }
tenferro-xla = { path = "../../crates/tenferro-xla", default-features = false }

[[bin]]
name = "typed_tensor_non_ad"
path = "src/bin/typed_tensor_non_ad.rs"

[[bin]]
name = "direct_linalg_quickstart"
path = "src/bin/direct_linalg_quickstart.rs"

[[bin]]
name = "eager_autodiff_pytorch_style"
path = "src/bin/eager_autodiff_pytorch_style.rs"

[[bin]]
name = "traced_autodiff_jax_style"
path = "src/bin/traced_autodiff_jax_style.rs"

[[bin]]
name = "einsum_subscripts_to_gradients"
path = "src/bin/einsum_subscripts_to_gradients.rs"

[[bin]]
name = "xla_einsum_backend"
path = "src/bin/xla_einsum_backend.rs"

[[bin]]
name = "xla_pjrt_execution"
path = "src/bin/xla_pjrt_execution.rs"

[[bin]]
name = "dynamic_shape_truncated_svd"
path = "src/bin/dynamic_shape_truncated_svd.rs"

[[bin]]
name = "complex_ad_convention"
path = "src/bin/complex_ad_convention.rs"
