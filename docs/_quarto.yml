project:
  type: website
  output-dir: ../target/docs-site
  render:
    - index.md
    - getting-started/**/*.md
    - tutorials/**/*.md
    - guides/**/*.md
    - performance/**/*.md
    - api/**/*.md
    - internals/**/*.md
    - architecture/**/*.md
    - spec/**/*.md

format:
  html:
    theme: flatly
    toc: true
    code-overflow: wrap
    html-math-method: katex

website:
  title: "tenferro"
  sidebar:
    style: docked
    contents:
      - index.md
      - section: "Getting Started"
        contents:
          - getting-started/index.md
          - getting-started/core-concepts.md
          - getting-started/pytorch-jax-mapping.md
      - section: "Tutorials"
        contents:
          - tutorials/index.md
          - tutorials/typed-tensor-non-ad.md
          - tutorials/eager-autodiff-pytorch-style.md
          - tutorials/traced-autodiff-jax-style.md
      - section: "Guides"
        contents:
          - text: "Choosing a Tensor API"
            href: guides/choosing-an-api.md
          - guides/execution-models.md
          - guides/eager-operations.md
          - guides/tensor-operations.md
          - guides/einsum.md
          - guides/linear-algebra.md
          - guides/custom-operations.md
          - text: "FFT (extension)"
            href: guides/tenferro-fft.md
          - guides/autodiff.md
          - guides/devices-and-gpu.md
          - guides/memory-order.md
          - text: "Parallelism and Caching"
            href: guides/parallelism-and-caching.md
          - guides/troubleshooting.md
      - section: "API"
        contents:
          - api/index.md
      - section: "Performance"
        contents:
          - performance/cpu-benchmarks.md
          - performance/cpu-benchmark-results-2026-05-23.md
          - performance/tt-inner-product-overhead.md
      - section: "Internals"
        contents:
          - internals/index.md
          - section: "Architecture"
            contents:
              - architecture/index.md
              - architecture/tenferro-crates.md
              - architecture/computegraph.md
              - architecture/chainrules.md
              - architecture/tidu.md
              - architecture/ad-pipeline.md
          - section: "Specification"
            contents:
              - spec/index.md
              - spec/primitive-catalog.md
              - spec/backend-contract.md
              - spec/ad-contract.md
              - spec/extension-op.md
              - spec/optimizer-passes.md
              - spec/tensor-semantics.md
