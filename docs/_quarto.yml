project:
  type: website
  output-dir: ../target/docs-site
  render:
    - index.md
    - getting-started/**/*.md
    - tutorials/**/*.md
    - guides/**/*.md
    - performance/**/*.md
    - api/**/*.md
    - internals/**/*.md
    - architecture/**/*.md
    - spec/**/*.md
    - design/**/*.md
    - oracle/**/*.md

format:
  html:
    theme: flatly
    toc: true
    code-overflow: wrap
    html-math-method: katex

