project:
  type: website
  output-dir: ../target/docs-site/design
  render:
    - index.md
    - getting-started/**/*.md
    - architecture/**/*.md
    - spec/**/*.md
    - design/**/*.md
    - oracle/**/*.md
    - reference/**/*.md

format:
  html:
    theme: flatly
    toc: true
    code-overflow: wrap
    html-math-method: katex

website:
  title: "tenferro-rs Documentation"
  sidebar:
    style: docked
    contents:
      - index.md
      - section: "Getting Started"
        contents:
          - getting-started/index.md
          - getting-started/quick-start.md
          - getting-started/einsum-examples.md
          - getting-started/autodiff-examples.md
      - section: "Architecture"
        contents:
          - architecture/index.md
          - architecture/tenferro-crates.md
          - architecture/computegraph.md
          - architecture/chainrules.md
          - architecture/tidu.md
          - architecture/ad-pipeline.md
      - section: "Specification"
        contents:
          - spec/index.md
          - spec/primitive-catalog.md
          - spec/backend-contract.md
          - spec/ad-contract.md
          - spec/optimizer-passes.md
          - spec/tensor-semantics.md
      - section: "Implementation Design"
        contents:
          - design/index.md
          - design/supported-ops.md
          - design/device.md
          - design/tensor.md
          - design/algebra.md
          - design/tensor-prims.md
          - design/contraction-pipeline.md
          - design/einsum.md
          - design/einsum-cpu-porting-notes.md
          - design/einsum-dyadtensor.md
          - design/gpu-backend-design.md
          - design/inplace-indexing.md
          - design/linalg.md
          - design/linalg-prims.md
          - design/capi.md
          - design/capi-error-handling.md
          - design/testing.md
      - section: "Oracle Replay"
        contents:
          - oracle/index.md
          - oracle/tensor-ad-oracles-support.md
      - section: "Reference"
        contents:
          - reference/index.md
          - reference/jax-primitives.md
          - reference/stablehlo-primitives.md
          - reference/jax-stablehlo-needed.md
          - reference/ad-graph-experiments.md
          - reference/libtorch.md
          - reference/itensor-ecosystem.md
          - reference/einsum-algorithm-comparison.md
          - reference/pytorch-dense-cpu-parity.md
