project:
  type: website
  output-dir: ../target/docs-site/design
  render:
    - index.md
    - getting-started/**/*.md
    - guides/**/*.md
    - api/**/*.md
    - internals/**/*.md

format:
  html:
    theme: flatly
    toc: true
    code-overflow: wrap
    html-math-method: katex

website:
  title: "tenferro"
  sidebar:
    style: docked
    contents:
      - index.md
      - section: "Getting Started"
        contents:
          - getting-started/index.md
          - getting-started/core-concepts.md
          - getting-started/pytorch-jax-mapping.md
      - section: "Guides"
        contents:
          - guides/eager-operations.md
          - guides/tensor-operations.md
          - guides/einsum.md
          - guides/linear-algebra.md
          - guides/autodiff.md
          - guides/performance.md
      - section: "API"
        contents:
          - api/index.md
      - section: "Internals"
        contents:
          - internals/index.md
