<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" role="img" aria-labelledby="tensor-layer-title tensor-layer-desc">
  <title id="tensor-layer-title">Decision tree for choosing a tenferro tensor model</title>
  <desc id="tensor-layer-desc">A yes or no flowchart chooses between TracedTensor, EagerTensor, TypedTensor, and Tensor. A separate note says CPU and CUDA are backend choices, not tensor models.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 24px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 700 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .text { font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .answer { font: 700 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1d4ed8; }
      .line { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .question { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
      .typed { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; }
      .tensor { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
      .eager { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
      .traced { fill: #fae8ff; stroke: #a21caf; stroke-width: 1.5; }
      .note { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
    </style>
  </defs>

  <text x="330" y="42" class="title">Choose the tensor model first</text>

  <rect x="330" y="78" width="420" height="78" rx="8" class="question"/>
  <text x="372" y="106" class="label">Need graph transforms or graph reuse?</text>
  <text x="390" y="130" class="text">grad / vjp / jvp, symbolic inputs, compile once/run many</text>

  <path d="M 750 117 H 835" class="line"/>
  <text x="785" y="106" class="answer">yes</text>
  <rect x="850" y="72" width="190" height="92" rx="8" class="traced"/>
  <text x="893" y="103" class="label">TracedTensor</text>
  <text x="878" y="127" class="text">GraphCompiler</text>
  <text x="875" y="147" class="text">GraphExecutor&lt;B&gt;</text>

  <path d="M 540 156 V 228" class="line"/>
  <text x="555" y="194" class="answer">no</text>

  <rect x="330" y="230" width="420" height="78" rx="8" class="question"/>
  <text x="380" y="258" class="label">Need an eager runtime?</text>
  <text x="370" y="282" class="text">Immediate forward execution in one runtime, optional backward</text>

  <path d="M 750 269 H 835" class="line"/>
  <text x="785" y="258" class="answer">yes</text>
  <rect x="850" y="224" width="190" height="92" rx="8" class="eager"/>
  <text x="898" y="255" class="label">EagerTensor</text>
  <text x="891" y="279" class="text">EagerRuntime</text>
  <text x="874" y="299" class="text">tracked values use backward()</text>

  <path d="M 540 308 V 380" class="line"/>
  <text x="555" y="346" class="answer">no</text>

  <rect x="330" y="382" width="420" height="78" rx="8" class="question"/>
  <text x="376" y="410" class="label">Known scalar type at compile time?</text>
  <text x="388" y="434" class="text">fixed f64 / f32 / complex type in ordinary Rust code</text>

  <path d="M 330 421 H 245 V 510 H 200" class="line"/>
  <text x="258" y="408" class="answer">yes</text>
  <rect x="40" y="470" width="160" height="92" rx="8" class="typed"/>
  <text x="70" y="502" class="label">TypedTensor&lt;T&gt;</text>
  <text x="70" y="526" class="text">fixed dtype</text>
  <text x="62" y="546" class="text">host-friendly data</text>

  <path d="M 750 421 H 835 V 510 H 850" class="line"/>
  <text x="785" y="408" class="answer">no</text>
  <rect x="850" y="470" width="160" height="92" rx="8" class="tensor"/>
  <text x="905" y="502" class="label">Tensor</text>
  <text x="888" y="526" class="text">runtime dtype</text>
  <text x="875" y="546" class="text">broad concrete ops</text>

  <rect x="230" y="586" width="620" height="52" rx="8" class="note"/>
  <text x="266" y="608" class="label">Then choose a backend/device: CpuBackend or CudaBackend.</text>
  <text x="298" y="628" class="small">CUDA is orthogonal to the tensor model and uses explicit upload/download.</text>
</svg>
