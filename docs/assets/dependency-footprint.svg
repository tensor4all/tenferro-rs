<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" role="img" aria-labelledby="dep-title dep-desc">
  <title id="dep-title">tenferro-rs workspace dependency footprint</title>
  <desc id="dep-desc">A transitive-reduced dependency diagram seeded from scripts/gen_dep_graph.py. Foundation crates feed tensor and backend crates, which feed runtime, autodiff, standard operation extensions, and tutorial code.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 25px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .label { font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .layer { font: 700 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; text-transform: uppercase; }
      .box { stroke-width: 1.5; rx: 8; }
      .foundation { fill: #eef2ff; stroke: #6366f1; }
      .backend { fill: #ecfdf5; stroke: #059669; }
      .runtime { fill: #fff7ed; stroke: #ea580c; }
      .ad { fill: #fdf2f8; stroke: #db2777; }
      .extension { fill: #e0f2fe; stroke: #0284c7; }
      .tutorial { fill: #fefce8; stroke: #ca8a04; }
      .line { stroke: #334155; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .line-soft { stroke: #64748b; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="295" y="44" class="title">tenferro-rs dependency footprint</text>
  <text x="282" y="66" class="subtitle">Transitive-reduced workspace edges, seeded from scripts/gen_dep_graph.py</text>

  <text x="58" y="120" class="layer">Foundation</text>
  <rect x="50" y="136" width="210" height="56" class="box foundation"/>
  <text x="80" y="160" class="label">tenferro-tensor-core</text>
  <text x="80" y="180" class="small">layout, dtype, host data</text>

  <rect x="300" y="136" width="180" height="56" class="box foundation"/>
  <text x="332" y="160" class="label">tenferro-core-ops</text>
  <text x="332" y="180" class="small">operation catalog</text>

  <rect x="520" y="136" width="270" height="56" class="box foundation"/>
  <text x="545" y="160" class="label">tenferro-internal-extension-macros</text>
  <text x="545" y="180" class="small">extension registration macros</text>

  <text x="58" y="265" class="layer">Tensor And Backends</text>
  <rect x="150" y="280" width="170" height="58" class="box backend"/>
  <text x="178" y="305" class="label">tenferro-tensor</text>
  <text x="178" y="325" class="small">runtime tensor contracts</text>

  <rect x="50" y="410" width="150" height="58" class="box backend"/>
  <text x="82" y="435" class="label">tenferro-cpu</text>
  <text x="82" y="455" class="small">CPU execution</text>

  <rect x="250" y="410" width="150" height="58" class="box backend"/>
  <text x="282" y="435" class="label">tenferro-gpu</text>
  <text x="282" y="455" class="small">CUDA / WebGPU</text>

  <rect x="455" y="280" width="210" height="58" class="box backend"/>
  <text x="482" y="305" class="label">tenferro-internal-ops</text>
  <text x="482" y="325" class="small">standard op semantics</text>

  <text x="735" y="265" class="layer">Runtime And AD</text>
  <rect x="735" y="280" width="170" height="58" class="box runtime"/>
  <text x="765" y="305" class="label">tenferro-runtime</text>
  <text x="765" y="325" class="small">graph and dispatch</text>

  <rect x="650" y="410" width="140" height="58" class="box runtime"/>
  <text x="690" y="435" class="label">tenferro-xla</text>
  <text x="690" y="455" class="small">StableHLO / PJRT</text>

  <rect x="840" y="410" width="140" height="58" class="box ad"/>
  <text x="878" y="435" class="label">tenferro-ad</text>
  <text x="878" y="455" class="small">eager and traced AD</text>

  <text x="58" y="555" class="layer">Standard Operation Extensions</text>
  <rect x="130" y="570" width="155" height="58" class="box extension"/>
  <text x="160" y="595" class="label">tenferro-einsum</text>
  <text x="160" y="615" class="small">contractions</text>

  <rect x="355" y="570" width="155" height="58" class="box extension"/>
  <text x="385" y="595" class="label">tenferro-linalg</text>
  <text x="385" y="615" class="small">decompositions</text>

  <rect x="580" y="570" width="155" height="58" class="box extension"/>
  <text x="620" y="595" class="label">tenferro-fft</text>
  <text x="620" y="615" class="small">Fourier ops</text>

  <rect x="820" y="570" width="180" height="58" class="box tutorial"/>
  <text x="848" y="595" class="label">tenferro-tutorial-code</text>
  <text x="848" y="615" class="small">runnable docs examples</text>

  <path d="M 155 192 V 250 H 235 V 280" class="line"/>
  <path d="M 390 192 V 250 H 235 V 280" class="line"/>
  <path d="M 235 338 V 410" class="line"/>
  <path d="M 235 338 V 374 H 325 V 410" class="line"/>
  <path d="M 320 309 H 455" class="line"/>
  <path d="M 655 192 V 250 H 560 V 280" class="line"/>
  <path d="M 665 309 H 735" class="line"/>

  <path d="M 820 338 V 410" class="line"/>
  <path d="M 820 338 V 374 H 720 V 410" class="line-soft"/>
  <path d="M 125 468 V 506 H 875 V 410" class="line-soft"/>
  <path d="M 325 468 V 506 H 895 V 410" class="line-soft"/>

  <path d="M 910 468 V 540 H 208 V 570" class="line"/>
  <path d="M 910 468 V 540 H 433 V 570" class="line"/>
  <path d="M 910 468 V 540 H 658 V 570" class="line"/>

  <path d="M 208 628 V 680 H 910 V 628" class="line-soft"/>
  <path d="M 433 628 V 680 H 910 V 628" class="line-soft"/>
  <path d="M 720 468 V 680 H 910 V 628" class="line-soft"/>

  <text x="55" y="716" class="subtitle">Only workspace-internal edges are shown. External crates such as faer, CubeCL, tidu, and num-complex are intentionally omitted.</text>
</svg>
