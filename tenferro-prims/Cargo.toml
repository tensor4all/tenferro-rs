[package]
name = "tenferro-prims"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "Semiring, scalar, and analytic tensor execution families for the tenferro workspace."

[features]
default = ["gemm-faer"]
cuda = ["dep:cudarc", "tenferro-tensor/cuda"]
gemm-faer = ["dep:faer"]
gemm-blas = ["dep:cblas-sys"]
# Backward-compatible alias: use `--no-default-features --features gemm-openblas`.
gemm-openblas = ["gemm-blas", "provider-src", "src-openblas"]
provider-src = ["gemm-blas", "dep:blas-src", "dep:cblas-src"]
provider-inject = ["gemm-blas", "dep:cblas-inject"]
src-openblas = ["provider-src", "blas-src/openblas"]
src-netlib = ["provider-src", "blas-src/netlib"]
src-accelerate = ["provider-src", "blas-src/accelerate"]
src-r = ["provider-src", "blas-src/r"]
src-intel-mkl-dynamic-sequential = ["provider-src", "blas-src/intel-mkl-dynamic-sequential"]
src-intel-mkl-dynamic-parallel = ["provider-src", "blas-src/intel-mkl-dynamic-parallel"]
src-intel-mkl-static-sequential = ["provider-src", "blas-src/intel-mkl-static-sequential"]
src-intel-mkl-static-parallel = ["provider-src", "blas-src/intel-mkl-static-parallel"]

[dependencies]
tenferro-device = { path = "../tenferro-device" }
tenferro-algebra = { path = "../tenferro-algebra" }
tenferro-tensor = { path = "../tenferro-tensor" }
strided-view.workspace = true
strided-traits.workspace = true
strided-perm.workspace = true
strided-kernel.workspace = true
rayon = "1.10"
libloading.workspace = true
num-complex.workspace = true
num-traits.workspace = true
faer = { workspace = true, optional = true }
cblas-sys = { workspace = true, optional = true }
cblas-src = { workspace = true, optional = true }
cblas-inject = { workspace = true, optional = true }
blas-src = { workspace = true, optional = true }
cudarc = { workspace = true, optional = true }

[dev-dependencies]
