[package]
name = "tenferro-prims"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "Tensor primitive operations (TensorPrims trait) for the tenferro workspace."

[features]
default = []
cuda = ["dep:cudarc"]

[dependencies]
tenferro-device = { path = "../tenferro-device" }
tenferro-algebra = { path = "../tenferro-algebra" }
tenferro-tensor = { path = "../tenferro-tensor" }
strided-view.workspace = true
strided-traits.workspace = true
strided-perm.workspace = true
rayon = "1.10"
libloading.workspace = true
num-complex.workspace = true
cudarc = { version = "0.19", optional = true, default-features = false, features = ["driver", "dynamic-loading", "cuda-12060"] }

[dev-dependencies]
