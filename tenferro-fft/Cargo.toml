[package]
name = "tenferro-fft"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "FFT extension operations for tenferro."

[features]
default = ["autodiff", "cpu-faer"]
autodiff = ["chainrules-core", "tenferro/autodiff", "tenferro-internal-ops/autodiff"]
cpu-faer = ["tenferro/cpu-faer", "tenferro-internal-ops/cpu-faer", "tenferro-tensor/cpu-faer"]
cpu-blas = ["tenferro/cpu-blas", "tenferro-internal-ops/cpu-blas", "tenferro-tensor/cpu-blas"]
gpu = ["tenferro/gpu", "tenferro-internal-ops/gpu"]
cuda = ["gpu", "tenferro/cuda", "tenferro-internal-ops/cuda"]
rocm = ["gpu", "tenferro/rocm", "tenferro-internal-ops/rocm"]

[dependencies]
tenferro = { path = "../tenferro", default-features = false }
tenferro-tensor = { path = "../tenferro-tensor", default-features = false }
tenferro-internal-ops = { path = "../tenferro-internal-ops", default-features = false }
chainrules-core = { workspace = true, optional = true }
computegraph.workspace = true
num-complex.workspace = true
num-traits.workspace = true
rustfft = "6"
