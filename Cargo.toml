[workspace]
members = [
    # core
    "tenferro-device",
    "tenferro-algebra",
    "tenferro-prims",
    "tenferro-tensor",
    "tenferro-einsum",
    "tenferro-linalg",
    "tenferro-capi",
    # extension
    "extension/tenferro-tropical",
    "extension/tenferro-tropical-capi",
    # extern (general-purpose, non-tenferro)
    "extern/chainrules-core",
    "extern/chainrules",
]
resolver = "2"

[workspace.dependencies]
num-complex = "0.4"
num-traits = "0.2"
thiserror = "2"
