[workspace]
members = [
    # v2 core (6 crates)
    "tenferro-internal-device",
    "tenferro-internal-tensor",
    "tenferro-internal-gpubackend",
    "tenferro-internal-runtime",
    "tenferro-internal-extension-macros",
    "tenferro-internal-ops",
    "tenferro-einsum",
    "tenferro-linalg",
    "tenferro-fft",
    "tenferro",
]
exclude = [
    # External extension crates depend only on the public `tenferro` facade
    # where possible, are NOT core workspace members, and run their own tests
    # standalone.
    "ext/tropical",
]
default-members = [
    "tenferro-internal-tensor",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Hiroshi Shinaoka <h.shinaoka@gmail.com>", "GiggleLiu <cacate0129@gmail.com>"]
publish = false

[workspace.dependencies]
num-complex = "0.4"
num-traits = "0.2"
thiserror = "2"
smallvec = "1"
criterion = "0.5"
serde = "1"
serde_json = "1"
lru = "0.12"
proc-macro2 = "1"
quote = "1"
syn = "2"
chainrules-core = { git = "https://github.com/tensor4all/chainrules-rs.git", rev = "2d7662140d92f0dd73b2402aefc2272feafc9270", package = "chainrules" }
chainrules = { git = "https://github.com/tensor4all/chainrules-rs.git", rev = "2d7662140d92f0dd73b2402aefc2272feafc9270" }
tidu = { git = "https://github.com/tensor4all/tidu-rs.git", rev = "1694275361d2f16abfb3f25ad7941407c88b7c09" }
strided-view = { git = "https://github.com/tensor4all/strided-rs", rev = "ea37986f4d9cb99cfc1f62a1d4aea561cb3a9722" }
strided-traits = { git = "https://github.com/tensor4all/strided-rs", rev = "ea37986f4d9cb99cfc1f62a1d4aea561cb3a9722" }
strided-perm = { git = "https://github.com/tensor4all/strided-rs", rev = "ea37986f4d9cb99cfc1f62a1d4aea561cb3a9722", features = ["parallel"] }
strided-kernel = { git = "https://github.com/tensor4all/strided-rs", rev = "ea37986f4d9cb99cfc1f62a1d4aea561cb3a9722" }
libloading = "0.8"
faer = "0.24"
cblas-sys = "0.1"
cblas-src = "0.1.3"
cblas-inject = "0.1.1"
blas-src = { version = "0.14", default-features = false }
lapack = "0.20"
lapack-src = "0.13"
lapack-inject = "0.1.2"
cudarc = { version = "0.19", default-features = false, features = ["driver", "runtime", "nvrtc", "dynamic-loading", "cuda-12000"] }
cubecl = { git = "https://github.com/tensor4all/cubecl.git", rev = "f5e5ec178f9aebca9362b829ffef708f720ff692", features = ["cuda"] }
cubecl-cuda = { git = "https://github.com/tensor4all/cubecl.git", rev = "f5e5ec178f9aebca9362b829ffef708f720ff692" }
cubecl-runtime = { git = "https://github.com/tensor4all/cubecl.git", rev = "f5e5ec178f9aebca9362b829ffef708f720ff692" }
tenferro-internal-gpubackend = { path = "tenferro-internal-gpubackend" }
sha2 = "0.10"
omeco = "0.2.4"
computegraph = { git = "https://github.com/tensor4all/computegraph-rs.git", rev = "c20e8912560ef11166418bcea089126ef50443cc" }
