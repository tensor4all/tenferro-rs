[workspace]
members = [
    # core
    "tenferro-device",
    "tenferro-algebra",
    "tenferro-prims",
    "tenferro-tensor",
    "tenferro-einsum",
    "tenferro-linalg-prims",
    "tenferro-linalg",
    "tenferro-tensor-compute",
    "tenferro-capi",
    # extension
    "extension/tenferro-tropical",
    "extension/tenferro-tropical-capi",
    "extension/tenferro-burn",
    "extension/tenferro-mdarray",
    "extension/tenferro-ndarray",
    "tenferro",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Hiroshi Shinaoka <h.shinaoka@gmail.com>", "GiggleLiu <cacate0129@gmail.com>"]
publish = false

[workspace.dependencies]
num-complex = "0.4"
num-traits = "0.2"
thiserror = "2"
criterion = "0.5"
serde = "1"
serde_json = "1"
chainrules-core = { git = "https://github.com/tensor4all/chainrules-rs", rev = "c45a23093df0b4d8967888a8b1b7bb40ffbfeb18" }
chainrules = { git = "https://github.com/tensor4all/chainrules-rs", rev = "c45a23093df0b4d8967888a8b1b7bb40ffbfeb18" }
tidu = { git = "https://github.com/tensor4all/tidu-rs", rev = "56053580ecc5ef9ffa41e49208ad66d2e84e731e" }
strided-view = { git = "https://github.com/tensor4all/strided-rs", rev = "ea37986f4d9cb99cfc1f62a1d4aea561cb3a9722" }
strided-traits = { git = "https://github.com/tensor4all/strided-rs", rev = "ea37986f4d9cb99cfc1f62a1d4aea561cb3a9722" }
strided-perm = { git = "https://github.com/tensor4all/strided-rs", rev = "ea37986f4d9cb99cfc1f62a1d4aea561cb3a9722", features = ["parallel"] }
strided-kernel = { git = "https://github.com/tensor4all/strided-rs", rev = "ea37986f4d9cb99cfc1f62a1d4aea561cb3a9722" }
libloading = "0.8"
faer = "0.24"
cblas-sys = "0.1"
cblas-src = "0.1.3"
cblas-inject = "0.1.0"
blas-src = { version = "0.14", default-features = false }
lapack = "0.20"
lapack-src = "0.13"
lapack-inject = "0.1.0"
cudarc = { version = "0.19", default-features = false, features = ["driver", "runtime", "nvrtc", "dynamic-loading", "cuda-12000"] }
ndarray = "0.17.2"
sha2 = "0.10"
