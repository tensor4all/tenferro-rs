[workspace]
members = [
    # v2 core crates
    "crates/tenferro-tensor-core",
    "crates/tenferro-tensor",
    "crates/tenferro-internal-cpu-kernels",
    "crates/tenferro-cpu-basic",
    "crates/tenferro-cpu-fused",
    "crates/tenferro-cpu",
    "crates/tenferro-gpu",
    "crates/tenferro-runtime",
    "crates/tenferro-xla",
    "crates/tenferro-ad",
    "crates/tenferro-internal-extension-macros",
    "crates/tenferro-core-ops",
    "crates/tenferro-internal-ops",
    "crates/tenferro-einsum",
    "crates/tenferro-linalg",
    "crates/tenferro-fft",
    # Optional adapters. Their default features select no system library, so the
    # root lanes can build them; the MPI/HDF5 backends are opt-in features.
    "crates/tenferro-mpi",
    "crates/tenferro-hdf5",
    "docs/tutorial-code",
    "ext/experiments/bf16-proof",
    "ext/experiments/df64-proof",
    "ext/experiments/scalar-consumer-algorithm",
    "ext/experiments/scalar-consumer-application",
]
exclude = [
    "ext/sparse",
    "ext/tropical",
    # Standalone workspace: `cargo creusot` needs the proof crate to be its own
    # workspace root so its `why3find.json` applies (#2682).
    "ext/proofs/split-ranges",
]
default-members = [
    "crates/tenferro-tensor",
]
resolver = "2"

[workspace.package]
version = "0.13.0"
rust-version = "1.96"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = [
    "Hiroshi Shinaoka <h.shinaoka@gmail.com>",
    "GiggleLiu <cacate0129@gmail.com>",
    "Satoshi Terasaki <https://github.com/terasakisatoshi>",
]
publish = true
readme = "README.md"
repository = "https://github.com/tensor4all/tenferro-rs"
homepage = "https://tensor4all.org/tenferro-rs/"

[workspace.dependencies]
rand = "0.8"
# Already in the dependency graph through the GPU stack; centralised here for the bf16 proof crate.
half = "2.7"
num-complex = "0.4"
num-traits = "0.2"
# Scalar `erf`/`erff` for the CPU analytic kernels (`f64::erf` is unstable in std).
libm = "0.2.16"
# 0.1.1 adds the fused activation kernels the CPU engine routes to.
elem-simd-math = "0.1.1"
thiserror = "2"
tinyvec = { version = "1", features = ["alloc"] }
criterion = "0.5"
trybuild = "1"
serde = "1"
serde_json = "1"
lru = "0.18.5"
proc-macro2 = "1"
quote = "1"
syn = "2"
# The CPU contraction/linalg stack (strided, tcontract-exec, cpueinsum, tlinalg)
# on one registry source: a split source (git beside crates.io, or two
# incompatible semver lines) gives two `StridedView` types that cannot meet at a
# crate boundary, and two `threadteam::Exec` types that cannot meet at a
# kernel boundary. Within one compatible line Cargo unifies every requirement to
# a single version, so the strided crates are ordinary caret requirements at the
# patch each API needs; the committed `Cargo.lock` fixes the exact versions a
# build uses, and `cargo update -p <crate>` moves them. Every fan-out entry of
# strided takes a `threadteam::Exec` token as its last parameter and decides
# its parallel width from that token's dispatch costs. `threadteam` (formerly
# `strided-exec`) is the only crate that depends on Rayon (see `deny.toml`);
# tenferro starts no task itself.
strided-view = "0.8.1"
strided-traits = "0.7.0"
threadteam = "0.6.0"
strided-perm = { version = "0.15.0", features = ["parallel"] }
# The CPU stack resolves to one release train of the strided and tcontract families; one
# `tcontract-exec` (check `cargo tree -i tcontract-exec`) keeps `Exec` one type.
cpueinsum = "0.13.0"
tcontract-exec = "0.13.0"
tlinalg = "0.12.0"
strided-basic = { version = "0.15.0", default-features = false }
# Fused NN kernels moved out of this repository (#2272): axis-0 softmax with a
# tensor-free contract, caller-provided scratch and the caller's `Exec` token.
strided-nn = "0.15.0"
strided-fused = { version = "0.15.0", default-features = false, features = ["parallel"] }
strided-kernel = { version = "0.15.0", features = ["parallel"] }
libloading = "0.8"
# One faer identity for the CPU stack (#1939): tlinalg and this
# dependency use compatible ranges of tensor4all's faer, published as `colmat`
# from 0.34 on (`t4a-faer` up to 0.33). 0.34 has threadteam 0.6 in its public
# API; 0.24.8 fixed divide-and-conquer SVD secular-root stagnation
# (tensor4all/faer#28). Later patch fixes need only a targeted lock update, not
# another manifest-bump cascade. Keep the `faer` key
# and library name: tenferro-cpu re-exports this build as `tenferro_cpu::faer`.
faer = { package = "colmat", version = "0.34.0", default-features = false, features = ["std", "rayon", "threadteam"] }
# CUDA 12.8 bindings; dynamic runtime gating keeps the baseline compatible with
# CUDA 12.4 driver/NVRTC libraries.
cudarc = { version = "0.19", default-features = false, features = ["driver", "runtime", "nvrtc", "dynamic-loading", "cuda-12080"] }
# The standalone CUDA runtime (tensor4all/t4a-gpu-backend) and the kernel
# catalogue with its NVRTC sources (tensor4all/t4a-cuda-kernels, ABI revision
# 15) that tenferro-gpu's CUDA engine is built on (#2208), plus the Metal
# runtime and the Metal source set the Metal engine is built on (#2402 U4).
# The CUDA runtime keeps the git pin whose revision is the one its crates.io
# release (0.1.1) was published from; scripts/check-git-pin-content.py checks
# that the two agree. The kernel catalogue and the Metal runtime resolve from
# crates.io at exact versions, so `cargo publish` keeps the same dependency;
# `t4a-metal-sys` 0.1.0 comes in transitively through the Metal runtime.
t4a-cuda-runtime = { git = "https://github.com/tensor4all/t4a-gpu-backend", rev = "147af9e03e5169ec7cef6f6d869e27ed70a43a05", version = "=0.1.1" }
# The kernel catalogue is pinned to tensor4all/t4a-cuda-kernels#37 (ABI 15, the
# layout-taking elementwise entries, tenferro-rs#2701) until 0.4.0 is published;
# the pin then returns to the crates.io exact version.
t4a-cuda-kernels = { git = "https://github.com/tensor4all/t4a-cuda-kernels", rev = "1cf73b463fe446add25a0659005b6c88928cfd8f", version = "=0.4.0" }
t4a-metal-runtime = { version = "=0.1.2" }
sha2 = "0.10"
omeco = "0.2.4"
computegraph = "0.1.0"

[profile.dev]
opt-level = 0
debug = 0
debug-assertions = true
overflow-checks = true
incremental = true

[profile.test]
opt-level = 0
debug = 0
debug-assertions = true
overflow-checks = true
incremental = true

# Hosted-CI cold builds only (`scripts/ci/run_profile.py`, CUDA archives).
# Keep local [profile.dev]/[profile.test] incremental for edit-test loops.
[profile.ci]
inherits = "test"
incremental = false
strip = "symbols"
