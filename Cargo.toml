[workspace]
members = [
    # v2 core crates
    "crates/tenferro-tensor-core",
    "crates/tenferro-tensor",
    "crates/tenferro-internal-cpu-kernels",
    "crates/tenferro-cpu-basic",
    "crates/tenferro-cpu-fused",
    "crates/tenferro-cpu",
    "crates/tenferro-gpu",
    "crates/tenferro-runtime",
    "crates/tenferro-xla",
    "crates/tenferro-ad",
    "crates/tenferro-internal-extension-macros",
    "crates/tenferro-core-ops",
    "crates/tenferro-internal-ops",
    "crates/tenferro-einsum",
    "crates/tenferro-linalg",
    "crates/tenferro-fft",
    "docs/tutorial-code",
    "ext/bf16-proof",
    "ext/df64-proof",
    "ext/scalar-consumer-algorithm",
    "ext/scalar-consumer-application",
]
exclude = ["ext/sparse", "ext/tropical"]
default-members = [
    "crates/tenferro-tensor",
]
resolver = "2"

[workspace.package]
version = "0.7.1"
rust-version = "1.96"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = [
    "Hiroshi Shinaoka <h.shinaoka@gmail.com>",
    "GiggleLiu <cacate0129@gmail.com>",
    "Satoshi Terasaki <https://github.com/terasakisatoshi>",
]
publish = true
readme = "README.md"
repository = "https://github.com/tensor4all/tenferro-rs"
homepage = "https://tensor4all.org/tenferro-rs/"

[workspace.dependencies]
rand = "0.8"
# Already in the dependency graph through the GPU stack; centralised here for the bf16 proof crate.
half = "2.7"
num-complex = "0.4"
num-traits = "0.2"
# Scalar `erf`/`erff` for the CPU analytic kernels (`f64::erf` is unstable in std).
libm = "0.2.16"
elem-simd-math = { git = "https://github.com/tensor4all/elem-simd-math-rs.git", version = "=0.1.0", rev = "63d3f8df42425f3e6398da765261a5a5d1999c30" }
thiserror = "2"
smallvec = { version = "1", features = ["union"] }
rayon = "1"
criterion = "0.5"
trybuild = "1"
serde = "1"
serde_json = "1"
lru = "0.18.5"
proc-macro2 = "1"
quote = "1"
syn = "2"
# Published strided v0.4.7, shared with the CPU contraction/linalg stack (#2004).
# Keep exact registry requirements aligned with this release revision, and keep the
# pinned providers (cpueinsum, tlinalg) on the same source: a split strided source
# gives two `RawStridedRef` types that cannot meet at a crate boundary.
strided-view = { git = "https://github.com/tensor4all/strided-rs.git", rev = "4373ba0bcb4bdc02f4c03a8a2d4896b84a47dd7c", version = "=0.4.8" }
strided-traits = { git = "https://github.com/tensor4all/strided-rs.git", rev = "4373ba0bcb4bdc02f4c03a8a2d4896b84a47dd7c", version = "=0.4.8" }
strided-perm = { git = "https://github.com/tensor4all/strided-rs.git", rev = "4373ba0bcb4bdc02f4c03a8a2d4896b84a47dd7c", version = "=0.4.8", features = ["parallel"] }
cpueinsum = { git = "https://github.com/tensor4all/cpueinsum-rs.git", rev = "50fa7785067f30c39bfc3c25ced4cbee423e90a9", version = "0.1.0" }
cpueinsum-blas = { git = "https://github.com/tensor4all/cpueinsum-rs.git", rev = "50fa7785067f30c39bfc3c25ced4cbee423e90a9", version = "0.1.0" }
strided-basic = { git = "https://github.com/tensor4all/strided-rs.git", rev = "4373ba0bcb4bdc02f4c03a8a2d4896b84a47dd7c", version = "=0.4.8", default-features = false }
strided-fused = { git = "https://github.com/tensor4all/strided-rs.git", rev = "4373ba0bcb4bdc02f4c03a8a2d4896b84a47dd7c", version = "=0.4.8", default-features = false, features = ["parallel"] }
strided-kernel = { git = "https://github.com/tensor4all/strided-rs.git", rev = "4373ba0bcb4bdc02f4c03a8a2d4896b84a47dd7c", version = "=0.4.8", features = ["parallel"] }
libloading = "0.8"
faer = { version = "0.24", default-features = false, features = ["std", "rayon"] }
cblas-sys = "0.1"
cblas-inject = "0.1.1"
blas-src = { version = "0.14", default-features = false }
lapack = "0.20"
lapack-src = "0.13"
lapack-inject = "0.1.2"
# Compile both CubeCL runtime paths with CUDA 12.8 bindings. Dynamic runtime
# gating keeps the baseline compatible with CUDA 12.4 driver/NVRTC libraries.
cudarc = { version = "0.19", default-features = false, features = ["driver", "runtime", "nvrtc", "dynamic-loading", "cuda-12080"] }
# Local upstream migration verification only; replace paths with merged upstream pins before release.
cubecl = { path = "../cubecl-ports-combined/crates/cubecl", default-features = false }
cubecl-cuda = { path = "../cubecl-ports-combined/crates/cubecl-cuda", features = ["cpp"] }
cubecl-common = { path = "../cubecl-ports-combined/crates/cubecl-common" }
cubecl-environment = { path = "../cubecl-ports-combined/crates/cubecl-environment" }
cubecl-runtime = { path = "../cubecl-ports-combined/crates/cubecl-runtime" }
cubecl-wgpu = { path = "../cubecl-ports-combined/crates/cubecl-wgpu" }
cubek-matmul = { path = "../cubek-upstream-tenferro/crates/cubek-matmul", default-features = false, features = ["multi-level"] }
cubek-std = { path = "../cubek-upstream-tenferro/crates/cubek-std", default-features = false }
cubek-fft = { path = "../cubek-upstream-fft/crates/cubek-fft", default-features = false }
sha2 = "0.10"
omeco = "0.2.4"
computegraph = { git = "https://github.com/tensor4all/computegraph-rs.git", rev = "691def2d82fd4367b397d61209449f68e82050b7", version = "0.1.0" }

[patch."https://github.com/tracel-ai/cubecl"]
cubecl = { path = "../cubecl-ports-combined/crates/cubecl" }
cubecl-common = { path = "../cubecl-ports-combined/crates/cubecl-common" }
cubecl-environment = { path = "../cubecl-ports-combined/crates/cubecl-environment" }
cubecl-ir = { path = "../cubecl-ports-combined/crates/cubecl-ir" }

[profile.dev]
opt-level = 0
debug = 0
debug-assertions = true
overflow-checks = true
incremental = true

[profile.test]
opt-level = 0
debug = 0
debug-assertions = true
overflow-checks = true
incremental = true

# Hosted-CI cold builds only (`scripts/ci/run_profile.py`, CUDA archives).
# Keep local [profile.dev]/[profile.test] incremental for edit-test loops.
[profile.ci]
inherits = "test"
incremental = false
strip = "symbols"
