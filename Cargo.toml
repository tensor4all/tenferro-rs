[workspace]
members = [
    # v2 core crates
    "crates/tenferro-tensor-core",
    "crates/tenferro-tensor",
    "crates/tenferro-internal-cpu-kernels",
    "crates/tenferro-cpu-basic",
    "crates/tenferro-cpu-fused",
    "crates/tenferro-cpu",
    "crates/tenferro-gpu",
    "crates/tenferro-runtime",
    "crates/tenferro-xla",
    "crates/tenferro-ad",
    "crates/tenferro-internal-extension-macros",
    "crates/tenferro-core-ops",
    "crates/tenferro-internal-ops",
    "crates/tenferro-einsum",
    "crates/tenferro-linalg",
    "crates/tenferro-fft",
    "docs/tutorial-code",
    "ext/bf16-proof",
    "ext/df64-proof",
    "ext/scalar-consumer-algorithm",
    "ext/scalar-consumer-application",
]
exclude = ["ext/sparse", "ext/tropical"]
default-members = [
    "crates/tenferro-tensor",
]
resolver = "2"

[workspace.package]
version = "0.7.1"
rust-version = "1.96"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = [
    "Hiroshi Shinaoka <h.shinaoka@gmail.com>",
    "GiggleLiu <cacate0129@gmail.com>",
    "Satoshi Terasaki <https://github.com/terasakisatoshi>",
]
publish = true
readme = "README.md"
repository = "https://github.com/tensor4all/tenferro-rs"
homepage = "https://tensor4all.org/tenferro-rs/"

[workspace.dependencies]
rand = "0.8"
# Already in the dependency graph through the GPU stack; centralised here for the bf16 proof crate.
half = "2.7"
num-complex = "0.4"
num-traits = "0.2"
# Scalar `erf`/`erff` for the CPU analytic kernels (`f64::erf` is unstable in std).
libm = "0.2.16"
elem-simd-math = "=0.1.0"
thiserror = "2"
smallvec = { version = "1", features = ["union"] }
tinyvec = { version = "1", features = ["alloc"] }
rayon = "1"
criterion = "0.5"
trybuild = "1"
serde = "1"
serde_json = "1"
lru = "0.18.5"
proc-macro2 = "1"
quote = "1"
syn = "2"
# Published strided v0.6.0 and the matching providers, shared with the CPU
# contraction/linalg stack (#2178, #2142, #2180). Keep every crate (cpueinsum,
# tlinalg, strided) on one registry source: a split strided source gives two
# `StridedView` types that cannot meet at a crate boundary. All six strided
# crates move together at 0.6.0 -- the core no longer lags a patch behind the
# providers. The providers move together too: the published `cpueinsum 0.4.0`
# carries `tcontract 0.4.0` / `tcontract-exec 0.4.0` (no `WholeBatchVendor`
# variant; tcontract-rs#135), which pins `strided-view =0.6.0` and
# `strided-basic =0.6.2` from crates.io; an older `cpueinsum` reaches an older
# `tcontract` that pins an older strided exactly and would not resolve beside
# the 0.6.0 requirement. `strided-fused 0.6.0` propagates NaN through the fused
# DAG so ordered reductions can use it (TF5), and `strided-view` owns its view
# metadata inline. strided-basic 0.6.2 adds `with_execution_pool`, through which a
# CPU engine's strided operations enter the engine's pool only when they fan out
# (#2206); tcontract 0.3.2 / tcontract-exec 0.3.1 / cpueinsum 0.3.2 / tlinalg 0.3.2
# move their exact strided-basic pin to it. `tcontract-exec` is named directly because tenferro now
# passes its `Exec` to tlinalg and cpueinsum. `tlinalg` and `tlinalg-blas` are
# pinned exactly at 0.3.1 in `crates/tenferro-linalg`; that release's additive
# `*_workspace` / `*_into` entries are what the faer lane routes every family
# through.
strided-view = "=0.6.0"
strided-traits = "=0.6.0"
strided-perm = { version = "=0.6.0", features = ["parallel"] }
cpueinsum = "=0.4.2"
cpueinsum-blas = "=0.4.2"
tcontract-exec = "=0.4.2"
strided-basic = { version = "=0.6.3", default-features = false }
strided-fused = { version = "=0.6.0", default-features = false, features = ["parallel"] }
strided-kernel = { version = "=0.6.0", features = ["parallel"] }
libloading = "0.8"
# One faer identity for the whole CPU stack (#1939): the pinned `tlinalg 0.4.1`
# resolves `t4a-faer =0.24.7` (its own manifest renames it via
# `package = "t4a-faer"`), and a second, crates.io `faer` would build a second
# faer into the binary and give downstream direct calls different `Par`/`Mat`
# types than the ones `tenferro_cpu::faer` re-exports. `t4a-faer 0.24.7` is the
# fork's release from main: it carries the evd eigenvector-normalization fix
# (#2131) and the householder row-split gate for tensor4all/faer#12.
# tenferro-cpu re-exports this build as `tenferro_cpu::faer` under `native`.
# The fork keeps the 0.24 API and the `faer` library name.
faer = { package = "t4a-faer", version = "=0.24.7", default-features = false, features = ["std", "rayon"] }
cblas-sys = "0.1"
cblas-inject = "0.1.1"
blas-src = { version = "0.14", default-features = false }
lapack = "0.20"
lapack-src = "0.13"
lapack-inject = "0.1.2"
# Compile both CubeCL runtime paths with CUDA 12.8 bindings. Dynamic runtime
# gating keeps the baseline compatible with CUDA 12.4 driver/NVRTC libraries.
cudarc = { version = "0.19", default-features = false, features = ["driver", "runtime", "nvrtc", "dynamic-loading", "cuda-12080"] }
# The published 0.11.0 / 0.3.0 fork releases of the ported content:
# - https://github.com/tensor4all/cubecl branch release/t4a-cubecl-0.11.0
# - https://github.com/tensor4all/cubek  branch release/t4a-cubek-0.3.0
# Both carry the ported upstream content plus the migration's fixes. Replace
# them with merged upstream revisions when the ports land upstream (#2116).
cubecl = { package = "t4a-cubecl", version = "=0.11.0", default-features = false }
cubecl-cuda = { package = "t4a-cubecl-cuda", version = "=0.11.0", features = ["cpp"] }
cubecl-common = { package = "t4a-cubecl-common", version = "=0.11.0" }
cubecl-environment = { package = "t4a-cubecl-environment", version = "=0.11.0" }
cubecl-runtime = { package = "t4a-cubecl-runtime", version = "=0.11.0" }
cubecl-wgpu = { package = "t4a-cubecl-wgpu", version = "=0.11.0" }
cubek-matmul = { package = "t4a-cubek-matmul", version = "=0.3.0", default-features = false, features = ["multi-level"] }
cubek-std = { package = "t4a-cubek-std", version = "=0.3.0", default-features = false }
cubek-fft = { package = "t4a-cubek-fft", version = "=0.3.0", default-features = false }
sha2 = "0.10"
omeco = "0.2.4"
computegraph = "=0.1.0"

[profile.dev]
opt-level = 0
debug = 0
debug-assertions = true
overflow-checks = true
incremental = true

[profile.test]
opt-level = 0
debug = 0
debug-assertions = true
overflow-checks = true
incremental = true

# Hosted-CI cold builds only (`scripts/ci/run_profile.py`, CUDA archives).
# Keep local [profile.dev]/[profile.test] incremental for edit-test loops.
[profile.ci]
inherits = "test"
incremental = false
strip = "symbols"
