[workspace]
members = [
    # v2 core crates
    "crates/tenferro-tensor-core",
    "crates/tenferro-tensor",
    "crates/tenferro-cpu",
    "crates/tenferro-gpu",
    "crates/tenferro-runtime",
    "crates/tenferro-xla",
    "crates/tenferro-ad",
    "crates/tenferro-internal-extension-macros",
    "crates/tenferro-core-ops",
    "crates/tenferro-internal-ops",
    "crates/tenferro-einsum",
    "crates/tenferro-linalg",
    "crates/tenferro-fft",
    "docs/tutorial-code",
]
default-members = [
    "crates/tenferro-tensor",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = [
    "Hiroshi Shinaoka <h.shinaoka@gmail.com>",
    "GiggleLiu <cacate0129@gmail.com>",
    "Satoshi Terasaki <https://github.com/terasakisatoshi>",
]
publish = true
readme = "README.md"
repository = "https://github.com/tensor4all/tenferro-rs"
homepage = "https://tensor4all.org/tenferro-rs/"

[workspace.dependencies]
num-complex = "0.4"
num-traits = "0.2"
thiserror = "2"
smallvec = "1"
criterion = "0.5"
serde = "1"
serde_json = "1"
lru = "0.12"
proc-macro2 = "1"
quote = "1"
syn = "2"
tidu = "0.1.0"
strided-view = "0.1.0"
strided-traits = "0.1.0"
strided-perm = { version = "0.1.0", features = ["parallel"] }
strided-kernel = { version = "0.1.1", features = ["parallel"] }
libloading = "0.8"
faer = "0.24"
cblas-sys = "0.1"
cblas-src = "0.1.3"
cblas-inject = "0.1.1"
blas-src = { version = "0.14", default-features = false }
lapack = "0.20"
lapack-src = "0.13"
lapack-inject = "0.1.2"
# Match CubeCL's CUDA API floor. CUDA 12.8 is the oldest cudarc binding set
# that exposes the driver symbols used by the current cubecl-cuda revision.
cudarc = { version = "0.19", default-features = false, features = ["driver", "runtime", "nvrtc", "dynamic-loading", "cuda-12080"] }
cubecl = { package = "t4a-cubecl", version = "=0.10.0", default-features = false }
cubecl-cuda = { package = "t4a-cubecl-cuda", version = "=0.10.0" }
cubecl-common = { package = "t4a-cubecl-common", version = "=0.10.0" }
cubecl-runtime = { package = "t4a-cubecl-runtime", version = "=0.10.0" }
cubecl-wgpu = { package = "t4a-cubecl-wgpu", version = "=0.10.0" }
cubek-matmul = { package = "t4a-cubek-matmul", version = "=0.2.0", default-features = false }
cubek-std = { package = "t4a-cubek-std", version = "=0.2.0", default-features = false }
sha2 = "0.10"
omeco = "0.2.4"
computegraph = "0.1.0"
