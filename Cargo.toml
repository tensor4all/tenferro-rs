[workspace]
members = [
    # v2 core crates
    "crates/tenferro-tensor-core",
    "crates/tenferro-tensor",
    "crates/tenferro-internal-cpu-kernels",
    "crates/tenferro-cpu",
    "crates/tenferro-gpu",
    "crates/tenferro-runtime",
    "crates/tenferro-xla",
    "crates/tenferro-ad",
    "crates/tenferro-internal-extension-macros",
    "crates/tenferro-core-ops",
    "crates/tenferro-internal-ops",
    "crates/tenferro-einsum",
    "crates/tenferro-linalg",
    "crates/tenferro-fft",
    "docs/tutorial-code",
]
exclude = ["third_party/t4a-tblis-src"]
default-members = [
    "crates/tenferro-tensor",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = [
    "Hiroshi Shinaoka <h.shinaoka@gmail.com>",
    "GiggleLiu <cacate0129@gmail.com>",
    "Satoshi Terasaki <https://github.com/terasakisatoshi>",
]
publish = true
readme = "README.md"
repository = "https://github.com/tensor4all/tenferro-rs"
homepage = "https://tensor4all.org/tenferro-rs/"

[workspace.dependencies]
rand = "0.8"
num-complex = "0.4"
num-traits = "0.2"
thiserror = "2"
smallvec = "1"
rayon = "1"
criterion = "0.5"
serde = "1"
serde_json = "1"
lru = "0.12"
proc-macro2 = "1"
quote = "1"
syn = "2"
strided-view = { git = "https://github.com/tensor4all/strided-rs.git", rev = "06c825829e399dd769504e6ce10dbca8f07b5e15", version = "0.3.0" }
strided-traits = { git = "https://github.com/tensor4all/strided-rs.git", rev = "06c825829e399dd769504e6ce10dbca8f07b5e15", version = "0.3.0" }
strided-perm = { git = "https://github.com/tensor4all/strided-rs.git", rev = "06c825829e399dd769504e6ce10dbca8f07b5e15", version = "0.3.0", features = ["parallel"] }
strided-kernel = { git = "https://github.com/tensor4all/strided-rs.git", rev = "06c825829e399dd769504e6ce10dbca8f07b5e15", version = "0.3.0", features = ["parallel"] }
strided-einsum2 = { git = "https://github.com/tensor4all/strided-rs.git", rev = "06c825829e399dd769504e6ce10dbca8f07b5e15", version = "0.3.0", default-features = false }
libloading = "0.8"
faer = { version = "0.24", default-features = false, features = ["std", "rayon"] }
cblas-sys = "0.1"
cblas-src = "0.1.3"
cblas-inject = "0.1.1"
blas-src = { version = "0.14", default-features = false }
lapack = "0.20"
lapack-src = "0.13"
lapack-inject = "0.1.2"
# Compile both CubeCL runtime paths with CUDA 12.8 bindings. Dynamic runtime
# gating keeps the baseline compatible with CUDA 12.4 driver/NVRTC libraries.
cudarc = { version = "0.19", default-features = false, features = ["driver", "runtime", "nvrtc", "dynamic-loading", "cuda-12080"] }
# Pre-publish staging: Cargo uses these fork commits locally, while packaged
# manifests retain only the crates.io version requirements.
cubecl = { package = "t4a-cubecl", git = "https://github.com/tensor4all/cubecl.git", rev = "346135ab43cececf6405d52a3dbc987537402d27", version = "=0.10.0", default-features = false }
cubecl-cuda = { package = "t4a-cubecl-cuda", git = "https://github.com/tensor4all/cubecl.git", rev = "346135ab43cececf6405d52a3dbc987537402d27", version = "=0.10.0" }
cubecl-common = { package = "t4a-cubecl-common", git = "https://github.com/tensor4all/cubecl.git", rev = "346135ab43cececf6405d52a3dbc987537402d27", version = "=0.10.0" }
cubecl-runtime = { package = "t4a-cubecl-runtime", git = "https://github.com/tensor4all/cubecl.git", rev = "346135ab43cececf6405d52a3dbc987537402d27", version = "=0.10.0" }
cubecl-wgpu = { package = "t4a-cubecl-wgpu", git = "https://github.com/tensor4all/cubecl.git", rev = "346135ab43cececf6405d52a3dbc987537402d27", version = "=0.10.0" }
cubek-matmul = { package = "t4a-cubek-matmul", git = "https://github.com/tensor4all/cubek.git", rev = "efc43529449b67d83f53e585cc7d71018a252ac7", version = "=0.2.0", default-features = false }
cubek-std = { package = "t4a-cubek-std", git = "https://github.com/tensor4all/cubek.git", rev = "efc43529449b67d83f53e585cc7d71018a252ac7", version = "=0.2.0", default-features = false }
cubek-fft = { package = "cubek-fft", git = "https://github.com/tensor4all/cubek.git", rev = "efc43529449b67d83f53e585cc7d71018a252ac7", version = "=0.2.0", default-features = false }
sha2 = "0.10"
omeco = "0.2.4"
computegraph = { git = "https://github.com/tensor4all/computegraph-rs.git", rev = "691def2d82fd4367b397d61209449f68e82050b7", version = "0.1.0" }

[profile.dev]
opt-level = 0
debug = 0
debug-assertions = true
overflow-checks = true
incremental = true

[profile.test]
opt-level = 0
debug = 0
debug-assertions = true
overflow-checks = true
incremental = true

# Hosted-CI cold builds only (`scripts/ci/run_profile.py`, CUDA archives).
# Keep local [profile.dev]/[profile.test] incremental for edit-test loops.
[profile.ci]
inherits = "test"
incremental = false
strip = "symbols"
