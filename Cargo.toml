[workspace]
members = [
    # v2 core (6 crates)
    "tenferro-device",
    "tenferro-tensor",
    "tenferro-cubecl",
    "tenferro-extension-macros",
    "tenferro-ops",
    "tenferro-einsum",
    "tenferro",
]
exclude = [
    # External extension crates depend only on the public `tenferro` facade
    # where possible, are NOT core workspace members, and run their own tests
    # standalone.
    "tenferro-fft",
    "ext/tropical",
]
default-members = [
    "tenferro-tensor",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Hiroshi Shinaoka <h.shinaoka@gmail.com>", "GiggleLiu <cacate0129@gmail.com>"]
publish = false

[workspace.dependencies]
num-complex = "0.4"
num-traits = "0.2"
thiserror = "2"
smallvec = "1"
criterion = "0.5"
serde = "1"
serde_json = "1"
lru = "0.12"
proc-macro2 = "1"
quote = "1"
syn = "2"
chainrules-core = { git = "https://github.com/tensor4all/chainrules-rs.git", rev = "da3f2b50ba2e6a0738737e4e4b2ec8f5c8243469", package = "chainrules" }
chainrules = { git = "https://github.com/tensor4all/chainrules-rs.git", rev = "da3f2b50ba2e6a0738737e4e4b2ec8f5c8243469" }
tidu = { git = "https://github.com/tensor4all/tidu-rs.git", rev = "1d4a4c1d1c3923b79a509467ea4af4be2a148aaf" }
strided-view = { git = "https://github.com/tensor4all/strided-rs", rev = "ea37986f4d9cb99cfc1f62a1d4aea561cb3a9722" }
strided-traits = { git = "https://github.com/tensor4all/strided-rs", rev = "ea37986f4d9cb99cfc1f62a1d4aea561cb3a9722" }
strided-perm = { git = "https://github.com/tensor4all/strided-rs", rev = "ea37986f4d9cb99cfc1f62a1d4aea561cb3a9722", features = ["parallel"] }
strided-kernel = { git = "https://github.com/tensor4all/strided-rs", rev = "ea37986f4d9cb99cfc1f62a1d4aea561cb3a9722" }
libloading = "0.8"
faer = "0.24"
cblas-sys = "0.1"
cblas-src = "0.1.3"
cblas-inject = "0.1.1"
blas-src = { version = "0.14", default-features = false }
lapack = "0.20"
lapack-src = "0.13"
lapack-inject = "0.1.2"
cudarc = { version = "0.19", default-features = false, features = ["driver", "runtime", "nvrtc", "dynamic-loading", "cuda-12000"] }
cubecl = { git = "https://github.com/shinaoka/cubecl.git", rev = "929c8a96", features = ["cuda"] }
cubecl-cuda = { git = "https://github.com/shinaoka/cubecl.git", rev = "929c8a96" }
cubecl-runtime = { git = "https://github.com/shinaoka/cubecl.git", rev = "929c8a96" }
tenferro-cubecl = { path = "tenferro-cubecl" }
sha2 = "0.10"
omeco = "0.2.4"
computegraph = { git = "https://github.com/tensor4all/computegraph-rs.git", rev = "8306196" }
