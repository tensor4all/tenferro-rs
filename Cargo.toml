[workspace]
members = [
    # v2 core crates
    "crates/tenferro-tensor-core",
    "crates/tenferro-tensor",
    "crates/tenferro-internal-cpu-kernels",
    "crates/tenferro-cpu-basic",
    "crates/tenferro-cpu-fused",
    "crates/tenferro-cpu",
    "crates/tenferro-gpu",
    "crates/tenferro-runtime",
    "crates/tenferro-xla",
    "crates/tenferro-ad",
    "crates/tenferro-internal-extension-macros",
    "crates/tenferro-core-ops",
    "crates/tenferro-internal-ops",
    "crates/tenferro-einsum",
    "crates/tenferro-linalg",
    "crates/tenferro-fft",
    "docs/tutorial-code",
    "ext/bf16-proof",
    "ext/df64-proof",
    "ext/scalar-consumer-algorithm",
    "ext/scalar-consumer-application",
]
exclude = ["ext/sparse", "ext/tropical"]
default-members = [
    "crates/tenferro-tensor",
]
resolver = "2"

[workspace.package]
version = "0.7.1"
rust-version = "1.96"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = [
    "Hiroshi Shinaoka <h.shinaoka@gmail.com>",
    "GiggleLiu <cacate0129@gmail.com>",
    "Satoshi Terasaki <https://github.com/terasakisatoshi>",
]
publish = true
readme = "README.md"
repository = "https://github.com/tensor4all/tenferro-rs"
homepage = "https://tensor4all.org/tenferro-rs/"

[workspace.dependencies]
rand = "0.8"
# Already in the dependency graph through the GPU stack; centralised here for the bf16 proof crate.
half = "2.7"
num-complex = "0.4"
num-traits = "0.2"
# Scalar `erf`/`erff` for the CPU analytic kernels (`f64::erf` is unstable in std).
libm = "0.2.16"
elem-simd-math = { git = "https://github.com/tensor4all/elem-simd-math-rs.git", version = "=0.1.0", rev = "63d3f8df42425f3e6398da765261a5a5d1999c30" }
thiserror = "2"
smallvec = { version = "1", features = ["union"] }
rayon = "1"
criterion = "0.5"
trybuild = "1"
serde = "1"
serde_json = "1"
lru = "0.18.5"
proc-macro2 = "1"
quote = "1"
syn = "2"
# strided v0.5.0 (borrowed-or-owned view metadata), shared with the CPU
# contraction/linalg stack (#2004). Keep exact registry requirements aligned with
# this revision, and keep the pinned providers (cpueinsum, tlinalg) on the same
# source: a split strided source gives two `StridedView` types that cannot meet at
# a crate boundary. This revision is the pre-merge branch of
# tensor4all/strided-rs#297; re-point every strided rev here at once when it
# merges. The providers follow the same rule through
# tensor4all/cpueinsum-rs#18 and tensor4all/tlinalg-rs#52.
strided-view = { git = "https://github.com/tensor4all/strided-rs.git", rev = "e6241732e9c445d5be7b97c15dfb142fd14737ea", version = "=0.5.0" }
strided-traits = { git = "https://github.com/tensor4all/strided-rs.git", rev = "e6241732e9c445d5be7b97c15dfb142fd14737ea", version = "=0.5.0" }
strided-perm = { git = "https://github.com/tensor4all/strided-rs.git", rev = "e6241732e9c445d5be7b97c15dfb142fd14737ea", version = "=0.5.0", features = ["parallel"] }
cpueinsum = { git = "https://github.com/tensor4all/cpueinsum-rs.git", rev = "9b128a651956cfe51e64501689d21bfc0b8373f1", version = "0.1.0" }
cpueinsum-blas = { git = "https://github.com/tensor4all/cpueinsum-rs.git", rev = "9b128a651956cfe51e64501689d21bfc0b8373f1", version = "0.1.0" }
strided-basic = { git = "https://github.com/tensor4all/strided-rs.git", rev = "e6241732e9c445d5be7b97c15dfb142fd14737ea", version = "=0.5.0", default-features = false }
strided-fused = { git = "https://github.com/tensor4all/strided-rs.git", rev = "e6241732e9c445d5be7b97c15dfb142fd14737ea", version = "=0.5.0", default-features = false, features = ["parallel"] }
strided-kernel = { git = "https://github.com/tensor4all/strided-rs.git", rev = "e6241732e9c445d5be7b97c15dfb142fd14737ea", version = "=0.5.0", features = ["parallel"] }
libloading = "0.8"
faer = { version = "0.24", default-features = false, features = ["std", "rayon"] }
cblas-sys = "0.1"
cblas-inject = "0.1.1"
blas-src = { version = "0.14", default-features = false }
lapack = "0.20"
lapack-src = "0.13"
lapack-inject = "0.1.2"
# Compile both CubeCL runtime paths with CUDA 12.8 bindings. Dynamic runtime
# gating keeps the baseline compatible with CUDA 12.4 driver/NVRTC libraries.
cudarc = { version = "0.19", default-features = false, features = ["driver", "runtime", "nvrtc", "dynamic-loading", "cuda-12080"] }
# Pre-publish staging: Cargo uses these fork commits locally, while packaged
# manifests retain only the crates.io version requirements.
cubecl = { package = "t4a-cubecl", git = "https://github.com/tensor4all/cubecl.git", rev = "1811309791f675125379b326bf748f2ec1e29f2a", version = "=0.10.2", default-features = false }
cubecl-cuda = { package = "t4a-cubecl-cuda", git = "https://github.com/tensor4all/cubecl.git", rev = "1811309791f675125379b326bf748f2ec1e29f2a", version = "=0.10.2" }
cubecl-common = { package = "t4a-cubecl-common", git = "https://github.com/tensor4all/cubecl.git", rev = "1811309791f675125379b326bf748f2ec1e29f2a", version = "=0.10.2" }
cubecl-runtime = { package = "t4a-cubecl-runtime", git = "https://github.com/tensor4all/cubecl.git", rev = "1811309791f675125379b326bf748f2ec1e29f2a", version = "=0.10.2" }
cubecl-wgpu = { package = "t4a-cubecl-wgpu", git = "https://github.com/tensor4all/cubecl.git", rev = "1811309791f675125379b326bf748f2ec1e29f2a", version = "=0.10.2" }
cubek-matmul = { package = "t4a-cubek-matmul", git = "https://github.com/tensor4all/cubek.git", rev = "507c91f5a70e284595755b72598f60c684d1132b", version = "=0.2.2", default-features = false }
cubek-std = { package = "t4a-cubek-std", git = "https://github.com/tensor4all/cubek.git", rev = "507c91f5a70e284595755b72598f60c684d1132b", version = "=0.2.2", default-features = false }
cubek-fft = { package = "t4a-cubek-fft", git = "https://github.com/tensor4all/cubek.git", rev = "507c91f5a70e284595755b72598f60c684d1132b", version = "=0.2.2", default-features = false }
sha2 = "0.10"
omeco = "0.2.4"
computegraph = { git = "https://github.com/tensor4all/computegraph-rs.git", rev = "691def2d82fd4367b397d61209449f68e82050b7", version = "0.1.0" }

[profile.dev]
opt-level = 0
debug = 0
debug-assertions = true
overflow-checks = true
incremental = true

[profile.test]
opt-level = 0
debug = 0
debug-assertions = true
overflow-checks = true
incremental = true

# Hosted-CI cold builds only (`scripts/ci/run_profile.py`, CUDA archives).
# Keep local [profile.dev]/[profile.test] incremental for edit-test loops.
[profile.ci]
inherits = "test"
incremental = false
strip = "symbols"
