[workspace]
members = [
    # core
    "tenferro-device",
    "tenferro-algebra",
    "tenferro-prims",
    "tenferro-tensor",
    "tenferro-einsum",
    "tenferro-linalg",
    "tenferro-capi",
    # extension
    "extension/tenferro-tropical",
    "extension/tenferro-tropical-capi",
    "extension/tenferro-burn",
    "extension/tenferro-mdarray",
    # extern (general-purpose, non-tenferro)
    "extern/chainrules-core",
    "extern/chainrules",
]
resolver = "2"

[workspace.dependencies]
num-complex = "0.4"
num-traits = "0.2"
thiserror = "2"
strided-view = { git = "https://github.com/tensor4all/strided-rs", rev = "7aa260c68607b5706b9ee552ff51e38005adc7a9" }
strided-traits = { git = "https://github.com/tensor4all/strided-rs", rev = "7aa260c68607b5706b9ee552ff51e38005adc7a9" }
