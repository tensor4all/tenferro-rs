[workspace]
members = [
    # v2 core crates
    "crates/tenferro-tensor-core",
    "crates/tenferro-tensor",
    "crates/tenferro-internal-cpu-kernels",
    "crates/tenferro-cpu-basic",
    "crates/tenferro-cpu-fused",
    "crates/tenferro-cpu",
    "crates/tenferro-gpu",
    "crates/tenferro-runtime",
    "crates/tenferro-xla",
    "crates/tenferro-ad",
    "crates/tenferro-internal-extension-macros",
    "crates/tenferro-core-ops",
    "crates/tenferro-internal-ops",
    "crates/tenferro-einsum",
    "crates/tenferro-linalg",
    "crates/tenferro-fft",
    "docs/tutorial-code",
    "ext/bf16-proof",
    "ext/df64-proof",
    "ext/scalar-consumer-algorithm",
    "ext/scalar-consumer-application",
]
exclude = ["ext/sparse", "ext/tropical"]
default-members = [
    "crates/tenferro-tensor",
]
resolver = "2"

[workspace.package]
version = "0.7.1"
rust-version = "1.96"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = [
    "Hiroshi Shinaoka <h.shinaoka@gmail.com>",
    "GiggleLiu <cacate0129@gmail.com>",
    "Satoshi Terasaki <https://github.com/terasakisatoshi>",
]
publish = true
readme = "README.md"
repository = "https://github.com/tensor4all/tenferro-rs"
homepage = "https://tensor4all.org/tenferro-rs/"

[workspace.dependencies]
rand = "0.8"
# Already in the dependency graph through the GPU stack; centralised here for the bf16 proof crate.
half = "2.7"
num-complex = "0.4"
num-traits = "0.2"
# Scalar `erf`/`erff` for the CPU analytic kernels (`f64::erf` is unstable in std).
libm = "0.2.16"
# 0.1.1 adds the fused activation kernels the CPU engine routes to.
elem-simd-math = "0.1.1"
thiserror = "2"
smallvec = { version = "1", features = ["union"] }
tinyvec = { version = "1", features = ["alloc"] }
criterion = "0.5"
trybuild = "1"
serde = "1"
serde_json = "1"
lru = "0.18.5"
proc-macro2 = "1"
quote = "1"
syn = "2"
# The CPU contraction/linalg stack (strided, tcontract-exec, cpueinsum, tlinalg)
# on one registry source: a split source (git beside crates.io, or two
# incompatible semver lines) gives two `StridedView` types that cannot meet at a
# crate boundary, and two `strided_exec::Exec` types that cannot meet at a
# kernel boundary. Within one compatible line Cargo unifies every requirement to
# a single version, so the strided crates are ordinary caret requirements at the
# patch each API needs; the committed `Cargo.lock` fixes the exact versions a
# build uses, and `cargo update -p <crate>` moves them. Every fan-out entry of
# strided 0.7 takes a `strided_exec::Exec` token as its last parameter;
# `strided-exec` 0.7.1 adds `Exec::can_broadcast` and joins a `Pool`'s workers
# on drop. `strided-exec` is the only crate that depends on Rayon (see
# `deny.toml`); tenferro starts no task itself.
strided-view = "0.7.0"
strided-traits = "0.7.0"
strided-exec = "0.7.1"
strided-perm = { version = "0.7.0", features = ["parallel"] }
# The CPU provider stack is on the strided 0.7 / tcontract 0.5 release train; one
# `tcontract-exec` (check `cargo tree -i tcontract-exec`) keeps `Exec` one type.
cpueinsum = "0.5.0"
cpueinsum-blas = "0.5.0"
tcontract-exec = "0.5.0"
tlinalg = "0.5.0"
# TEMPORARY path dependency: tlinalg-blas 0.5.0 (strided 0.7) is not on crates.io yet; it becomes
# `tlinalg-blas = "0.5.0"` once published.
tlinalg-blas = { path = "../tlinalg-rs-exec/crates/tlinalg-blas", version = "0.4.3" }
strided-basic = { version = "0.7.0", default-features = false }
# Fused NN kernels moved out of this repository (#2272): axis-0 softmax with a
# tensor-free contract, caller-provided scratch and the caller's `Exec` token.
strided-nn = "0.7.0"
strided-fused = { version = "0.7.0", default-features = false, features = ["parallel"] }
strided-kernel = { version = "0.7.0", features = ["parallel"] }
libloading = "0.8"
# One faer identity for the native CPU stack (#1939): tlinalg 0.4.4 and this
# dependency use compatible t4a-faer ranges. 0.24.8 fixes divide-and-conquer SVD
# secular-root stagnation (tensor4all/faer#28); later patch fixes need only a
# targeted lock update, not another manifest-bump cascade. Keep the `faer` key
# and library name: tenferro-cpu re-exports this build as `tenferro_cpu::faer`.
faer = { package = "t4a-faer", version = "0.24.8", default-features = false, features = ["std", "rayon"] }
cblas-sys = "0.1"
cblas-inject = "0.1.1"
blas-src = { version = "0.14", default-features = false }
lapack = "0.20"
lapack-src = "0.13"
lapack-inject = "0.1.2"
# Compile both CubeCL runtime paths with CUDA 12.8 bindings. Dynamic runtime
# gating keeps the baseline compatible with CUDA 12.4 driver/NVRTC libraries.
cudarc = { version = "0.19", default-features = false, features = ["driver", "runtime", "nvrtc", "dynamic-loading", "cuda-12080"] }
# The published 0.11.0 / 0.3.0 fork releases of the ported content:
# - https://github.com/tensor4all/cubecl branch release/t4a-cubecl-0.11.0
# - https://github.com/tensor4all/cubek  branch release/t4a-cubek-0.3.0
# Both carry the ported upstream content plus the migration's fixes. Replace
# them with merged upstream revisions when the ports land upstream (#2116).
cubecl = { package = "t4a-cubecl", version = "=0.11.0", default-features = false }
cubecl-cuda = { package = "t4a-cubecl-cuda", version = "=0.11.0", features = ["cpp"] }
cubecl-common = { package = "t4a-cubecl-common", version = "=0.11.0" }
cubecl-environment = { package = "t4a-cubecl-environment", version = "=0.11.0" }
cubecl-runtime = { package = "t4a-cubecl-runtime", version = "=0.11.0" }
cubecl-wgpu = { package = "t4a-cubecl-wgpu", version = "=0.11.0" }
cubek-matmul = { package = "t4a-cubek-matmul", version = "=0.3.0", default-features = false, features = ["multi-level"] }
cubek-std = { package = "t4a-cubek-std", version = "=0.3.0", default-features = false }
cubek-fft = { package = "t4a-cubek-fft", version = "=0.3.0", default-features = false }
sha2 = "0.10"
omeco = "0.2.4"
computegraph = "0.1.0"

[profile.dev]
opt-level = 0
debug = 0
debug-assertions = true
overflow-checks = true
incremental = true

[profile.test]
opt-level = 0
debug = 0
debug-assertions = true
overflow-checks = true
incremental = true

# Hosted-CI cold builds only (`scripts/ci/run_profile.py`, CUDA archives).
# Keep local [profile.dev]/[profile.test] incremental for edit-test loops.
[profile.ci]
inherits = "test"
incremental = false
strip = "symbols"
