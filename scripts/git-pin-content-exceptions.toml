# Reviewed exceptions for scripts/check-git-pin-content.py.
#
# The checker fails closed when a git-pinned dependency's pinned revision does
# not match the crates.io release that `cargo publish` would resolve. An entry
# here does not silence that finding: the checker still prints it as a warning
# on every run, and warns again when an entry becomes stale and should be
# removed. Each entry therefore needs a tracked issue and a concrete reason so
# that review sees why the deviation is accepted.


# tensor4all/cpueinsum-rs is the lower CPU-contraction library introduced by the
# #2004 CPU boundary integration. Publication is deliberately deferred for now,
# so the pinned revision has no crates.io release and `cargo publish` of the
# depending tenferro crates cannot resolve it from the registry. The exception
# keeps that finding visible as a warning on every run; publish cpueinsum-rs
# 0.1.0 (and cpueinsum-blas) and remove these entries before releasing the
# tenferro crates that depend on it.
[[exception]]
package = "cpueinsum"
reason = "Deliberately unpublished for now; the pinned revision has no crates.io release."
issue = "https://github.com/tensor4all/cpueinsum-rs/issues/4"

[[exception]]
package = "cpueinsum-blas"
reason = "Deliberately unpublished for now; the pinned revision has no crates.io release."
issue = "https://github.com/tensor4all/cpueinsum-rs/issues/4"

# tensor4all/elem-simd-math-rs supplies the vectorized elementwise analytic
# kernels (#2090). It is deliberately unpublished for now, so the pinned
# revision has no crates.io release and `cargo publish` of tenferro-cpu cannot
# resolve it from the registry. The exception keeps that finding visible as a
# warning on every run; publish elem-simd-math 0.1.0 and remove this entry
# before releasing the tenferro crates that depend on it.
[[exception]]
package = "elem-simd-math"
reason = "Deliberately unpublished for now; the pinned revision has no crates.io release."
issue = "https://github.com/tensor4all/elem-simd-math-rs/issues/2"

# The strided exceptions for the #292 permutation and axis-reduction kernels are
# gone: the workspace now pins the published strided-rs v0.4.7 revision, which
# this check verifies against the crates.io archive.

# tensor4all/cubecl 0.10.2 was published from upstream content (eb2c8894)
# without the fork patches (#27 `ComputeClient::check_errors`, #28/#29 write
# path), while the workspace pins the fork revision 1811309 that carries them.
# Pinning the registry's content does not build, so the pins stay on the fork
# revision and the deviation is accepted, visibly, until the 0.11 pins retire
# it (issue #2125). Do not publish the tenferro crates while the 0.10.2 pins
# are in place.
[[exception]]
package = "t4a-cubecl-cuda"
reason = "Registry 0.10.2 was built without the fork patches; the pinned fork revision is required to build."
issue = "https://github.com/tensor4all/tenferro-rs/issues/2125"

[[exception]]
package = "t4a-cubecl-runtime"
reason = "Registry 0.10.2 was built without the fork patches; the pinned fork revision is required to build."
issue = "https://github.com/tensor4all/tenferro-rs/issues/2125"

[[exception]]
package = "t4a-cubecl-wgpu"
reason = "Registry 0.10.2 was built without the fork patches; the pinned fork revision is required to build."
issue = "https://github.com/tensor4all/tenferro-rs/issues/2125"
