# Reviewed duplicate assertion messages (#2492).
#
# `scripts/ci/check-duplicate-test-messages.py` fails when one sentence-shaped
# `expect("...")` message appears in more than two test files. An entry here
# records why one shared definition is unreachable and which files are
# reviewed; a file that starts using the message fails the run, so the recorded
# list may only shrink. An entry without a reason fails.

[[message]]
literal = "a preset dtype always has the requested representation"
files = [
  "crates/tenferro-ad/src/eager_exec/tests.rs",
  "crates/tenferro-ad/tests/integration/checkpoint.rs",
  "crates/tenferro-ad/tests/integration/read_entry_parity.rs",
  "crates/tenferro-ad/tests/integration/semantic_transform.rs",
  "crates/tenferro-cpu/src/tests/cpu_tests/dot_structural_analytic.rs",
  "crates/tenferro-einsum/src/extension/tests.rs",
  "crates/tenferro-fft/tests/backend_capability.rs",
  "crates/tenferro-internal-cpu-kernels/src/elementwise/tests.rs",
  "crates/tenferro-linalg/src/extension/tests/saved_solve.rs",
  "crates/tenferro-runtime/src/program/tests.rs",
  "crates/tenferro-runtime/src/runtime/tests/engine.rs",
  "crates/tenferro-runtime/tests/integration/runtime_execution.rs",
  "crates/tenferro-runtime/tests/integration/runtime_public_api.rs",
  "crates/tenferro-runtime/tests/integration/trace_context.rs",
  "crates/tenferro-tensor/src/storage/tests/group.rs",
  "crates/tenferro-tensor/src/tests/types_tests.rs",
]
reason = """
One sentence for every `tensor_view()` / `tensor_read()` unwrap in test code: the accessor returns
`None` only for an external payload, so a preset-dtype value always has the representation. The
80 sites span seven crates and both unit tests (`src/**/tests`) and integration binaries
(`tests/**`); each integration binary is its own compilation unit and there is no shared
test-support crate, while a `#[doc(hidden)] pub` constant in `tenferro-tensor` would add public
surface for tests (REPOSITORY_RULES.md, Public Surface Discipline). The wording is therefore one
reviewed sentence rather than one definition, and this entry is the ratchet that keeps a
seventeenth file from copying it.
"""

