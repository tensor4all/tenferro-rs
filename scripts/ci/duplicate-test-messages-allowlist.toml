reason = """
The marker for an `as_typed::<T>()` unwrap whose dtype the surrounding test just constructed. It
names the arm under test rather than an invariant a helper could own, and the tests live in
different crates' unit-test modules and integration binaries, so the sentence is repeated by
construction: the fixture's dtype is local to each test, not to a shared helper.
"""

