[package]
name = "cubecl-kernel-sample"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
resolver = "2"

[dependencies]
# Downstream-style package lines: a downstream extern kernel crate depends on the
# published crates.io `t4a-cubecl = =0.11.0` and gets the same CubeCL runtime
# type tenferro-gpu does, because tenferro-gpu resolves the same registry release.
cubecl = { package = "t4a-cubecl", version = "=0.11.0", features = ["cuda"] }
cubecl-cuda = { package = "t4a-cubecl-cuda", version = "=0.11.0" }
tenferro-gpu = { path = "../../crates/tenferro-gpu", features = ["cuda", "cubecl-interop"] }
tenferro-tensor = { path = "../../crates/tenferro-tensor" }

# Match workspace [profile.ci] used by scripts/ci/run_profile.py extensions.
[profile.ci]
inherits = "test"
debug = 0
incremental = false
strip = "symbols"
