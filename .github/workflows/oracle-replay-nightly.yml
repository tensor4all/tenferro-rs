name: Oracle replay nightly

on:
  schedule:
    - cron: "37 17 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run oracle replay even when the checked ref has no commit in the last 24 hours"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: oracle-replay-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recent-commits:
    name: Check recent default-branch commits
    runs-on: ubuntu-24.04
    outputs:
      run_oracle: ${{ steps.recent.outputs.run_oracle }}
      reason: ${{ steps.recent.outputs.reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check for commits in the last 24 hours
        id: recent
        env:
          FORCE_RUN: ${{ github.event.inputs.force == 'true' }}
        run: |
          set -euo pipefail
          recent_commit="$(git log --since="24 hours ago" --format=%H --max-count=1)"
          if [ "${FORCE_RUN}" = true ]; then
            echo "run_oracle=true" >> "${GITHUB_OUTPUT}"
            echo "reason=manual force=true" >> "${GITHUB_OUTPUT}"
          elif [ -n "${recent_commit}" ]; then
            echo "run_oracle=true" >> "${GITHUB_OUTPUT}"
            echo "reason=recent commit ${recent_commit}" >> "${GITHUB_OUTPUT}"
          else
            echo "run_oracle=false" >> "${GITHUB_OUTPUT}"
            echo "reason=no commits in the last 24 hours" >> "${GITHUB_OUTPUT}"
          fi

  oracle-replay:
    name: Root-facade oracle replay
    needs: recent-commits
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "4"
      ORACLE_REPLAY_JOBS: "4"
    steps:
      - uses: actions/checkout@v5
        if: needs.recent-commits.result == 'success' && needs.recent-commits.outputs.run_oracle == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.recent-commits.result == 'success' && needs.recent-commits.outputs.run_oracle == 'true'
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        if: needs.recent-commits.result == 'success' && needs.recent-commits.outputs.run_oracle == 'true'
        with:
          prefix-key: v2-rust-oracle-replay-ubuntu24
          shared-key: oracle-replay-autodiff
          cache-all-crates: true
          cache-workspace-crates: true
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run root-facade oracle replay
        if: needs.recent-commits.result == 'success' && needs.recent-commits.outputs.run_oracle == 'true'
        run: |
          set -euo pipefail
          mkdir -p target/oracle-replay
          RUST_TEST_THREADS=1 \
            RUN_ORACLE_REPLAY=1 \
            ORACLE_REPLAY_JOBS="${ORACLE_REPLAY_JOBS}" \
            CARGO_BUILD_JOBS="${CARGO_BUILD_JOBS}" \
            cargo test -p tenferro-linalg --features autodiff --test integration oracle_replays_supported_db_cases_when_requested -- --nocapture \
            2>&1 | tee target/oracle-replay/oracle-replay.log
      - name: Upload oracle replay log
        if: always() && needs.recent-commits.result == 'success' && needs.recent-commits.outputs.run_oracle == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oracle-replay-${{ github.run_id }}
          path: target/oracle-replay/oracle-replay.log
          if-no-files-found: warn
      - name: Report oracle replay disposition
        if: always()
        env:
          RECENT_RESULT: ${{ needs.recent-commits.result }}
          RUN_ORACLE: ${{ needs.recent-commits.outputs.run_oracle }}
          REASON: ${{ needs.recent-commits.outputs.reason }}
        run: |
          set -euo pipefail
          if [ "${RECENT_RESULT}" != success ]; then
            echo "Recent-commit gate failed: ${RECENT_RESULT}"
            exit 1
          fi
          if [ "${RUN_ORACLE}" != true ]; then
            echo "Oracle replay not required: ${REASON}"
          else
            echo "Oracle replay requested: ${REASON}"
          fi

  notify-failure:
    name: Report or clear the nightly failure issue
    needs: [recent-commits, oracle-replay]
    # Runs on every default-branch run: an actual successful replay closes the
    # issue, and a skipped or cancelled run leaves it alone. The decision itself
    # lives in the script so it is covered by tests.
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: recovery relates its commit to the tracked failure with
          # `git merge-base --is-ancestor`.
          fetch-depth: 0
      - name: Collect the replay log
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p target/oracle-replay
          name="oracle-replay-${GITHUB_RUN_ID}"
          # Tolerate confirmed absence only. A run that skipped the replay has no
          # artifact by design; a listing or download failure is a real problem
          # and must not be reported as "no log".
          if ! artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[].name')$'"; then
            echo "could not list the artifacts of run ${GITHUB_RUN_ID}" >&2
            exit 1
          fi
          if ! printf '%s\n' "${artifacts}" | grep -qxF -- "${name}"; then
            echo "run ${GITHUB_RUN_ID} has no ${name} artifact (the replay did not run); case IDs will be reported as unavailable"
            exit 0
          fi
          gh run download "${GITHUB_RUN_ID}" --name "${name}" --dir target/oracle-replay
      - name: Report or clear the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ORACLE: ${{ needs.recent-commits.outputs.run_oracle }}
          RECENT_RESULT: ${{ needs.recent-commits.result }}
          REPLAY_RESULT: ${{ needs.oracle-replay.result }}
          ORACLE_LOG: target/oracle-replay/oracle-replay.log
        run: bash scripts/ci/report_oracle_nightly.sh
