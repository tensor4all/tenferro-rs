name: RunPod tenferro-rs GPU Test

# ---------------------------------------------------------------------------
# Security policy for this workflow (tracked in issue #1; keep this comment
# in sync with any port to the public tensor4all/tenferro-rs repo):
#
#   * This workflow drives an ephemeral RunPod GPU pod registered as a
#     self-hosted GitHub Actions runner. Self-hosted runners on a repo that
#     accepts external contributions are a well-known escalation path
#     (see GitHub's "Security hardening for GitHub Actions" guide).
#   * PR-triggered runs enter through `workflow_run` from the trusted default
#     branch workflow file, not through a PR-controlled `pull_request` copy of
#     this workflow. They MUST reject fork PRs before RunPod startup. The pod
#     executes the checked-out ref as root, in the same container as the runner
#     process, so fork code must never reach the self-hosted runner.
#   * NEVER add `pull_request_target` to this workflow: that would combine base
#     repository secrets with PR-controlled refs.
#   * Top-level permissions must stay read-only. In particular, never add
#     `id-token: write` or any write scope to a job that runs on the
#     self-hosted RunPod runner (`run-gpu-tests`). `checks: read` is present
#     only so the GitHub-hosted pre-RunPod gate can wait for cheap CI before
#     any paid pod is created.
#   * `RUNPOD_API_KEY` (and the GitHub App credentials used to mint the JIT
#     runner config) must only ever be read in trusted-base GitHub-hosted jobs
#     (`runpod-contract`, `start-runpod`, `cleanup-runpod`). Neither may ever be passed to, or
#     become readable from, the pod itself. Automatic PR runs are started only
#     by `workflow_run`, after `authorize` gates the run to same-repo
#     maintainer/admin PRs.
#   * Cache and artifact trust (#1403): every job in this workflow is a cache
#     READER only (`actions/cache/restore`, rust-cache `save-if: false`).
#     Jobs here either execute PR-controlled build code (cuda-archive) or run
#     on the self-hosted pod (run-gpu-tests), so none of them may hold a
#     cache-write credential for the main-scoped namespace: `workflow_run`
#     runs on refs/heads/main, so any cache save from here would publish
#     attacker-influenceable bytes into the trusted namespace. Shared cache
#     publication is owned by `ci-cache-publish.yml`, which only ever builds
#     default-branch code. GPU allocation retries reuse the immutable per-key
#     archive artifact through scripts/ci/find_archive_artifact.py instead of
#     rebuilding. See docs/design/ci-cache-trust.md.
#   * GPU selection and compatibility (#1404): the trusted start-runpod job
#     orders reviewed GPU candidates by live Secure Cloud price and creates
#     them one at a time. The pod startup script proves CUDA compatibility
#     (NVRTC compile -> PTX load -> kernel launch -> sync) BEFORE the runner
#     registers; incompatible pods exit, are deleted, and the next candidate
#     is tried with the same immutable archive, bounded by
#     max_provision_attempts. The smoke script is fetched at the trusted
#     default-branch SHA and receives no credentials. See
#     docs/design/runpod-gpu-provisioning.md.
#   * This workflow owns the branch-protection-required `CI GPU gate` check for
#     eligible same-repo maintainer PRs by publishing that check to the PR head
#     SHA from a GitHub-hosted final gate job. Fork PRs keep using the legacy
#     `CI_gpu.yml` pull_request path because base-repo Checks API writes cannot
#     attach a check run to fork commits.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository PR number to recover through trusted main
        required: false
        default: 0
        type: number
      tenferro_ref:
        description: tenferro-rs git ref (branch, tag, or SHA)
        required: false
        default: ""
        type: string
      ci_gpu_gate_head_sha:
        description: Optional PR head SHA to publish the CI GPU gate check to
        required: false
        default: ""
        type: string
  workflow_run:
    workflows: ["CI PR workspace tests"]
    types: [completed]

concurrency:
  group: runpod-tenferro-gpu-${{ github.ref }}
  cancel-in-progress: false

permissions:
  checks: read
  contents: read

env:
  ORG_NAME: tensor4all
  TENFERRO_REPO: tensor4all/tenferro-rs
  CARGO_TERM_COLOR: always
  CUBECL_DEBUG_LOG: "0"
  CUDA_ARCHIVE: cuda-tests.tar.zst
  PJRT_ARCHIVE: pjrt-tests.tar.zst
  # Keep 12.8 bindings so newer runtimes retain every CubeCL CUDA feature.
  CUDARC_CUDA_VERSION: "12080"
  # RunPod may select the 12.4 baseline; 12.8 enables the full CubeCL feature set.
  CUDA_MIN_RUNTIME_VERSION: "12.4"
  CUDA_RUNTIME_VERSION: "12.8"
  ARCHIVE_WORKSPACE_ROOT: /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}
  # Fixed cache root shared by GitHub-hosted writers (ci-cache-publish) and
  # the RunPod pod so restored absolute paths line up on both runner kinds.
  TENFERRO_CI_CACHE_ROOT: /opt/tenferro-ci
  CUTENSOR_VERSION: "2.6.0.4"
  JAX_CUDA12_PJRT_VERSION: "0.10.2"
  NVIDIA_CUDNN_CU12_VERSION: "9.23.2.1"
  NVIDIA_CUDA_NVCC_CU12_VERSION: "12.9.86"
  RUNPOD_IMAGE: runpod/pytorch:2.1.0-py3.10-cuda11.8.0-devel-ubuntu22.04

jobs:
  authorize:
    name: Authorize RunPod GPU run
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      tenferro_ref: ${{ steps.resolve_ref.outputs.tenferro_ref }}
      gpu_required: ${{ steps.resolve_ref.outputs.run_gpu }}
      policy_reason: ${{ steps.resolve_ref.outputs.reason }}
      target_head_sha: ${{ steps.resolve_ref.outputs.target_head_sha }}

    steps:
      # workflow_run resolves this checkout to trusted default-branch content.
      # Manual dispatch is rejected below unless the workflow ref is main.
      - name: Checkout trusted CI policy
        uses: actions/checkout@v5

      - name: Check actor and PR source are allowed
        id: resolve_ref
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PR_NUMBER: ${{ inputs.pr_number || 0 }}
          MANUAL_TENFERRO_REF: ${{ inputs.tenferro_ref || '' }}
          MANUAL_GATE_HEAD_SHA: ${{ inputs.ci_gpu_gate_head_sha || '' }}
          WORKFLOW_RUN_ACTOR: ${{ github.event.workflow_run.actor.login || '' }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event || '' }}
          WORKFLOW_RUN_PULL_REQUESTS: ${{ toJson(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail

          check_permission() {
            local login="$1"
            local role="$2"
            local perm

            perm="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${login}/permission" --jq .permission)"

            case "${perm}" in
              admin|maintain)
                echo "OK: ${role} ${login} has '${perm}' permission and is allowed to launch RunPod CI."
                ;;
              *)
                echo "::error::${role} ${login} has '${perm}' permission, which is not allowed to launch RunPod CI (requires admin or maintain)."
                exit 1
              ;;
            esac
          }

          classify_pr_paths() {
            local pr_number="$1"
            local changed_paths=/tmp/runpod-pr-changed-paths.txt
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/files?per_page=100" \
              --jq '.[].filename' > "${changed_paths}"
            local policy_args=()
            while IFS= read -r path; do
              if [ -n "${path}" ]; then
                policy_args+=(--path "${path}")
              fi
            done < "${changed_paths}"
            python3 scripts/ci/change_policy.py "${policy_args[@]}"
          }

          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            if [ "${WORKFLOW_RUN_EVENT}" != "pull_request" ]; then
              echo "::error::RunPod CI workflow_run events must come from pull_request workflows, got '${WORKFLOW_RUN_EVENT}'."
              exit 1
            fi

            pr_number="$(jq -r '.[0].number // empty' <<<"${WORKFLOW_RUN_PULL_REQUESTS}")"
            trigger_head_sha="$(jq -r '.[0].head.sha // empty' <<<"${WORKFLOW_RUN_PULL_REQUESTS}")"
            trigger_base_sha="$(jq -r '.[0].base.sha // empty' <<<"${WORKFLOW_RUN_PULL_REQUESTS}")"
            if [ -z "${pr_number}" ]; then
              echo "::error::workflow_run did not include an associated pull request."
              exit 1
            fi

            pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
            pr_author="$(jq -r '.user.login' <<<"${pr_json}")"
            pr_head_repo="$(jq -r '.head.repo.full_name' <<<"${pr_json}")"
            pr_head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
            pr_base_sha="$(jq -r '.base.sha' <<<"${pr_json}")"

            if [ "${pr_head_repo}" != "${GITHUB_REPOSITORY}" ]; then
              echo "::error::Fork PRs are not allowed to launch RunPod CI (${pr_head_repo} -> ${GITHUB_REPOSITORY})."
              exit 1
            fi

            if [ -n "${trigger_head_sha}" ] && [ "${pr_head_sha}" != "${trigger_head_sha}" ]; then
              echo "::error::PR #${pr_number} head changed after the triggering CI run (${trigger_head_sha} -> ${pr_head_sha}); refusing to launch RunPod."
              exit 1
            fi
            if [ -n "${trigger_base_sha}" ] && [ "${pr_base_sha}" != "${trigger_base_sha}" ]; then
              echo "::error::PR #${pr_number} base changed after the triggering CI run (${trigger_base_sha} -> ${pr_base_sha}); refusing to launch RunPod."
              exit 1
            fi

            check_permission "${pr_author}" "PR author"
            check_permission "${WORKFLOW_RUN_ACTOR}" "Source workflow actor"

            merge_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/pull/${pr_number}/merge" --jq .object.sha)"
            if [ -z "${merge_sha}" ] || [ "${merge_sha}" = "null" ]; then
              echo "::error::Failed to resolve refs/pull/${pr_number}/merge."
              exit 1
            fi

            # Re-read the PR after resolving the moving merge ref. Without
            # this second check, a push between the first PR read and the merge
            # ref lookup could make the pinned merge SHA belong to a newer
            # head/base pair than the CI run that triggered this workflow.
            refreshed_pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
            refreshed_head_sha="$(jq -r '.head.sha' <<<"${refreshed_pr_json}")"
            refreshed_base_sha="$(jq -r '.base.sha' <<<"${refreshed_pr_json}")"
            if [ -n "${trigger_head_sha}" ] && [ "${refreshed_head_sha}" != "${trigger_head_sha}" ]; then
              echo "::error::PR #${pr_number} head changed while resolving the merge SHA (${trigger_head_sha} -> ${refreshed_head_sha}); refusing to launch RunPod."
              exit 1
            fi
            if [ -n "${trigger_base_sha}" ] && [ "${refreshed_base_sha}" != "${trigger_base_sha}" ]; then
              echo "::error::PR #${pr_number} base changed while resolving the merge SHA (${trigger_base_sha} -> ${refreshed_base_sha}); refusing to launch RunPod."
              exit 1
            fi

            echo "Pinned PR #${pr_number} merge ref to ${merge_sha}."
            {
              echo "tenferro_ref=${merge_sha}"
              echo "target_head_sha=${pr_head_sha}"
            } >> "${GITHUB_OUTPUT}"
            classify_pr_paths "${pr_number}"
          else
            # Manual dispatch relies on the triggering actor check.
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "::error::Secret-bearing manual RunPod dispatch must use the trusted main workflow."
              exit 1
            fi
            check_permission "${GITHUB_ACTOR}" "Workflow actor"
            if ! [[ "${MANUAL_PR_NUMBER}" =~ ^[0-9]+$ ]]; then
              echo "::error::pr_number must be a non-negative integer."
              exit 1
            fi
            if [ "${MANUAL_PR_NUMBER}" -gt 0 ]; then
              if [ -n "${MANUAL_TENFERRO_REF}" ] || [ -n "${MANUAL_GATE_HEAD_SHA}" ]; then
                echo "::error::pr_number cannot be combined with tenferro_ref or ci_gpu_gate_head_sha."
                exit 1
              fi
              pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${MANUAL_PR_NUMBER}")"
              if [ "$(jq -r .state <<<"${pr_json}")" != open ]; then
                echo "::error::PR #${MANUAL_PR_NUMBER} is not open; refusing recovery."
                exit 1
              fi
              pr_head_repo="$(jq -r '.head.repo.full_name' <<<"${pr_json}")"
              if [ "${pr_head_repo}" != "${GITHUB_REPOSITORY}" ]; then
                echo "::error::PR #${MANUAL_PR_NUMBER} is not from this repository; refusing recovery."
                exit 1
              fi
              pr_author="$(jq -r '.user.login' <<<"${pr_json}")"
              check_permission "${pr_author}" "PR author"
              pr_head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
              refreshed_pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${MANUAL_PR_NUMBER}")"
              refreshed_head_sha="$(jq -r '.head.sha' <<<"${refreshed_pr_json}")"
              refreshed_state="$(jq -r .state <<<"${refreshed_pr_json}")"
              refreshed_head_repo="$(jq -r '.head.repo.full_name' <<<"${refreshed_pr_json}")"
              if [ "${refreshed_head_sha}" != "${pr_head_sha}" ]; then
                echo "::error::PR #${MANUAL_PR_NUMBER} head moved during authorization; refusing recovery."
                exit 1
              fi
              if [ "${refreshed_state}" != open ] || [ "${refreshed_head_repo}" != "${GITHUB_REPOSITORY}" ]; then
                echo "::error::PR #${MANUAL_PR_NUMBER} trust state changed during authorization; refusing recovery."
                exit 1
              fi
              {
                echo "tenferro_ref=${pr_head_sha}"
                echo "target_head_sha=${pr_head_sha}"
              } >> "${GITHUB_OUTPUT}"
              classify_pr_paths "${MANUAL_PR_NUMBER}"
            else
              manual_ref="${MANUAL_TENFERRO_REF:-main}"
              {
                echo "tenferro_ref=${manual_ref}"
                echo "target_head_sha=${MANUAL_GATE_HEAD_SHA}"
                echo "run_gpu=true"
                echo "reason=trusted manual revision validation"
              } >> "${GITHUB_OUTPUT}"
            fi
          fi

  runpod-contract:
    name: Validate RunPod request contract
    needs: authorize
    if: needs.authorize.outputs.gpu_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout trusted RunPod helpers
        uses: actions/checkout@v5
      - name: Validate GPU IDs and CUDA versions against live OpenAPI
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python3 scripts/ci/runpod_contract.py

  pre-runpod-gate:
    name: Wait for review and non-GPU CI
    needs: authorize
    if: needs.authorize.outputs.gpu_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Skip prerequisite gate for manual dispatch
        if: github.event_name != 'workflow_run'
        run: echo "Manual dispatch is gated by the authorize job only."

      - name: Wait for prerequisite checks
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        with:
          script: |
            // Gate paid RunPod startup on checks that best predict a broken PR:
            // repository policy, formatting, lint, coverage, and the full
            // non-GPU workspace test aggregate. CUDA archive compilation still
            // runs on a cheap hosted runner in parallel.
            const required = [
              "repository rules review",
              "rustfmt",
              "clippy",
              "coverage",
              "CI gate (PR workspace tests)",
            ];

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.payload.workflow_run.head_sha;
            const deadline = Date.now() + 85 * 60 * 1000;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            while (Date.now() < deadline) {
              const runs = await github.paginate(github.rest.checks.listForRef, {
                owner,
                repo,
                ref,
                per_page: 100,
              });

              const candidates = new Map();
              for (const run of runs) {
                if (!required.includes(run.name)) {
                  continue;
                }
                const nameRuns = candidates.get(run.name) || [];
                nameRuns.push(run);
                candidates.set(run.name, nameRuns);
              }

              const latest = new Map();
              for (const name of required) {
                const nameRuns = (candidates.get(name) || []).sort((a, b) => {
                  const aTime = new Date(a.started_at || a.created_at || 0);
                  const bTime = new Date(b.started_at || b.created_at || 0);
                  return bTime - aTime;
                });

                // Cancelled or skipped runs can be superseded attempts from
                // before a label/approval update. Use the newest current
                // candidate instead of letting an older success mask a newer
                // active or failed run.
                const effective = nameRuns.find(
                  (run) =>
                    run.status !== "completed" ||
                    !["cancelled", "skipped"].includes(run.conclusion)
                );
                if (effective) {
                  latest.set(name, effective);
                }
              }

              const missing = required.filter((name) => !latest.has(name));
              const pending = required.filter((name) => {
                const run = latest.get(name);
                return run && run.status !== "completed";
              });
              const failed = required.filter((name) => {
                const run = latest.get(name);
                return run && run.status === "completed" && run.conclusion !== "success";
              });

              if (failed.length > 0) {
                for (const name of failed) {
                  const run = latest.get(name);
                  core.error(`${name} concluded ${run.conclusion}: ${run.html_url}`);
                }
                core.setFailed("A prerequisite review or non-GPU CI check failed.");
                return;
              }
              if (missing.length === 0 && pending.length === 0) {
                core.info(`All prerequisite checks passed: ${required.join(", ")}`);
                return;
              }

              core.info(
                `Waiting for prerequisite checks. Missing: ${missing.join(", ") || "none"}. ` +
                  `Pending: ${pending.join(", ") || "none"}.`
              );
              await sleep(30_000);
            }

            core.setFailed(`Timed out waiting for prerequisite checks: ${required.join(", ")}`);

  cuda-archive:
    name: CUDA/PJRT test archive
    needs:
      - authorize
      - runpod-contract
    if: needs.authorize.outputs.gpu_required == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    # actions: read lets this job locate an existing per-key archive artifact
    # from a prior trusted run so a GPU allocation retry never rebuilds it.
    # This job builds PR-controlled code, so it must never hold cache-write
    # or any other write scope: caches are restore-only here and shared cache
    # publication belongs to the trusted ci-cache-publish workflow on main.
    permissions:
      contents: read
      actions: read

    env:
      TENFERRO_REF: ${{ needs.authorize.outputs.tenferro_ref }}

    outputs:
      archive_cache_key: ${{ steps.archive_key.outputs.key }}
      archive_artifact_name: ${{ steps.archive_key.outputs.artifact_name }}

    steps:
      - name: Checkout tenferro-rs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ env.TENFERRO_REPO }}
          ref: ${{ env.TENFERRO_REF }}
          path: tenferro-rs

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master (2026-07-07)
        with:
          toolchain: stable

      - name: Compute CUDA/PJRT archive content key
        id: archive_key
        run: |
          set -euo pipefail
          # Material build inputs only: lockfile, manifests, sources, tests,
          # every checkout-executed CI script and Cargo configuration, the
          # Rust toolchain, and the CUDA binding/PTX versions in the key
          # prefix. scripts/ci/** and .cargo/** MUST stay hashed: they run
          # inside this job from the PR checkout, so an artifact name match
          # has to prove they were identical too. Bump the vN below when the
          # archive build commands or toolkit selection change; unrelated
          # workflow edits must not invalidate the key (#1403).
          rustc_version="$(rustc -V | awk '{print $2}')"
          key="cuda-pjrt-archive-v13-ci-ubuntu22.04-rust${rustc_version}-cuda${CUDARC_CUDA_VERSION}-ptx${CUDA_RUNTIME_VERSION}-${{ hashFiles('tenferro-rs/Cargo.lock', 'tenferro-rs/**/Cargo.toml', 'tenferro-rs/**/src/**', 'tenferro-rs/**/tests/**', 'tenferro-rs/**/examples/**', 'tenferro-rs/**/benches/**', 'tenferro-rs/**/build.rs', 'tenferro-rs/scripts/ci/**', 'tenferro-rs/.cargo/**', 'tenferro-rs/rust-toolchain*', 'tenferro-rs/REPOSITORY_RULES.md', 'tenferro-rs/docs/guides/devices-and-gpu.md', 'tenferro-rs/docs/performance/tt-inner-product-overhead.md') }}"
          {
            echo "key=${key}"
            echo "artifact_name=${key}"
          } >> "${GITHUB_OUTPUT}"
          echo "CUDA/PJRT archive content key: ${key}"

      - name: Restore CUDA/PJRT archives from trusted cache
        # Restore-only: this job executes PR-controlled build code and must
        # never publish into the main-scoped cache namespace. The trusted
        # ci-cache-publish workflow owns cache saves for this key family.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cuda_archive_cache
        with:
          path: |
            tenferro-rs/${{ env.CUDA_ARCHIVE }}
            tenferro-rs/${{ env.PJRT_ARCHIVE }}
          key: ${{ steps.archive_key.outputs.key }}

      - name: Reuse archive artifact from a prior trusted run
        id: archive_reuse
        if: steps.cuda_archive_cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.archive_key.outputs.artifact_name }}
        run: |
          set -euo pipefail
          python3 tenferro-rs/scripts/ci/find_archive_artifact.py \
            --repository "${GITHUB_REPOSITORY}" \
            --artifact-name "${ARTIFACT_NAME}" \
            --current-run-id "${GITHUB_RUN_ID}" \
            --token "${GH_TOKEN}" \
            --output /tmp/archive-reuse.txt
          found="$(sed -n 's/^found=//p' /tmp/archive-reuse.txt | tail -1)"
          reused=false
          if [ "${found}" = "true" ]; then
            artifact_id="$(sed -n 's/^artifact_id=//p' /tmp/archive-reuse.txt | tail -1)"
            run_id="$(sed -n 's/^run_id=//p' /tmp/archive-reuse.txt | tail -1)"
            if gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
                > /tmp/archive-reuse.zip \
              && unzip -o /tmp/archive-reuse.zip -d tenferro-rs \
              && [ -f "tenferro-rs/${CUDA_ARCHIVE}" ] \
              && [ -f "tenferro-rs/${PJRT_ARCHIVE}" ]; then
              reused=true
              echo "Reused immutable archive artifact ${artifact_id} from trusted run ${run_id}."
            else
              echo "Artifact ${artifact_id} download failed; falling back to build."
              rm -f "tenferro-rs/${CUDA_ARCHIVE}" "tenferro-rs/${PJRT_ARCHIVE}"
            fi
          fi
          echo "reused=${reused}" >> "${GITHUB_OUTPUT}"

      - name: Log CUDA/PJRT archive source
        run: |
          if [ "${{ steps.cuda_archive_cache.outputs.cache-hit }}" = "true" ]; then
            echo "CUDA/PJRT archive source: trusted Actions cache (key hit)."
          elif [ "${{ steps.archive_reuse.outputs.reused }}" = "true" ]; then
            echo "CUDA/PJRT archive source: immutable artifact from a prior trusted run."
          else
            echo "CUDA/PJRT archive cache and artifact miss; building CUDA ${CUDA_RUNTIME_VERSION} PTX and PJRT archives."
          fi

      - name: Install CUDA toolkit for archive PTX
        if: steps.cuda_archive_cache.outputs.cache-hit != 'true' && steps.archive_reuse.outputs.reused != 'true'
        run: bash tenferro-rs/scripts/ci/install_cuda_toolkit_hosted.sh "${CUDA_RUNTIME_VERSION}"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        if: steps.cuda_archive_cache.outputs.cache-hit != 'true' && steps.archive_reuse.outputs.reused != 'true'
        with:
          # v8 rotated the namespace when ci-cache-publish took ownership:
          # v7 entries could contain PR-built target artifacts saved by the
          # previously write-capable workflow_run jobs.
          prefix-key: v8-rust-cuda-pjrt-ci-ubuntu22-ptx
          shared-key: cuda-pjrt-ci-${{ env.CUDARC_CUDA_VERSION }}-ptx-${{ env.CUDA_RUNTIME_VERSION }}
          cache-all-crates: true
          cache-workspace-crates: true
          workspaces: tenferro-rs -> target
          # Restore-only for the same reason as the archive cache above.
          save-if: false

      - uses: taiki-e/install-action@3ad7ed62b9acd4b43f91777bf240fac23e489eac # nextest (resolved 2026-07-07)
        if: steps.cuda_archive_cache.outputs.cache-hit != 'true' && steps.archive_reuse.outputs.reused != 'true'
        with:
          tool: nextest

      - name: Build CUDA test archive
        if: steps.cuda_archive_cache.outputs.cache-hit != 'true' && steps.archive_reuse.outputs.reused != 'true'
        working-directory: tenferro-rs
        env:
          CUDARC_CUDA_VERSION: ${{ env.CUDARC_CUDA_VERSION }}
        run: |
          set -euo pipefail
          cargo nextest archive \
            --cargo-profile ci \
            --archive-file "${CUDA_ARCHIVE}" \
            -p tenferro-gpu \
            -p tenferro-ad \
            -p tenferro-linalg \
            --features cuda

      - name: Build PJRT test archive
        if: steps.cuda_archive_cache.outputs.cache-hit != 'true' && steps.archive_reuse.outputs.reused != 'true'
        working-directory: tenferro-rs
        run: |
          set -euo pipefail
          # Hosted CPU build only: pjrt feature is libloading + dynamic plugin load at
          # RunPod runtime. Keep this archive separate from --features cuda.
          cargo nextest archive \
            --cargo-profile ci \
            --archive-file "${PJRT_ARCHIVE}" \
            -p tenferro-xla \
            --features pjrt

      - name: Verify CUDA/PJRT test archives
        working-directory: tenferro-rs
        env:
          ARCHIVE_CACHE_HIT: ${{ steps.cuda_archive_cache.outputs.cache-hit }}
          ARCHIVE_REUSED: ${{ steps.archive_reuse.outputs.reused }}
        run: |
          set -euo pipefail
          if [ ! -f "${CUDA_ARCHIVE}" ]; then
            echo "Missing archive: ${CUDA_ARCHIVE}"
            exit 1
          fi
          if [ ! -f "${PJRT_ARCHIVE}" ]; then
            echo "Missing archive: ${PJRT_ARCHIVE}"
            exit 1
          fi
          echo "Build environment glibc: $(ldd --version | head -1)"
          if [ "${ARCHIVE_CACHE_HIT}" = "true" ]; then
            echo "Archive source: trusted Actions cache."
          elif [ "${ARCHIVE_REUSED}" = "true" ]; then
            echo "Archive source: immutable artifact from a prior trusted run."
          else
            nvcc_bin="${CUDA_PATH}/bin/nvcc"
            echo "Archive source: fresh build with PTX toolkit ${CUDA_PATH} ($("${nvcc_bin}" --version | head -1))."
          fi
          du -sh "${CUDA_ARCHIVE}" "${PJRT_ARCHIVE}" target/ci 2>/dev/null \
            || du -sh "${CUDA_ARCHIVE}" "${PJRT_ARCHIVE}" || true
          df -h .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Always publish the per-key archives to this run: the self-hosted
        # RunPod runner downloads them by name, and later GPU allocation
        # retries reuse them through find_archive_artifact.py instead of
        # rebuilding (#1403).
        with:
          name: ${{ steps.archive_key.outputs.artifact_name }}
          path: |
            tenferro-rs/${{ env.CUDA_ARCHIVE }}
            tenferro-rs/${{ env.PJRT_ARCHIVE }}
          if-no-files-found: error
          retention-days: 7

  start-runpod:
    name: Start RunPod org runner
    needs:
      - authorize
      - runpod-contract
      - pre-runpod-gate
      - cuda-archive
    if: needs.authorize.outputs.gpu_required == 'true'
    runs-on: ubuntu-latest
    # Bounded provision attempts may create, smoke-test, and delete several
    # candidate pods before one is accepted. Must exceed the worst case of
    # max_provision_attempts x (create_deadline_seconds +
    # startup_timeout_seconds + deletion) plus setup, so the loop reaches
    # its explicit exhaustion error instead of being cancelled mid-attempt
    # (contract-tested).
    timeout-minutes: 70

    outputs:
      pod_id: ${{ steps.create_pod.outputs.pod_id }}
      runner_label: ${{ steps.vars.outputs.runner_label }}
      gpu_type_id: ${{ steps.create_pod.outputs.gpu_type_id }}
      gpu_tier: ${{ steps.create_pod.outputs.gpu_tier }}
      gpu_cost_per_hr: ${{ steps.create_pod.outputs.gpu_cost_per_hr }}

    steps:
      - name: Checkout trusted RunPod client
        uses: actions/checkout@v5

      - name: Define runner label
        id: vars
        run: |
          set -euo pipefail
          echo "runner_label=runpod-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ env.ORG_NAME }}

      # JIT (just-in-time) runner config replaces the old org-level
      # registration-token + `config.sh` flow (see issue #1, finding 1). A JIT
      # config is single-runner, single-job, cannot be replayed, and is scoped
      # to the runner group below, so a leaked config has far smaller blast
      # radius than the old org-wide reusable registration token.
      #
      # runner_group_id defaults to 1 (the org's "Default" runner group, which
      # every repo in the org can use). To actually restrict which repos may
      # consume these runners, create a dedicated restricted runner group in
      # the organization settings and set the `RUNPOD_RUNNER_GROUP_ID` repo
      # variable to its id.
      - name: Generate JIT runner config
        id: jit_config
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG_NAME: ${{ env.ORG_NAME }}
          RUNNER_LABEL: ${{ steps.vars.outputs.runner_label }}
          RUNNER_GROUP_ID: ${{ vars.RUNPOD_RUNNER_GROUP_ID || '1' }}
        run: |
          set -euo pipefail

          request_body="$(
            jq -n \
              --arg name "$RUNNER_LABEL" \
              --arg label "$RUNNER_LABEL" \
              --argjson runner_group_id "$RUNNER_GROUP_ID" \
              '{
                name: $name,
                runner_group_id: $runner_group_id,
                labels: ["self-hosted", $label],
                work_folder: "_work"
              }'
          )"

          response_file=/tmp/github-jit-config.json
          status="$(
            curl -sS \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/orgs/${ORG_NAME}/actions/runners/generate-jitconfig" \
              -d "${request_body}" \
              --output "$response_file" \
              --write-out "%{http_code}"
          )"

          echo "GitHub generate-jitconfig HTTP status: ${status}"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            jq . "$response_file" || cat "$response_file"
            echo "Failed to generate JIT runner config" >&2
            exit 1
          fi

          jit_config="$(jq -r .encoded_jit_config "$response_file")"

          if [ -z "$jit_config" ] || [ "$jit_config" = "null" ]; then
            jq 'del(.encoded_jit_config)' "$response_file" || cat "$response_file"
            echo "Failed to generate JIT runner config: missing encoded_jit_config" >&2
            exit 1
          fi

          echo "::add-mask::$jit_config"
          echo "jit_config=${jit_config}" >> "$GITHUB_OUTPUT"

      - name: Provision cheapest compatible RunPod pod
        id: create_pod
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNNER_JIT_CONFIG: ${{ steps.jit_config.outputs.jit_config }}
          RUNPOD_IMAGE: ${{ env.RUNPOD_IMAGE }}
          PROVISION_GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PROVISION_ORG: ${{ env.ORG_NAME }}
          PROVISION_RUNNER_LABEL: ${{ steps.vars.outputs.runner_label }}
          SMOKE_SOURCE_URL: https://raw.githubusercontent.com/${{ env.TENFERRO_REPO }}/${{ github.sha }}/scripts/ci/cuda_smoke_test.py
        run: |
          set -euo pipefail

          echo "::add-mask::${RUNNER_JIT_CONFIG}"
          smoke_min_vram_gb="$(jq -r '.min_vram_gb' scripts/ci/runpod_config.json)"
          cat > /tmp/runpod-startup.sh <<'EOS'
          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive
          export RUNNER_ALLOW_RUNASROOT=1

          apt-get update
          apt-get install -y \
            curl \
            jq \
            tar \
            gzip \
            ca-certificates \
            build-essential \
            pkg-config \
            libssl-dev \
            git \
            python3 \
            python3-pip

          nvidia-smi
          df -h
          free -h
          nproc

          # CUDA compatibility smoke proof (#1404): NVRTC-compile a tiny
          # kernel, load its PTX through the driver, launch, and synchronize
          # BEFORE registering the runner. On an incompatible host this
          # exits nonzero, the container stops without ever becoming a
          # runner, and the trusted provision loop deletes the pod and
          # retries the next candidate with the same immutable archive.
          # The script is fetched at the trusted default-branch SHA baked
          # into SMOKE_SOURCE_URL by the trusted start-runpod job. The
          # long-lived RunPod/GitHub App credentials never reach the pod;
          # the single-use JIT runner config necessarily does, so strip it
          # from the smoke child's environment.
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
            -o /tmp/cuda_smoke_test.py "${SMOKE_SOURCE_URL}"
          env -u RUNNER_JIT_CONFIG python3 /tmp/cuda_smoke_test.py \
            --min-runtime-version "${SMOKE_MIN_RUNTIME_VERSION}" \
            --full-runtime-version "${SMOKE_FULL_RUNTIME_VERSION}" \
            --min-vram-gb "${SMOKE_MIN_VRAM_GB}"

          cd /tmp
          rm -rf actions-runner
          mkdir actions-runner
          cd actions-runner

          # Pinned actions/runner release (see issue #1, finding 5): resolving
          # "latest" at pod-startup time means an attacker who can publish (or
          # a bad actor who can compromise) a runner release gets to run code
          # on every pod we create the moment it lands. Bump both values
          # together after checking the new release's published SHA-256:
          #   gh api repos/actions/runner/releases/latest \
          #     --jq '.tag_name, .body' | less
          # (the sha256 for actions-runner-linux-x64-<version>.tar.gz is in
          # the "SHA-256 Checksums" section of the release body).
          RUNNER_VERSION="2.335.1"
          RUNNER_SHA256="4ef2f25285f0ae4477f1fe1e346db76d2f3ebf03824e2ddd1973a2819bf6c8cf"
          RUNNER_TARBALL="actions-runner-linux-x64-${RUNNER_VERSION}.tar.gz"

          curl -fsSL -o "${RUNNER_TARBALL}" \
            "https://github.com/actions/runner/releases/download/v${RUNNER_VERSION}/${RUNNER_TARBALL}"

          echo "${RUNNER_SHA256}  ${RUNNER_TARBALL}" | sha256sum -c

          tar xzf "${RUNNER_TARBALL}"

          ./run.sh --jitconfig "${RUNNER_JIT_CONFIG}"
          EOS

          # The provision loop orders reviewed candidates by live Secure
          # Cloud price, creates one pod at a time, waits for the smoke
          # proof (runner online) or startup failure (pod exited), deletes
          # incompatible pods immediately, and stops after the bounded
          # attempt budget with an explicit error.
          python3 -m scripts.ci.runpod_provision \
            --config scripts/ci/runpod_config.json \
            --startup-script /tmp/runpod-startup.sh \
            --image-name "${RUNPOD_IMAGE}" \
            --response-file /tmp/runpod-response.json \
            --pod-env "SMOKE_SOURCE_URL=${SMOKE_SOURCE_URL}" \
            --pod-env "SMOKE_MIN_RUNTIME_VERSION=${CUDA_MIN_RUNTIME_VERSION}" \
            --pod-env "SMOKE_FULL_RUNTIME_VERSION=${CUDA_RUNTIME_VERSION}" \
            --pod-env "SMOKE_MIN_VRAM_GB=${smoke_min_vram_gb}"

      - name: Delete pod if runner startup failed
        if: failure() && steps.create_pod.outputs.pod_id != ''
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          POD_ID: ${{ steps.create_pod.outputs.pod_id }}
        run: |
          set -euo pipefail

          echo "Deleting RunPod pod after startup failure: ${POD_ID}"

          response_file=/tmp/runpod-delete-response.json
          status="$(
            curl -sS \
              --request DELETE \
              --url "https://rest.runpod.io/v1/pods/${POD_ID}" \
              --header "Authorization: Bearer ${RUNPOD_API_KEY}" \
              --output "$response_file" \
              --write-out "%{http_code}"
          )"

          echo "RunPod delete HTTP status: ${status}"
          jq . "$response_file" || cat "$response_file" || true

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Warning: failed to delete RunPod pod after startup failure" >&2
            exit 0
          fi

  run-gpu-tests:
    name: CUDA GPU tests on RunPod
    needs:
      - authorize
      - cuda-archive
      - start-runpod
    if: needs.authorize.outputs.gpu_required == 'true'

    env:
      TENFERRO_REF: ${{ needs.authorize.outputs.tenferro_ref }}

    runs-on:
      - self-hosted
      - ${{ needs.start-runpod.outputs.runner_label }}

    timeout-minutes: 45

    steps:
      - name: Checkout tenferro-rs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ env.TENFERRO_REPO }}
          ref: ${{ env.TENFERRO_REF }}
          path: tenferro-rs

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master (2026-07-07)
        with:
          toolchain: stable

      - name: Restore CUDA/PJRT test archives
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cuda_archive_restore
        with:
          path: |
            tenferro-rs/${{ env.CUDA_ARCHIVE }}
            tenferro-rs/${{ env.PJRT_ARCHIVE }}
          key: ${{ needs.cuda-archive.outputs.archive_cache_key }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.cuda_archive_restore.outputs.cache-hit != 'true'
        with:
          name: ${{ needs.cuda-archive.outputs.archive_artifact_name }}
          path: tenferro-rs

      - name: Log CUDA/PJRT archive source
        run: |
          if [ "${{ steps.cuda_archive_restore.outputs.cache-hit }}" = "true" ]; then
            echo "Using CUDA/PJRT test archives restored from GitHub Actions cache."
          else
            echo "Using CUDA/PJRT test archives downloaded from workflow artifact."
          fi
          ls -lh "tenferro-rs/${CUDA_ARCHIVE}" "tenferro-rs/${PJRT_ARCHIVE}"

      - uses: taiki-e/install-action@3ad7ed62b9acd4b43f91777bf240fac23e489eac # nextest (resolved 2026-07-07)
        with:
          tool: nextest

      - name: Check machine
        env:
          RUNPOD_GPU_TIER: ${{ needs.start-runpod.outputs.gpu_tier }}
          RUNPOD_GPU_TYPE_ID: ${{ needs.start-runpod.outputs.gpu_type_id }}
          RUNPOD_GPU_COST_PER_HR: ${{ needs.start-runpod.outputs.gpu_cost_per_hr }}
        run: |
          set -euxo pipefail
          echo "tenferro-rs ref: ${TENFERRO_REF}"
          echo "RunPod price tier: ${RUNPOD_GPU_TIER}"
          echo "RunPod hourly price: \$${RUNPOD_GPU_COST_PER_HR:-unknown}/hr"
          echo "RunPod gpu_type_id (from pod create): ${RUNPOD_GPU_TYPE_ID}"
          echo "=== GPU (nvidia-smi) ==="
          nvidia-smi --query-gpu=index,name,memory.total,driver_version --format=csv
          nvidia-smi
          df -h
          free -h
          nproc

      - name: Select CUDA runtime for driver
        id: select_cuda_runtime
        run: |
          set -euo pipefail
          driver_version="$(nvidia-smi | sed -n 's/.*CUDA Version: \([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' | head -1)"
          if [ -z "${driver_version}" ]; then
            echo "Could not determine the CUDA driver API version from nvidia-smi." >&2
            exit 1
          fi

          cuda_version_ge() {
            local version="$1"
            local min_version="$2"
            local ver_major="${version%%.*}"
            local ver_minor="${version#*.}"
            local min_major="${min_version%%.*}"
            local min_minor="${min_version#*.}"
            if [ "${ver_major}" -gt "${min_major}" ]; then
              return 0
            fi
            if [ "${ver_major}" -lt "${min_major}" ]; then
              return 1
            fi
            [ "${ver_minor}" -ge "${min_minor}" ]
          }

          if ! cuda_version_ge "${driver_version}" "${CUDA_MIN_RUNTIME_VERSION}"; then
            echo "CUDA driver API ${driver_version} is below the ${CUDA_MIN_RUNTIME_VERSION} minimum." >&2
            exit 1
          fi
          if cuda_version_ge "${driver_version}" "${CUDA_RUNTIME_VERSION}"; then
            runtime_version="${CUDA_RUNTIME_VERSION}"
            capability_tier="full"
          else
            runtime_version="${CUDA_MIN_RUNTIME_VERSION}"
            capability_tier="baseline"
          fi

          {
            echo "driver_version=${driver_version}"
            echo "runtime_version=${runtime_version}"
            echo "capability_tier=${capability_tier}"
          } >> "${GITHUB_OUTPUT}"
          echo "Driver CUDA API: ${driver_version}"
          echo "Selected CUDA runtime: ${runtime_version} (${capability_tier} CubeCL capabilities)"

      # Restore-only on the self-hosted pod: a cache-write credential must
      # never be exposed to the RunPod runner (#1403). The trusted
      # ci-cache-publish workflow on main owns publication of these caches.
      - name: Restore cuTENSOR redistributable
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cutensor_cache
        with:
          path: ${{ env.TENFERRO_CI_CACHE_ROOT }}/cutensor-${{ env.CUTENSOR_VERSION }}
          key: cutensor-${{ runner.os }}-x86_64-${{ env.CUTENSOR_VERSION }}-cuda12-v2

      - name: Restore CUDA minimal runtime tree
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cuda_runtime_cache
        with:
          path: ${{ env.TENFERRO_CI_CACHE_ROOT }}/cuda-runtime-${{ steps.select_cuda_runtime.outputs.runtime_version }}
          key: cuda-runtime-${{ runner.os }}-x86_64-${{ steps.select_cuda_runtime.outputs.runtime_version }}-minimal-v6

      - name: Log pod cache restore status
        env:
          CUTENSOR_HIT: ${{ steps.cutensor_cache.outputs.cache-hit }}
          CUDA_RUNTIME_HIT: ${{ steps.cuda_runtime_cache.outputs.cache-hit }}
        run: |
          echo "cuTENSOR cache hit: ${CUTENSOR_HIT:-false}"
          echo "CUDA runtime tree cache hit: ${CUDA_RUNTIME_HIT:-false}"
          echo "Misses fall back to direct downloads on the pod; publication is owned by ci-cache-publish on main."

      - name: Configure CUDA runtime libraries
        env:
          CUDA_DRIVER_VERSION: ${{ steps.select_cuda_runtime.outputs.driver_version }}
          CUDA_RUNTIME_VERSION: ${{ steps.select_cuda_runtime.outputs.runtime_version }}
        run: |
          set -euo pipefail
          if ! command -v nvidia-smi >/dev/null 2>&1; then
            echo "nvidia-smi not found; the RunPod GPU image should include NVIDIA drivers."
            exit 1
          fi
          nvidia-smi

          cuda_toolkit_version() {
            local root="$1"
            if [ -f "${root}/version.json" ]; then
              python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['cuda']['version'].rsplit('.', 1)[0])" "${root}/version.json" 2>/dev/null || true
            elif [ -f "${root}/version.txt" ]; then
              sed -n 's/.*CUDA Version \([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' "${root}/version.txt" | head -1
            else
              basename "${root}" | sed -n 's/^cuda-\([0-9][0-9]*\.[0-9][0-9]*\)$/\1/p'
            fi
          }

          accept_cuda_toolkit() {
            local candidate="$1"
            if [ ! -d "${candidate}" ]; then
              return 1
            fi
            if [ ! -d "${candidate}/lib64" ] && [ ! -d "${candidate}/targets/x86_64-linux/lib" ]; then
              echo "Skipping CUDA toolkit at ${candidate} (library directory not found)."
              return 1
            fi
            local version
            version="$(cuda_toolkit_version "${candidate}")"
            if [ "${version}" = "${CUDA_RUNTIME_VERSION}" ]; then
              cuda_path="${candidate}"
              echo "Using CUDA toolkit at ${candidate} (version ${version})."
              return 0
            fi
            if [ -n "${version}" ]; then
              echo "Skipping CUDA toolkit at ${candidate} (found ${version}, need exactly ${CUDA_RUNTIME_VERSION})."
            else
              echo "Skipping CUDA toolkit at ${candidate} (version metadata not found, need exactly ${CUDA_RUNTIME_VERSION})."
            fi
            return 1
          }

          cuda_runtime_cache="${TENFERRO_CI_CACHE_ROOT}/cuda-runtime-${CUDA_RUNTIME_VERSION}"
          cuda_path=""
          if [ -n "${CUDA_PATH:-}" ]; then
            accept_cuda_toolkit "${CUDA_PATH}" || cuda_path=""
          fi
          if [ -z "${cuda_path}" ] && command -v nvcc >/dev/null 2>&1; then
            accept_cuda_toolkit "$(dirname "$(dirname "$(command -v nvcc)")")" || true
          fi
          if [ -z "${cuda_path}" ]; then
            for candidate in \
              "/usr/local/cuda-${CUDA_RUNTIME_VERSION}" \
              /usr/local/cuda \
              /usr/local/cuda-13.1 \
              /usr/local/cuda-13 \
              /usr/local/cuda-12; do
              if accept_cuda_toolkit "${candidate}"; then
                break
              fi
            done
          fi

          if [ -z "${cuda_path}" ] && [ -f "${cuda_runtime_cache}/.seed-complete" ] && [ -d "${cuda_runtime_cache}/lib64" ]; then
            echo "Using cached CUDA ${CUDA_RUNTIME_VERSION} minimal runtime tree from ${cuda_runtime_cache}."
            cuda_path="${cuda_runtime_cache}"
          fi

          if [ -z "${cuda_path}" ]; then
            # Cache miss fallback: install and seed the local tree. The
            # seeded tree is NOT published from the pod; ci-cache-publish on
            # main owns publication of the shared cache (#1403).
            bash tenferro-rs/scripts/ci/install_cuda_runtime_tree.sh \
              "${CUDA_RUNTIME_VERSION}" "${cuda_runtime_cache}"
            cuda_path="${cuda_runtime_cache}"
          fi

          if [ -z "${cuda_path}" ]; then
            echo "CUDA toolkit path not found after minimal CUDA ${CUDA_RUNTIME_VERSION} runtime package install on RunPod."
            exit 1
          fi

          cuda_library_path="${cuda_path}/lib64"
          if [ -d "${cuda_path}/targets/x86_64-linux/lib" ]; then
            cuda_library_path="${cuda_library_path}:${cuda_path}/targets/x86_64-linux/lib"
          fi

          cutensor_root="${TENFERRO_CI_CACHE_ROOT}/cutensor-${CUTENSOR_VERSION}"
          cutensor_lib="${cutensor_root}/lib"

          cutensor_path=""
          for candidate in \
            "${cuda_path}/lib64/libcutensor.so.2" \
            "/usr/lib/x86_64-linux-gnu/libcutensor/12/libcutensor.so.2" \
            "${cutensor_lib}/libcutensor.so.2" \
            "${cutensor_lib}/libcutensor.so.2.6.0"; do
            if [ -e "${candidate}" ]; then
              cutensor_path="${candidate}"
              break
            fi
          done

          if [ -z "${cutensor_path}" ]; then
            # Cache miss fallback: download on the pod without publishing;
            # ci-cache-publish on main owns the shared cache (#1403).
            bash tenferro-rs/scripts/ci/install_cutensor.sh \
              "${CUTENSOR_VERSION}" "${cutensor_root}"
            for candidate in \
              "${cutensor_lib}/libcutensor.so.2" \
              "${cutensor_lib}/libcutensor.so.2.6.0"; do
              if [ -e "${candidate}" ]; then
                cutensor_path="${candidate}"
                break
              fi
            done
          fi

          if [ -z "${cutensor_path}" ]; then
            echo "cuTENSOR shared library not found after redistributable install."
            echo "Expected ${cutensor_lib}/libcutensor.so.2 under ${TENFERRO_CI_CACHE_ROOT}."
            if [ -d "${cutensor_lib}" ]; then
              ls -la "${cutensor_lib}" || true
            else
              echo "Missing directory: ${cutensor_lib}"
            fi
            exit 1
          fi

          echo "CUDA_PATH=${cuda_path}" >> "${GITHUB_ENV}"
          echo "${cuda_path}/bin" >> "${GITHUB_PATH}"
          echo "LD_LIBRARY_PATH=${cuda_library_path}:$(dirname "${cutensor_path}"):${LD_LIBRARY_PATH:-}" >> "${GITHUB_ENV}"
          echo "TENFERRO_CUTENSOR_PATH=${cutensor_path}" >> "${GITHUB_ENV}"

      - name: Verify loaded NVRTC version
        env:
          CUDA_DRIVER_VERSION: ${{ steps.select_cuda_runtime.outputs.driver_version }}
          CUDA_RUNTIME_VERSION: ${{ steps.select_cuda_runtime.outputs.runtime_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ctypes
          import os

          nvrtc = ctypes.CDLL("libnvrtc.so")
          major = ctypes.c_int()
          minor = ctypes.c_int()
          status = nvrtc.nvrtcVersion(ctypes.byref(major), ctypes.byref(minor))
          if status != 0:
              raise SystemExit(f"nvrtcVersion failed with status {status}")
          loaded = (major.value, minor.value)
          driver = tuple(
              int(part) for part in os.environ["CUDA_DRIVER_VERSION"].split(".")
          )
          selected = tuple(
              int(part) for part in os.environ["CUDA_RUNTIME_VERSION"].split(".")
          )
          minimum = tuple(
              int(part)
              for part in os.environ["CUDA_MIN_RUNTIME_VERSION"].split(".")
          )
          full = (12, 8)
          print(f"Driver CUDA API version: {driver[0]}.{driver[1]}")
          print(f"Loaded NVRTC version: {loaded[0]}.{loaded[1]}")
          if driver < minimum:
              raise SystemExit(
                  f"CUDA driver API {driver[0]}.{driver[1]} is older than minimum "
                  f"CUDA {minimum[0]}.{minimum[1]}"
              )
          if loaded < minimum:
              raise SystemExit(
                  f"NVRTC {loaded[0]}.{loaded[1]} is older than minimum "
                  f"CUDA {minimum[0]}.{minimum[1]}"
              )
          if loaded > driver:
              raise SystemExit(
                  f"NVRTC {loaded[0]}.{loaded[1]} is newer than driver API "
                  f"{driver[0]}.{driver[1]}"
              )
          if loaded != selected:
              raise SystemExit(
                  f"Loaded NVRTC {loaded[0]}.{loaded[1]} does not match selected "
                  f"CUDA runtime {selected[0]}.{selected[1]}"
              )
          tier = "full" if loaded >= full and driver >= full else "baseline"
          print(f"Expected CubeCL CUDA capability tier: {tier}")
          PY

      - name: Link archive build workspace path
        run: |
          set -euo pipefail
          archive_root="${ARCHIVE_WORKSPACE_ROOT}"
          mkdir -p "$(dirname "${archive_root}")"
          if [ -e "${archive_root}" ] && [ ! -L "${archive_root}" ]; then
            echo "Archive workspace path exists and is not a symlink: ${archive_root}" >&2
            exit 1
          fi
          ln -sfn "${GITHUB_WORKSPACE}" "${archive_root}"
          echo "Linked ${archive_root} -> ${GITHUB_WORKSPACE}"
          test -f "${archive_root}/tenferro-rs/crates/tenferro-ad/src/context.rs"

      - name: Run CUDA tests from archive
        working-directory: tenferro-rs
        env:
          NEXTEST_TEST_THREADS: "1"
        run: |
          set -euo pipefail
          cargo nextest run \
            --archive-file "${CUDA_ARCHIVE}" \
            --workspace-remap "${GITHUB_WORKSPACE}/tenferro-rs" \
            --run-ignored all \
            --no-fail-fast \
            -j 1

      - name: Run OpenXLA PJRT E2E tests from archive
        working-directory: tenferro-rs
        env:
          NEXTEST_TEST_THREADS: "1"
        run: |
          set -euo pipefail
          if [ ! -f "${PJRT_ARCHIVE}" ]; then
            echo "Missing PJRT archive: ${PJRT_ARCHIVE}"
            exit 1
          fi
          wheel_dir="${RUNNER_TEMP}/openxla-pjrt-wheels"
          unpack_dir="${RUNNER_TEMP}/openxla-pjrt"
          rm -rf "${wheel_dir}" "${unpack_dir}"
          mkdir -p "${wheel_dir}" "${unpack_dir}"
          python3 -m pip download --only-binary=:all: --no-deps \
            --dest "${wheel_dir}" \
            "jax-cuda12-pjrt==${JAX_CUDA12_PJRT_VERSION}" \
            "nvidia-cudnn-cu12==${NVIDIA_CUDNN_CU12_VERSION}" \
            "nvidia-cuda-nvcc-cu12==${NVIDIA_CUDA_NVCC_CU12_VERSION}"
          python3 - <<'PY'
          import os
          import pathlib
          import zipfile

          wheel_dir = pathlib.Path(os.environ["RUNNER_TEMP"]) / "openxla-pjrt-wheels"
          unpack_dir = pathlib.Path(os.environ["RUNNER_TEMP"]) / "openxla-pjrt"
          for wheel in wheel_dir.glob("*.whl"):
              target = unpack_dir / wheel.stem
              with zipfile.ZipFile(wheel) as archive:
                  archive.extractall(target)
          PY
          plugin_path="$(find "${unpack_dir}" -path '*/jax_plugins/xla_cuda12/xla_cuda_plugin.so' -print -quit)"
          cudnn_lib="$(find "${unpack_dir}" -path '*/nvidia/cudnn/lib' -type d -print -quit)"
          cuda_nvcc_dir="$(find "${unpack_dir}" -path '*/nvidia/cuda_nvcc' -type d -print -quit)"
          if [ -z "${plugin_path}" ]; then
            echo "xla_cuda_plugin.so not found under ${unpack_dir}"
            exit 1
          fi
          if [ -z "${cudnn_lib}" ]; then
            echo "cuDNN lib directory not found under ${unpack_dir}"
            exit 1
          fi
          if [ -z "${cuda_nvcc_dir}" ]; then
            echo "CUDA NVCC directory not found under ${unpack_dir}"
            exit 1
          fi
          chmod +x "${cuda_nvcc_dir}/bin/"*
          test -x "${cuda_nvcc_dir}/bin/ptxas"
          test -f "${cuda_nvcc_dir}/nvvm/libdevice/libdevice.10.bc"
          nm -D "${plugin_path}" | grep -q GetPjrtApi
          # Runtime-only plugin setup; Rust binaries come from the hosted PJRT archive.
          XLA_FLAGS="--xla_gpu_cuda_data_dir=${cuda_nvcc_dir} ${XLA_FLAGS:-}" \
          TENFERRO_PJRT_PLUGIN="${plugin_path}" \
          LD_LIBRARY_PATH="${cudnn_lib}:${LD_LIBRARY_PATH:-}" \
            cargo nextest run \
              --archive-file "${PJRT_ARCHIVE}" \
              --workspace-remap "${GITHUB_WORKSPACE}/tenferro-rs" \
              --run-ignored all \
              --no-fail-fast \
              -j 1 \
              -E 'test(pjrt_execution)'

      - name: GPU test complete
        run: echo "RUNPOD_TENFERRO_GPU_TEST_OK"

  cleanup-runpod:
    name: Delete RunPod pod
    needs:
      - authorize
      - start-runpod
      - run-gpu-tests

    if: always() && needs.authorize.outputs.gpu_required == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Delete RunPod pod
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          POD_ID: ${{ needs.start-runpod.outputs.pod_id }}
        run: |
          set -euo pipefail

          if [ -z "${POD_ID}" ] || [ "${POD_ID}" = "null" ]; then
            echo "No POD_ID; nothing to delete"
            exit 0
          fi

          # Estimated paid cost observability (#1404): read hourly price and
          # uptime from the pod record before deleting it.
          pod_file=/tmp/runpod-pod.json
          get_status="$(
            curl -sS \
              --url "https://rest.runpod.io/v1/pods/${POD_ID}" \
              --header "Authorization: Bearer ${RUNPOD_API_KEY}" \
              --output "$pod_file" \
              --write-out "%{http_code}"
          )" || get_status=000
          if [ "$get_status" -ge 200 ] && [ "$get_status" -lt 300 ]; then
            python3 - "$pod_file" <<'PY' || true
          import datetime, json, sys
          pod = json.load(open(sys.argv[1]))
          cost = pod.get("adjustedCostPerHr") or pod.get("costPerHr")
          started = pod.get("lastStartedAt")
          if isinstance(cost, (int, float)) and isinstance(started, str):
              begin = datetime.datetime.fromisoformat(started.replace("Z", "+00:00"))
              hours = max(
                  0.0,
                  (datetime.datetime.now(datetime.timezone.utc) - begin).total_seconds()
                  / 3600.0,
              )
              print(f"RunPod paid time: {hours:.2f}h at ${cost:.2f}/hr")
              print(f"RunPod estimated paid cost: ${hours * cost:.2f}")
          else:
              print("RunPod cost data unavailable in pod record")
          PY
          fi

          echo "Deleting RunPod pod: ${POD_ID}"

          response_file=/tmp/runpod-delete-response.json
          status="$(
            curl -sS \
              --request DELETE \
              --url "https://rest.runpod.io/v1/pods/${POD_ID}" \
              --header "Authorization: Bearer ${RUNPOD_API_KEY}" \
              --output "$response_file" \
              --write-out "%{http_code}"
          )"

          echo "RunPod delete HTTP status: ${status}"
          jq . "$response_file" || cat "$response_file" || true

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Warning: failed to delete RunPod pod" >&2
            exit 0
          fi

          echo "Deleted RunPod pod: ${POD_ID}"

  ci-gpu-gate:
    name: Publish CI GPU gate
    needs:
      - authorize
      - runpod-contract
      - pre-runpod-gate
      - cuda-archive
      - start-runpod
      - run-gpu-tests
      - cleanup-runpod

    if: >-
      always() &&
      !cancelled() &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.event == 'pull_request'
      )

    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      checks: write
      contents: read

    steps:
      - name: Publish required PR check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_HEAD_SHA: ${{ needs.authorize.outputs.target_head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUTHORIZE_RESULT: ${{ needs.authorize.result }}
          GPU_REQUIRED: ${{ needs.authorize.outputs.gpu_required }}
          POLICY_REASON: ${{ needs.authorize.outputs.policy_reason }}
          CONTRACT_RESULT: ${{ needs.runpod-contract.result }}
          PRE_RUNPOD_RESULT: ${{ needs.pre-runpod-gate.result }}
          ARCHIVE_RESULT: ${{ needs.cuda-archive.result }}
          START_RUNPOD_RESULT: ${{ needs.start-runpod.result }}
          RUN_GPU_TESTS_RESULT: ${{ needs.run-gpu-tests.result }}
          CLEANUP_RUNPOD_RESULT: ${{ needs.cleanup-runpod.result }}
        run: |
          set -euo pipefail

          failures_file="$(mktemp)"

          record_result() {
            local job="$1"
            local result="$2"
            if [ "${result}" != "success" ]; then
              echo "::error::Expected ${job} to succeed; got ${result}."
              echo "- ${job}: ${result}" >> "${failures_file}"
            fi
          }

          record_result "authorize" "${AUTHORIZE_RESULT}"
          if [ "${GPU_REQUIRED}" = true ]; then
            record_result "runpod-contract" "${CONTRACT_RESULT}"
            record_result "pre-runpod-gate" "${PRE_RUNPOD_RESULT}"
            record_result "cuda-archive" "${ARCHIVE_RESULT}"
            record_result "start-runpod" "${START_RUNPOD_RESULT}"
            record_result "run-gpu-tests" "${RUN_GPU_TESTS_RESULT}"
            record_result "cleanup-runpod" "${CLEANUP_RUNPOD_RESULT}"
          elif [ "${GPU_REQUIRED}" = false ]; then
            echo "GPU validation not required: ${POLICY_REASON}"
          else
            echo "::error::Authorize job did not publish a valid GPU policy."
            echo "- authorize policy: ${GPU_REQUIRED:-missing}" >> "${failures_file}"
          fi

          conclusion="success"
          title="RunPod CI GPU gate passed"
          summary="RunPod GPU validation completed successfully and owns CI GPU gate."
          if [ "${GPU_REQUIRED}" = false ]; then
            title="RunPod CI GPU gate not required"
            summary="GPU validation not required for this change: ${POLICY_REASON}"
          fi
          if [ -s "${failures_file}" ]; then
            conclusion="failure"
            title="RunPod CI GPU gate failed"
            summary="$(printf 'RunPod GPU validation did not complete successfully.\\n\\n%s' "$(cat "${failures_file}")")"
          fi

          target_sha="${TARGET_HEAD_SHA}"

          if [ -n "${target_sha}" ]; then
            echo "Publishing CI GPU gate check to PR head SHA ${target_sha}."
            jq -n \
              --arg name "CI GPU gate" \
              --arg head_sha "${target_sha}" \
              --arg conclusion "${conclusion}" \
              --arg details_url "${RUN_URL}" \
              --arg title "${title}" \
              --arg summary "${summary}" \
              '{
                name: $name,
                head_sha: $head_sha,
                status: "completed",
                conclusion: $conclusion,
                details_url: $details_url,
                output: {
                  title: $title,
                  summary: $summary
                }
              }' > /tmp/ci-gpu-gate-check.json

            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/check-runs" \
              --input /tmp/ci-gpu-gate-check.json
          else
            echo "No PR head SHA available; skipping PR-head CI GPU gate publication."
          fi

          if [ "${conclusion}" != "success" ]; then
            exit 1
          fi
