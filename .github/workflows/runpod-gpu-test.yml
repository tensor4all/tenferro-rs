name: RunPod tenferro-rs GPU Test

# ---------------------------------------------------------------------------
# Security policy for this workflow (tracked in issue #1; keep this comment
# in sync with any port to the public tensor4all/tenferro-rs repo):
#
#   * This workflow drives an ephemeral RunPod GPU pod registered as a
#     self-hosted GitHub Actions runner. Self-hosted runners on a repo that
#     accepts external contributions are a well-known escalation path
#     (see GitHub's "Security hardening for GitHub Actions" guide).
#   * PR-triggered runs enter through `workflow_run` from the trusted default
#     branch workflow file, not through a PR-controlled `pull_request` copy of
#     this workflow. They MUST reject fork PRs before RunPod startup. The pod
#     executes the checked-out ref as root, in the same container as the runner
#     process, so fork code must never reach the self-hosted runner.
#   * NEVER add `pull_request_target` to this workflow: that would combine base
#     repository secrets with PR-controlled refs.
#   * Top-level permissions must stay read-only. In particular, never add
#     `id-token: write` or any write scope to a job that runs on the
#     self-hosted RunPod runner (`run-gpu-tests`). `checks: read` is present
#     only so the GitHub-hosted pre-RunPod gate can wait for cheap CI before
#     any paid pod is created.
#   * `RUNPOD_API_KEY` (and the GitHub App credentials used to mint the JIT
#     runner config) must only ever be read in trusted-base GitHub-hosted jobs
#     (`runpod-contract`, `start-runpod`, `cleanup-runpod`). Neither may ever be passed to, or
#     become readable from, the pod itself. Automatic PR runs are started only
#     by `workflow_run`, after `authorize` gates the run to same-repo
#     maintainer/admin PRs.
#   * Cache and artifact trust (#1403): every job in this workflow is a cache
#     READER only (`actions/cache/restore`, rust-cache `save-if: false`).
#     Jobs here either execute PR-controlled build code (cuda-archive) or run
#     on the self-hosted pod (run-gpu-tests), so none of them may hold a
#     cache-write credential for the main-scoped namespace: `workflow_run`
#     runs on refs/heads/main, so any cache save from here would publish
#     attacker-influenceable bytes into the trusted namespace. Shared cache
#     publication is owned by `ci-cache-publish.yml`, which only ever builds
#     default-branch code. GPU allocation retries reuse the immutable per-key
#     archive artifact through scripts/ci/find_archive_artifact.py instead of
#     rebuilding. See docs/design/ci-cache-trust.md.
#   * GPU selection and compatibility (#1404): the trusted start-runpod job
#     orders reviewed GPU candidates by live Secure Cloud price and creates
#     them one at a time. The pod startup script proves CUDA compatibility
#     (NVRTC compile -> PTX load -> kernel launch -> sync) BEFORE the runner
#     registers; incompatible pods exit, are deleted, and the next candidate
#     is tried with the same immutable archive, bounded by
#     max_provision_attempts. The smoke script is fetched at the trusted
#     default-branch SHA and receives no credentials. See
#     docs/design/runpod-gpu-provisioning.md.
#   * This workflow owns the branch-protection-required `CI GPU gate` check for
#     eligible same-repo maintainer PRs by publishing that check to the PR head
#     SHA from a GitHub-hosted final gate job. Fork PRs keep using the legacy
#     `CI_gpu.yml` pull_request path because base-repo Checks API writes cannot
#     attach a check run to fork commits.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository PR number to recover through trusted main
        required: false
        default: 0
        type: number
      tenferro_ref:
        description: tenferro-rs git ref (branch, tag, or SHA)
        required: false
        default: ""
        type: string
      ci_gpu_gate_head_sha:
        description: Optional PR head SHA to publish the CI GPU gate check to
        required: false
        default: ""
        type: string
      keep_failed_pods:
        description: >-
          Debug only: keep smoke-rejected pods alive (they keep billing!) so
          their console logs can be inspected in the RunPod dashboard
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: ["CI PR workspace tests"]
    # Start trusted preparation as soon as the upstream workflow exists. The
    # pre-runpod gate still waits for rustfmt and clippy before any paid pod.
    types: [in_progress]

# Preparation is independent; only the reusable paid lifecycle is serialized.

permissions:
  checks: read
  contents: read

env:
  ORG_NAME: tensor4all
  TENFERRO_REPO: tensor4all/tenferro-rs
  CARGO_TERM_COLOR: always
  CUBECL_DEBUG_LOG: "0"
  CUDA_ARCHIVE: cuda-tests.tar.zst
  PJRT_ARCHIVE: pjrt-tests.tar.zst
  CUDA_TUTORIAL_ARCHIVE: cuda-tutorial.tar.zst
  # Keep 12.8 bindings so newer runtimes retain every CubeCL CUDA feature.
  CUDARC_CUDA_VERSION: "12080"
  # RunPod may select the 12.6 baseline; 12.8 enables the full CubeCL feature set.
  CUDA_MIN_RUNTIME_VERSION: "12.6"
  CUDA_RUNTIME_VERSION: "12.8"
  ARCHIVE_WORKSPACE_ROOT: /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}
  # Fixed cache root shared by GitHub-hosted writers (ci-cache-publish) and
  # the RunPod pod so restored absolute paths line up on both runner kinds.
  TENFERRO_CI_CACHE_ROOT: /opt/tenferro-ci
  CUTENSOR_VERSION: "2.6.0.4"
  JAX_CUDA12_PJRT_VERSION: "0.10.2"
  NVIDIA_CUDNN_CU12_VERSION: "9.23.2.1"
  NVIDIA_CUDA_NVCC_CU12_VERSION: "12.9.86"
  RUNPOD_IMAGE: runpod/pytorch:2.1.0-py3.10-cuda11.8.0-devel-ubuntu22.04

jobs:
  authorize:
    name: Authorize RunPod GPU run
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.status == 'in_progress')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      tenferro_ref: ${{ steps.resolve_ref.outputs.tenferro_ref }}
      gpu_required: ${{ steps.resolve_ref.outputs.run_gpu }}
      policy_reason: ${{ steps.resolve_ref.outputs.reason }}
      target_head_sha: ${{ steps.resolve_ref.outputs.target_head_sha }}
      target_base_sha: ${{ steps.resolve_ref.outputs.target_base_sha }}
      pr_number: ${{ steps.resolve_ref.outputs.pr_number }}
      local_gpu_validation: ${{ steps.resolve_ref.outputs.local_gpu_validation }}

    steps:
      # workflow_run resolves this checkout to trusted default-branch content.
      # Manual dispatch is rejected below unless the workflow ref is main.
      - name: Checkout trusted CI policy
        uses: actions/checkout@v5

      - name: Check actor and PR source are allowed
        id: resolve_ref
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PR_NUMBER: ${{ inputs.pr_number || 0 }}
          MANUAL_TENFERRO_REF: ${{ inputs.tenferro_ref || '' }}
          MANUAL_GATE_HEAD_SHA: ${{ inputs.ci_gpu_gate_head_sha || '' }}
          WORKFLOW_RUN_ACTOR: ${{ github.event.workflow_run.actor.login || '' }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event || '' }}
          WORKFLOW_RUN_PULL_REQUESTS: ${{ toJson(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail

          check_permission() {
            local login="$1"
            local role="$2"
            local repository_role

            repository_role="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${login}/permission" --jq .role_name)"

            case "${repository_role}" in
              admin|maintain)
                echo "OK: ${role} ${login} has '${repository_role}' repository role and is allowed to launch RunPod CI."
                ;;
              *)
                echo "::error::${role} ${login} has '${repository_role}' repository role, which is not allowed to launch RunPod CI (requires admin or maintain)."
                exit 1
              ;;
            esac
          }

          classify_pr_paths() {
            local pr_number="$1"
            local changed_paths=/tmp/runpod-pr-changed-paths.txt
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/files?per_page=100" \
              --jq '.[].filename' > "${changed_paths}"
            local policy_args=()
            while IFS= read -r path; do
              if [ -n "${path}" ]; then
                policy_args+=(--path "${path}")
              fi
            done < "${changed_paths}"
            python3 scripts/ci/change_policy.py "${policy_args[@]}"

            # A maintainer-recorded local GPU run substitutes for the paid
            # RunPod gate for this PR (REPOSITORY_RULES.md, CI Cost
            # Discipline). The label only takes effect together with an
            # evidence comment from a repository admin/maintainer, which the
            # gate job verifies before it publishes a passing check, so the
            # label alone cannot waive GPU validation.
            local_labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/labels" --jq '.[].name')"
            if grep -Fxq "gpu-validated-locally" <<<"${local_labels}"; then
              echo "local_gpu_validation=true"
            else
              echo "local_gpu_validation=false"
            fi
          }

          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            if [ "${WORKFLOW_RUN_EVENT}" != "pull_request" ]; then
              echo "::error::RunPod CI workflow_run events must come from pull_request workflows, got '${WORKFLOW_RUN_EVENT}'."
              exit 1
            fi

            pr_number="$(jq -r '.[0].number // empty' <<<"${WORKFLOW_RUN_PULL_REQUESTS}")"
            trigger_head_sha="$(jq -r '.[0].head.sha // empty' <<<"${WORKFLOW_RUN_PULL_REQUESTS}")"
            trigger_base_sha="$(jq -r '.[0].base.sha // empty' <<<"${WORKFLOW_RUN_PULL_REQUESTS}")"
            if [ -z "${pr_number}" ]; then
              echo "::error::workflow_run did not include an associated pull request."
              exit 1
            fi

            pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
            pr_author="$(jq -r '.user.login' <<<"${pr_json}")"
            pr_head_repo="$(jq -r '.head.repo.full_name' <<<"${pr_json}")"
            pr_head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
            pr_base_sha="$(jq -r '.base.sha' <<<"${pr_json}")"

            if [ "${pr_head_repo}" != "${GITHUB_REPOSITORY}" ]; then
              echo "::error::Fork PRs are not allowed to launch RunPod CI (${pr_head_repo} -> ${GITHUB_REPOSITORY})."
              exit 1
            fi

            if [ -n "${trigger_head_sha}" ] && [ "${pr_head_sha}" != "${trigger_head_sha}" ]; then
              echo "::error::PR #${pr_number} head changed after the triggering CI run (${trigger_head_sha} -> ${pr_head_sha}); refusing to launch RunPod."
              exit 1
            fi
            if [ -n "${trigger_base_sha}" ] && [ "${pr_base_sha}" != "${trigger_base_sha}" ]; then
              echo "::error::PR #${pr_number} base changed after the triggering CI run (${trigger_base_sha} -> ${pr_base_sha}); refusing to launch RunPod."
              exit 1
            fi

            check_permission "${pr_author}" "PR author"
            check_permission "${WORKFLOW_RUN_ACTOR}" "Source workflow actor"

            merge_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/pull/${pr_number}/merge" --jq .object.sha)"
            if [ -z "${merge_sha}" ] || [ "${merge_sha}" = "null" ]; then
              echo "::error::Failed to resolve refs/pull/${pr_number}/merge."
              exit 1
            fi

            # Re-read the PR after resolving the moving merge ref. Without
            # this second check, a push between the first PR read and the merge
            # ref lookup could make the pinned merge SHA belong to a newer
            # head/base pair than the CI run that triggered this workflow.
            refreshed_pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
            refreshed_head_sha="$(jq -r '.head.sha' <<<"${refreshed_pr_json}")"
            refreshed_base_sha="$(jq -r '.base.sha' <<<"${refreshed_pr_json}")"
            if [ -n "${trigger_head_sha}" ] && [ "${refreshed_head_sha}" != "${trigger_head_sha}" ]; then
              echo "::error::PR #${pr_number} head changed while resolving the merge SHA (${trigger_head_sha} -> ${refreshed_head_sha}); refusing to launch RunPod."
              exit 1
            fi
            if [ -n "${trigger_base_sha}" ] && [ "${refreshed_base_sha}" != "${trigger_base_sha}" ]; then
              echo "::error::PR #${pr_number} base changed while resolving the merge SHA (${trigger_base_sha} -> ${refreshed_base_sha}); refusing to launch RunPod."
              exit 1
            fi

            echo "Pinned PR #${pr_number} merge ref to ${merge_sha}."
            {
              echo "tenferro_ref=${merge_sha}"
              echo "target_head_sha=${pr_head_sha}"
              echo "target_base_sha=${pr_base_sha}"
              echo "pr_number=${pr_number}"
            } >> "${GITHUB_OUTPUT}"
            classify_pr_paths "${pr_number}"
          else
            # Manual dispatch relies on the triggering actor check.
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "::error::Secret-bearing manual RunPod dispatch must use the trusted main workflow."
              exit 1
            fi
            check_permission "${GITHUB_ACTOR}" "Workflow actor"
            if ! [[ "${MANUAL_PR_NUMBER}" =~ ^[0-9]+$ ]]; then
              echo "::error::pr_number must be a non-negative integer."
              exit 1
            fi
            if [ "${MANUAL_PR_NUMBER}" -gt 0 ]; then
              if [ -n "${MANUAL_TENFERRO_REF}" ] || [ -n "${MANUAL_GATE_HEAD_SHA}" ]; then
                echo "::error::pr_number cannot be combined with tenferro_ref or ci_gpu_gate_head_sha."
                exit 1
              fi
              pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${MANUAL_PR_NUMBER}")"
              if [ "$(jq -r .state <<<"${pr_json}")" != open ]; then
                echo "::error::PR #${MANUAL_PR_NUMBER} is not open; refusing recovery."
                exit 1
              fi
              pr_head_repo="$(jq -r '.head.repo.full_name' <<<"${pr_json}")"
              if [ "${pr_head_repo}" != "${GITHUB_REPOSITORY}" ]; then
                echo "::error::PR #${MANUAL_PR_NUMBER} is not from this repository; refusing recovery."
                exit 1
              fi
              pr_author="$(jq -r '.user.login' <<<"${pr_json}")"
              check_permission "${pr_author}" "PR author"
              pr_head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
              refreshed_pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${MANUAL_PR_NUMBER}")"
              refreshed_head_sha="$(jq -r '.head.sha' <<<"${refreshed_pr_json}")"
              refreshed_state="$(jq -r .state <<<"${refreshed_pr_json}")"
              refreshed_head_repo="$(jq -r '.head.repo.full_name' <<<"${refreshed_pr_json}")"
              if [ "${refreshed_head_sha}" != "${pr_head_sha}" ]; then
                echo "::error::PR #${MANUAL_PR_NUMBER} head moved during authorization; refusing recovery."
                exit 1
              fi
              if [ "${refreshed_state}" != open ] || [ "${refreshed_head_repo}" != "${GITHUB_REPOSITORY}" ]; then
                echo "::error::PR #${MANUAL_PR_NUMBER} trust state changed during authorization; refusing recovery."
                exit 1
              fi
              {
                echo "tenferro_ref=${pr_head_sha}"
                echo "target_head_sha=${pr_head_sha}"
                echo "pr_number=${MANUAL_PR_NUMBER}"
              } >> "${GITHUB_OUTPUT}"
              classify_pr_paths "${MANUAL_PR_NUMBER}"
            else
              manual_ref="${MANUAL_TENFERRO_REF:-main}"
              manual_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${manual_ref}" --jq .sha)"
              {
                echo "tenferro_ref=${manual_sha}"
                echo "pr_number=0"
                echo "target_head_sha=${MANUAL_GATE_HEAD_SHA}"
                echo "run_gpu=true"
                echo "reason=trusted manual revision validation"
              } >> "${GITHUB_OUTPUT}"
            fi
          fi

  runpod-contract:
    name: Validate RunPod request contract
    needs: authorize
    if: needs.authorize.outputs.gpu_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout trusted RunPod helpers
        uses: actions/checkout@v5
      - name: Validate GPU IDs and CUDA versions against live OpenAPI
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python3 scripts/ci/runpod_contract.py

  pre-runpod-gate:
    name: Wait for rustfmt and clippy
    needs: authorize
    if: needs.authorize.outputs.gpu_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Skip prerequisite gate for manual dispatch
        if: github.event_name != 'workflow_run'
        run: echo "Manual dispatch is gated by the authorize job only."

      - name: Wait for prerequisite checks
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        with:
          script: |
            // Lint is the paid-GPU start gate. Authorization and change
            // classification already ran before this job; CPU/macOS,
            // coverage, docs, and repository-review checks remain independent
            // required merge checks. CUDA archive compilation runs in parallel
            // with those checks on a cheap hosted runner.
            const required = ["rustfmt", "clippy"];

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.payload.workflow_run.head_sha;
            const deadline = Date.now() + 85 * 60 * 1000;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            while (Date.now() < deadline) {
              const runs = await github.paginate(github.rest.checks.listForRef, {
                owner,
                repo,
                ref,
                per_page: 100,
              });

              const candidates = new Map();
              for (const run of runs) {
                if (!required.includes(run.name)) {
                  continue;
                }
                const nameRuns = candidates.get(run.name) || [];
                nameRuns.push(run);
                candidates.set(run.name, nameRuns);
              }

              const latest = new Map();
              for (const name of required) {
                const nameRuns = (candidates.get(name) || []).sort((a, b) => {
                  const aTime = new Date(a.started_at || a.created_at || 0);
                  const bTime = new Date(b.started_at || b.created_at || 0);
                  return bTime - aTime;
                });

                // Cancelled or skipped runs can be superseded attempts from
                // before a label/approval update. Use the newest current
                // candidate instead of letting an older success mask a newer
                // active or failed run.
                const effective = nameRuns.find(
                  (run) =>
                    run.status !== "completed" ||
                    !["cancelled", "skipped"].includes(run.conclusion)
                );
                if (effective) {
                  latest.set(name, effective);
                }
              }

              const missing = required.filter((name) => !latest.has(name));
              const pending = required.filter((name) => {
                const run = latest.get(name);
                return run && run.status !== "completed";
              });
              const failed = required.filter((name) => {
                const run = latest.get(name);
                return run && run.status === "completed" && run.conclusion !== "success";
              });

              if (failed.length > 0) {
                for (const name of failed) {
                  const run = latest.get(name);
                  core.error(`${name} concluded ${run.conclusion}: ${run.html_url}`);
                }
                core.setFailed("A prerequisite review or non-GPU CI check failed.");
                return;
              }
              if (missing.length === 0 && pending.length === 0) {
                core.info(`All prerequisite checks passed: ${required.join(", ")}`);
                return;
              }

              core.info(
                `Waiting for prerequisite checks. Missing: ${missing.join(", ") || "none"}. ` +
                  `Pending: ${pending.join(", ") || "none"}.`
              );
              await sleep(30_000);
            }

            core.setFailed(`Timed out waiting for prerequisite checks: ${required.join(", ")}`);

  cuda-archive:
    name: CUDA/PJRT test archive
    needs:
      - authorize
      - runpod-contract
    if: needs.authorize.outputs.gpu_required == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    # actions: read lets this job locate an existing per-key archive artifact
    # from a prior trusted run so a GPU allocation retry never rebuilds it.
    # This job builds PR-controlled code, so it must never hold cache-write
    # or any other write scope: caches are restore-only here and shared cache
    # publication belongs to the trusted ci-cache-publish workflow on main.
    permissions:
      contents: read
      actions: read

    env:
      TENFERRO_REF: ${{ needs.authorize.outputs.tenferro_ref }}

    outputs:
      archive_cache_key: ${{ steps.archive_key.outputs.key }}
      archive_artifact_name: ${{ steps.archive_key.outputs.artifact_name }}

    steps:
      - name: Checkout tenferro-rs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ env.TENFERRO_REPO }}
          ref: ${{ env.TENFERRO_REF }}
          path: tenferro-rs

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master (2026-07-07)
        with:
          toolchain: stable

      - name: Compute CUDA/PJRT archive content key
        id: archive_key
        run: |
          set -euo pipefail
          # Material build inputs only: lockfile, manifests, sources, tests,
          # every checkout-executed CI script and Cargo configuration, the
          # Rust toolchain, and the CUDA binding/PTX versions in the key
          # prefix. scripts/ci/** and .cargo/** MUST stay hashed: they run
          # inside this job from the PR checkout, so an artifact name match
          # has to prove they were identical too. Bump the vN below when the
          # archive build commands or toolkit selection change; unrelated
          # workflow edits must not invalidate the key (#1403).
          rustc_version="$(rustc -V | awk '{print $2}')"
          key="cuda-pjrt-archive-v16-ci-ubuntu22.04-rust${rustc_version}-cuda${CUDARC_CUDA_VERSION}-ptx${CUDA_RUNTIME_VERSION}-${{ hashFiles('tenferro-rs/Cargo.lock', 'tenferro-rs/**/Cargo.toml', 'tenferro-rs/**/src/**', 'tenferro-rs/**/tests/**', 'tenferro-rs/**/examples/**', 'tenferro-rs/**/benches/**', 'tenferro-rs/**/build.rs', 'tenferro-rs/scripts/ci/**', 'tenferro-rs/.cargo/**', 'tenferro-rs/rust-toolchain*', 'tenferro-rs/REPOSITORY_RULES.md', 'tenferro-rs/PERFORMANCE_TIPS.md', 'tenferro-rs/docs/tutorial-code/**', 'tenferro-rs/docs/guides/devices-and-gpu.md', 'tenferro-rs/docs/performance/tt-inner-product-overhead.md') }}"
          {
            echo "key=${key}"
            echo "artifact_name=${key}"
          } >> "${GITHUB_OUTPUT}"
          echo "CUDA/PJRT archive content key: ${key}"

      - name: Restore CUDA/PJRT archives from trusted cache
        # Restore-only: this job executes PR-controlled build code and must
        # never publish into the main-scoped cache namespace. The trusted
        # ci-cache-publish workflow owns cache saves for this key family.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cuda_archive_cache
        with:
          path: |
            tenferro-rs/${{ env.CUDA_ARCHIVE }}
            tenferro-rs/${{ env.PJRT_ARCHIVE }}
            tenferro-rs/${{ env.CUDA_TUTORIAL_ARCHIVE }}
          key: ${{ steps.archive_key.outputs.key }}

      - name: Reuse archive artifact from a prior trusted run
        id: archive_reuse
        if: steps.cuda_archive_cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.archive_key.outputs.artifact_name }}
        run: |
          set -euo pipefail
          python3 tenferro-rs/scripts/ci/find_archive_artifact.py \
            --repository "${GITHUB_REPOSITORY}" \
            --artifact-name "${ARTIFACT_NAME}" \
            --current-run-id "${GITHUB_RUN_ID}" \
            --token "${GH_TOKEN}" \
            --output /tmp/archive-reuse.txt
          found="$(sed -n 's/^found=//p' /tmp/archive-reuse.txt | tail -1)"
          reused=false
          if [ "${found}" = "true" ]; then
            artifact_id="$(sed -n 's/^artifact_id=//p' /tmp/archive-reuse.txt | tail -1)"
            run_id="$(sed -n 's/^run_id=//p' /tmp/archive-reuse.txt | tail -1)"
            if gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
                > /tmp/archive-reuse.zip \
              && unzip -o /tmp/archive-reuse.zip -d tenferro-rs \
              && [ -f "tenferro-rs/${CUDA_ARCHIVE}" ] \
              && [ -f "tenferro-rs/${PJRT_ARCHIVE}" ] \
              && [ -f "tenferro-rs/${CUDA_TUTORIAL_ARCHIVE}" ]; then
              reused=true
              echo "Reused immutable archive artifact ${artifact_id} from trusted run ${run_id}."
            else
              echo "Artifact ${artifact_id} download failed; falling back to build."
              rm -f "tenferro-rs/${CUDA_ARCHIVE}" "tenferro-rs/${PJRT_ARCHIVE}" "tenferro-rs/${CUDA_TUTORIAL_ARCHIVE}"
            fi
          fi
          echo "reused=${reused}" >> "${GITHUB_OUTPUT}"

      - name: Log CUDA/PJRT archive source
        run: |
          if [ "${{ steps.cuda_archive_cache.outputs.cache-hit }}" = "true" ]; then
            echo "CUDA/PJRT archive source: trusted Actions cache (key hit)."
          elif [ "${{ steps.archive_reuse.outputs.reused }}" = "true" ]; then
            echo "CUDA/PJRT archive source: immutable artifact from a prior trusted run."
          else
            echo "CUDA/PJRT archive cache and artifact miss; building CUDA ${CUDA_RUNTIME_VERSION} PTX and PJRT archives."
          fi

      - name: Prepare CUDA toolkit cache directory
        if: steps.cuda_archive_cache.outputs.cache-hit != 'true' && steps.archive_reuse.outputs.reused != 'true'
        run: |
          sudo mkdir -p "${TENFERRO_CI_CACHE_ROOT}/cuda-toolkit-${CUDA_RUNTIME_VERSION}"
          sudo chown "$(id -u):$(id -g)" "${TENFERRO_CI_CACHE_ROOT}/cuda-toolkit-${CUDA_RUNTIME_VERSION}"
      - name: Restore trusted CUDA toolkit
        if: steps.cuda_archive_cache.outputs.cache-hit != 'true' && steps.archive_reuse.outputs.reused != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TENFERRO_CI_CACHE_ROOT }}/cuda-toolkit-${{ env.CUDA_RUNTIME_VERSION }}
          key: cuda-toolkit-${{ runner.os }}-ubuntu22-x86_64-${{ env.CUDA_RUNTIME_VERSION }}-v1-${{ hashFiles('tenferro-rs/scripts/ci/install_cuda_toolkit_hosted.sh') }}
      - name: Install CUDA toolkit for archive PTX
        if: steps.cuda_archive_cache.outputs.cache-hit != 'true' && steps.archive_reuse.outputs.reused != 'true'
        run: bash tenferro-rs/scripts/ci/install_cuda_toolkit_hosted.sh "${CUDA_RUNTIME_VERSION}" "${TENFERRO_CI_CACHE_ROOT}/cuda-toolkit-${CUDA_RUNTIME_VERSION}"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        if: steps.cuda_archive_cache.outputs.cache-hit != 'true' && steps.archive_reuse.outputs.reused != 'true'
        with:
          # v8 rotated the namespace when ci-cache-publish took ownership:
          # v7 entries could contain PR-built target artifacts saved by the
          # previously write-capable workflow_run jobs.
          prefix-key: v8-rust-cuda-pjrt-ci-ubuntu22-ptx
          shared-key: cuda-pjrt-ci-${{ env.CUDARC_CUDA_VERSION }}-ptx-${{ env.CUDA_RUNTIME_VERSION }}
          cache-all-crates: true
          cache-workspace-crates: true
          workspaces: tenferro-rs -> target
          # Restore-only for the same reason as the archive cache above.
          save-if: false

      # Restored archives still execute hosted tests, so nextest is always needed.
      - uses: taiki-e/install-action@3ad7ed62b9acd4b43f91777bf240fac23e489eac # nextest (resolved 2026-07-07)
        with:
          tool: nextest

      - name: Build CUDA test archive
        if: steps.cuda_archive_cache.outputs.cache-hit != 'true' && steps.archive_reuse.outputs.reused != 'true'
        working-directory: tenferro-rs
        env:
          CUDARC_CUDA_VERSION: ${{ env.CUDARC_CUDA_VERSION }}
        run: |
          set -euo pipefail
          cargo nextest archive \
            --cargo-profile ci \
            --archive-file "${CUDA_ARCHIVE}" \
            -p tenferro-gpu \
            -p tenferro-ad \
            -p tenferro-linalg \
            --features cuda

      - name: Build PJRT test archive
        if: steps.cuda_archive_cache.outputs.cache-hit != 'true' && steps.archive_reuse.outputs.reused != 'true'
        working-directory: tenferro-rs
        run: |
          set -euo pipefail
          # Hosted CPU build only: pjrt feature is libloading + dynamic plugin load at
          # RunPod runtime. Keep this archive separate from --features cuda.
          cargo nextest archive \
            --cargo-profile ci \
            --archive-file "${PJRT_ARCHIVE}" \
            -p tenferro-xla \
            --features pjrt

      - name: Build CUDA tutorial artifact
        if: steps.cuda_archive_cache.outputs.cache-hit != 'true' && steps.archive_reuse.outputs.reused != 'true'
        working-directory: tenferro-rs
        run: |
          set -euo pipefail
          cargo build --profile ci --manifest-path docs/tutorial-code/Cargo.toml \
            --no-default-features --features cuda,cpu-faer --bin cuda_tutorial
          tar --zstd -cf "${CUDA_TUTORIAL_ARCHIVE}" -C target/ci cuda_tutorial

      - name: Verify CUDA/PJRT test archives
        working-directory: tenferro-rs
        env:
          ARCHIVE_CACHE_HIT: ${{ steps.cuda_archive_cache.outputs.cache-hit }}
          ARCHIVE_REUSED: ${{ steps.archive_reuse.outputs.reused }}
        run: |
          set -euo pipefail
          if [ ! -f "${CUDA_ARCHIVE}" ]; then
            echo "Missing archive: ${CUDA_ARCHIVE}"
            exit 1
          fi
          if [ ! -f "${PJRT_ARCHIVE}" ]; then
            echo "Missing archive: ${PJRT_ARCHIVE}"
            exit 1
          fi
          if [ ! -f "${CUDA_TUTORIAL_ARCHIVE}" ]; then
            echo "Missing archive: ${CUDA_TUTORIAL_ARCHIVE}"
            exit 1
          fi
          echo "Build environment glibc: $(ldd --version | head -1)"
          if [ "${ARCHIVE_CACHE_HIT}" = "true" ]; then
            echo "Archive source: trusted Actions cache."
          elif [ "${ARCHIVE_REUSED}" = "true" ]; then
            echo "Archive source: immutable artifact from a prior trusted run."
          else
            nvcc_bin="${CUDA_PATH}/bin/nvcc"
            echo "Archive source: fresh build with PTX toolkit ${CUDA_PATH} ($("${nvcc_bin}" --version | head -1))."
          fi
          du -sh "${CUDA_ARCHIVE}" "${PJRT_ARCHIVE}" "${CUDA_TUTORIAL_ARCHIVE}" target/ci 2>/dev/null \
            || du -sh "${CUDA_ARCHIVE}" "${PJRT_ARCHIVE}" "${CUDA_TUTORIAL_ARCHIVE}" || true
          df -h .

      - name: Run device-independent CUDA and PJRT tests
        working-directory: tenferro-rs
        env:
          CUDA_VISIBLE_DEVICES: ""
          RAYON_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          # Execute the same feature-enabled artifacts, including on cache hits.
          python3 scripts/ci/gpu_test_partition.py --kind cuda --lane host --archive-file "${CUDA_ARCHIVE}"
          python3 scripts/ci/gpu_test_partition.py --kind pjrt --lane host --archive-file "${PJRT_ARCHIVE}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Always publish the per-key archives to this run: the self-hosted
        # RunPod runner downloads them by name, and later GPU allocation
        # retries reuse them through find_archive_artifact.py instead of
        # rebuilding (#1403).
        with:
          name: ${{ steps.archive_key.outputs.artifact_name }}
          path: |
            tenferro-rs/${{ env.CUDA_ARCHIVE }}
            tenferro-rs/${{ env.PJRT_ARCHIVE }}
            tenferro-rs/${{ env.CUDA_TUTORIAL_ARCHIVE }}
          if-no-files-found: error
          retention-days: 7

  gpu-execution:
    name: Paid GPU lifecycle
    needs: [authorize, runpod-contract, pre-runpod-gate, cuda-archive]
    # Skip every paid step when a maintainer recorded a local GPU run for this
    # PR: an outage upstream must not turn into repeated pod spend.
    if: >-
      needs.authorize.outputs.gpu_required == 'true' &&
      needs.authorize.outputs.local_gpu_validation != 'true'
    uses: ./.github/workflows/runpod-gpu-execute.yml
    with:
      tenferro_ref: ${{ needs.authorize.outputs.tenferro_ref }}
      target_head_sha: ${{ needs.authorize.outputs.target_head_sha }}
      target_base_sha: ${{ needs.authorize.outputs.target_base_sha }}
      pr_number: ${{ needs.authorize.outputs.pr_number }}
      archive_cache_key: ${{ needs.cuda-archive.outputs.archive_cache_key }}
      archive_artifact_name: ${{ needs.cuda-archive.outputs.archive_artifact_name }}
      keep_failed_pods: ${{ inputs.keep_failed_pods || false }}
    secrets:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      GH_APP_CLIENT_ID: ${{ secrets.GH_APP_CLIENT_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}

  ci-gpu-gate:
    name: Publish CI GPU gate
    needs:
      - authorize
      - runpod-contract
      - pre-runpod-gate
      - cuda-archive
      - gpu-execution

    if: >-
      always() &&
      !cancelled() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.status == 'in_progress'
        )
      )

    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      checks: write
      contents: read

    steps:
      - name: Publish required PR check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_HEAD_SHA: ${{ needs.authorize.outputs.target_head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUTHORIZE_RESULT: ${{ needs.authorize.result }}
          GPU_REQUIRED: ${{ needs.authorize.outputs.gpu_required }}
          LOCAL_GPU_VALIDATION: ${{ needs.authorize.outputs.local_gpu_validation }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
          POLICY_REASON: ${{ needs.authorize.outputs.policy_reason }}
          CONTRACT_RESULT: ${{ needs.runpod-contract.result }}
          PRE_RUNPOD_RESULT: ${{ needs.pre-runpod-gate.result }}
          ARCHIVE_RESULT: ${{ needs.cuda-archive.result }}
          GPU_EXECUTION_RESULT: ${{ needs.gpu-execution.result }}
        run: |
          set -euo pipefail

          failures_file="$(mktemp)"

          record_result() {
            local job="$1"
            local result="$2"
            if [ "${result}" != "success" ]; then
              echo "::error::Expected ${job} to succeed; got ${result}."
              echo "- ${job}: ${result}" >> "${failures_file}"
            fi
          }

          local_gpu_note=""

          record_evidence_failure() {
            echo "::error::$1"
            echo "- $2" >> "${failures_file}"
          }

          # Accept a local GPU run only from a repository admin/maintainer:
          # the label decides that the paid path is skipped, the recorded
          # evidence decides whether the requirement is actually satisfied.
          verify_local_gpu_evidence() {
            local evidence evidence_login evidence_role evidence_url
            evidence="$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              --jq '.[] | select(.body | contains("Local GPU validation:")) | "\(.user.login)\t\(.html_url)"' \
              | tail -1)"
            evidence_login="${evidence%%$'\t'*}"
            evidence_url="${evidence##*$'\t'}"
            if [ -z "${evidence_login}" ]; then
              record_evidence_failure \
                "Label gpu-validated-locally has no 'Local GPU validation:' comment." \
                "local GPU evidence: missing"
              return 0
            fi
            evidence_role="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${evidence_login}/permission" --jq .role_name)"
            case "${evidence_role}" in
              admin|maintain)
                local_gpu_note="Local GPU validation recorded by ${evidence_login}: ${evidence_url}"
                echo "Local GPU validation evidence accepted from ${evidence_login} (${evidence_role})."
                ;;
              *)
                record_evidence_failure \
                  "Local GPU evidence author ${evidence_login} has role '${evidence_role}'." \
                  "local GPU evidence author: ${evidence_role} (requires admin or maintain)"
                ;;
            esac
          }

          record_result "authorize" "${AUTHORIZE_RESULT}"
          if [ "${GPU_REQUIRED}" = true ]; then
            record_result "runpod-contract" "${CONTRACT_RESULT}"
            record_result "pre-runpod-gate" "${PRE_RUNPOD_RESULT}"
            record_result "cuda-archive" "${ARCHIVE_RESULT}"
            if [ "${LOCAL_GPU_VALIDATION}" = true ] && [ "${GPU_EXECUTION_RESULT}" = "skipped" ]; then
              verify_local_gpu_evidence
            else
              record_result "gpu-execution (including cleanup)" "${GPU_EXECUTION_RESULT}"
            fi
          elif [ "${GPU_REQUIRED}" = false ]; then
            echo "GPU validation not required: ${POLICY_REASON}"
          else
            echo "::error::Authorize job did not publish a valid GPU policy."
            echo "- authorize policy: ${GPU_REQUIRED:-missing}" >> "${failures_file}"
          fi

          conclusion="success"
          title="RunPod CI GPU gate passed"
          summary="RunPod GPU validation completed successfully and owns CI GPU gate."
          if [ -n "${local_gpu_note}" ]; then
            title="RunPod CI GPU gate passed (local GPU validation)"
            summary="The paid RunPod path was skipped for this PR. ${local_gpu_note}"
          fi
          if [ "${GPU_REQUIRED}" = false ]; then
            title="RunPod CI GPU gate not required"
            summary="GPU validation not required for this change: ${POLICY_REASON}"
          fi
          if [ -s "${failures_file}" ]; then
            conclusion="failure"
            title="RunPod CI GPU gate failed"
            summary="$(printf 'RunPod GPU validation did not complete successfully.\\n\\n%s' "$(cat "${failures_file}")")"
          fi

          target_sha="${TARGET_HEAD_SHA}"

          if [ -n "${target_sha}" ]; then
            echo "Publishing CI GPU gate check to PR head SHA ${target_sha}."
            jq -n \
              --arg name "CI GPU gate" \
              --arg head_sha "${target_sha}" \
              --arg conclusion "${conclusion}" \
              --arg details_url "${RUN_URL}" \
              --arg title "${title}" \
              --arg summary "${summary}" \
              '{
                name: $name,
                head_sha: $head_sha,
                status: "completed",
                conclusion: $conclusion,
                details_url: $details_url,
                output: {
                  title: $title,
                  summary: $summary
                }
              }' > /tmp/ci-gpu-gate-check.json

            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/check-runs" \
              --input /tmp/ci-gpu-gate-check.json
          else
            echo "No PR head SHA available; skipping PR-head CI GPU gate publication."
          fi

          if [ "${conclusion}" != "success" ]; then
            exit 1
          fi
