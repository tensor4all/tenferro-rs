# Touch: re-register this workflow with the Actions service (2026-11-09).
# Every run since 2026-11-09T16:52Z ends in startup_failure with zero jobs, while every other
# workflow in this repository runs. `actionlint` accepts this file, the local actions it uses
# exist at this revision, and disabling/re-enabling the workflow through the REST API did not
# clear it. Re-saving the file is how GitHub is made to re-read a stale workflow registration.
name: review bot

# Delta-scoped REPOSITORY_RULES and PERFORMANCE_TIPS review. This workflow runs from the trusted base
# revision and treats PR contents as data only: it fetches the PR head for git
# diffs, but never checks out or executes files from the PR branch.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: review-bot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REVIEW_WAIVE_LABEL: rules-review:waive
  REVIEW_NO_LLM_LABEL: rules-review:no-llm

jobs:
  review-bot:
    name: repository rules review
    # Deterministic review only: the external LLM pass is permanently disabled
    # (`--llm-skipped-reason` on the review step below), so this job executes the
    # base tree's `scripts/repository-rules-review.py --dry-run` after checking out
    # the base revision and fetching the PR head for `git diff` only. Nothing from
    # the PR branch runs and no secret is read, which is why fork and in-repo PRs
    # are reviewed by the same trusted code.
    #
    # The author's association was nevertheless required here, and that is exactly
    # what the comments on `review-bot-no-llm` and on the gate below deny: both say
    # a fork PR is evaluated from the base revision with no secret. Keeping the
    # condition made the workflow contradict itself: a fork PR had every review
    # job skipped and the required gate failed by construction, which is #2510.
    # With the LLM pass gone the condition guarded nothing, so it is dropped and
    # the labels are the only remaining switch.
    if: |
      !contains(github.event.pull_request.labels.*.name, 'rules-review:waive') &&
      !contains(github.event.pull_request.labels.*.name, 'rules-review:no-llm')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch PR head for diff only
        id: refs
        run: |
          set -euo pipefail
          pr_ref="refs/remotes/origin/pr-${{ github.event.pull_request.number }}"
          expected_head="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags --no-recurse-submodules origin \
            "+refs/pull/${{ github.event.pull_request.number }}/head:${pr_ref}"
          actual_head="$(git rev-parse "${pr_ref}")"
          if [ "${actual_head}" != "${expected_head}" ]; then
            echo "Fetched PR head ${actual_head}, but event head is ${expected_head}." >&2
            exit 1
          fi
          merge_base="$(git merge-base HEAD "${pr_ref}")"
          echo "base=${merge_base}" >> "${GITHUB_OUTPUT}"
          echo "head=${actual_head}" >> "${GITHUB_OUTPUT}"

      - name: Run repository rules review
        id: review
        run: |
          set -euo pipefail
          python3 scripts/repository-rules-review.py \
            --base "${{ steps.refs.outputs.base }}" \
            --head "${{ steps.refs.outputs.head }}" \
            --dry-run \
            --llm-skipped-reason "External LLM review is permanently disabled; deterministic checks only." \
            --output-json review-report.json \
            | tee review-report.txt

      - name: Post PR summary comment
        if: always() && steps.review.outcome != 'skipped'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;
            const maxReportChars = 60000;

            function escapeReport(text) {
              let value = text;
              if (value.length > maxReportChars) {
                value = value.slice(0, maxReportChars) + "\n...[truncated]";
              }
              return value
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/@/g, "@&#8203;");
            }

            let body = "## Repository rules review\n\n";
            if (fs.existsSync("review-report.txt")) {
              body += "<pre>" + escapeReport(fs.readFileSync("review-report.txt", "utf8")) + "</pre>\n";
            } else {
              body += "Review step did not produce a report.\n";
            }

            const marker = "<!-- repository-rules-review -->";
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) =>
                comment.user.type === "Bot" &&
                comment.body.includes(marker)
            );

            body += `\n${marker}`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Fail on block findings
        if: steps.review.outcome == 'failure'
        run: |
          echo "Repository rules review reported block-severity findings."
          exit 1

  review-bot-no-llm:
    name: repository rules review (LLM skipped)
    # Deterministic pass only: base revision checkout, PR head fetched for the diff
    # only, base tree's review script, no secret. The author's association is not a
    # trust boundary here either, and gating on it left every fork PR without a
    # verdict (#2510). This job is now the legacied escape hatch: it runs only when
    # a maintainer applies the no-LLM label and leaves the head-sha waiver comment
    # the step below requires. The default path for any PR, fork or in-repo, is
    # `review-bot` above.
    if: |
      !contains(github.event.pull_request.labels.*.name, 'rules-review:waive') &&
      contains(github.event.pull_request.labels.*.name, 'rules-review:no-llm')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify a maintainer skipped the LLM pass for this head sha
        uses: actions/github-script@v7
        with:
          script: |
            // The waiver is a maintainer comment naming the current head sha, so
            // it stops applying the moment the head moves. The label only makes
            // a human's intent visible; see scripts/review-waiver.js.
            const { run } = require(`${process.env.GITHUB_WORKSPACE}/scripts/review-waiver.js`);
            await run({ github, core, context, labelName: process.env.REVIEW_NO_LLM_LABEL });
      - name: Fetch PR head for diff only
        id: refs
        run: |
          set -euo pipefail
          pr_ref="refs/remotes/origin/pr-${{ github.event.pull_request.number }}"
          expected_head="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags --no-recurse-submodules origin \
            "+refs/pull/${{ github.event.pull_request.number }}/head:${pr_ref}"
          actual_head="$(git rev-parse "${pr_ref}")"
          if [ "${actual_head}" != "${expected_head}" ]; then
            echo "Fetched PR head ${actual_head}, but event head is ${expected_head}." >&2
            exit 1
          fi
          merge_base="$(git merge-base HEAD "${pr_ref}")"
          echo "base=${merge_base}" >> "${GITHUB_OUTPUT}"
          echo "head=${actual_head}" >> "${GITHUB_OUTPUT}"
      - name: Record LLM skip
        run: |
          set -euo pipefail
          python3 scripts/repository-rules-review.py \
            --base "${{ steps.refs.outputs.base }}" \
            --head "${{ steps.refs.outputs.head }}" \
            --dry-run \
            --llm-skipped-reason "Skipped by ${REVIEW_NO_LLM_LABEL} label after maintainer review." \
            | tee review-report.txt
      - name: Post PR summary comment
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;
            const maxReportChars = 60000;

            function escapeReport(text) {
              let value = text;
              if (value.length > maxReportChars) {
                value = value.slice(0, maxReportChars) + "\n...[truncated]";
              }
              return value
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/@/g, "@&#8203;");
            }

            let body = "## Repository rules review\n\n";
            if (fs.existsSync("review-report.txt")) {
              body += "<pre>" + escapeReport(fs.readFileSync("review-report.txt", "utf8")) + "</pre>\n";
            } else {
              body += "Review step did not produce a report.\n";
            }

            const marker = "<!-- repository-rules-review -->";
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) =>
                comment.user.type === "Bot" &&
                comment.body.includes(marker)
            );

            body += `\n${marker}`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  review-bot-waived:
    name: repository rules review (waived)
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'rules-review:waive')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify a maintainer waived review for this head sha
        uses: actions/github-script@v7
        with:
          script: |
            // The waiver is a maintainer comment naming the current head sha, so
            // it stops applying the moment the head moves. The label only makes
            // a human's intent visible; see scripts/review-waiver.js.
            const { run } = require(`${process.env.GITHUB_WORKSPACE}/scripts/review-waiver.js`);
            await run({ github, core, context, labelName: process.env.REVIEW_WAIVE_LABEL });
      - name: Fetch PR head for diff only
        id: refs
        run: |
          set -euo pipefail
          pr_ref="refs/remotes/origin/pr-${{ github.event.pull_request.number }}"
          expected_head="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags --no-recurse-submodules origin \
            "+refs/pull/${{ github.event.pull_request.number }}/head:${pr_ref}"
          actual_head="$(git rev-parse "${pr_ref}")"
          if [ "${actual_head}" != "${expected_head}" ]; then
            echo "Fetched PR head ${actual_head}, but event head is ${expected_head}." >&2
            exit 1
          fi
          merge_base="$(git merge-base HEAD "${pr_ref}")"
          echo "base=${merge_base}" >> "${GITHUB_OUTPUT}"
          echo "head=${actual_head}" >> "${GITHUB_OUTPUT}"
      - name: Record waiver
        run: |
          set -euo pipefail
          python3 scripts/repository-rules-review.py \
            --base "${{ steps.refs.outputs.base }}" \
            --head "${{ steps.refs.outputs.head }}" \
            --waived \
            --dry-run \
            | tee review-report.txt
      - name: Post PR summary comment
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;
            const maxReportChars = 60000;

            function escapeReport(text) {
              let value = text;
              if (value.length > maxReportChars) {
                value = value.slice(0, maxReportChars) + "\n...[truncated]";
              }
              return value
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/@/g, "@&#8203;");
            }

            let body = "## Repository rules review\n\n";
            if (fs.existsSync("review-report.txt")) {
              body += "<pre>" + escapeReport(fs.readFileSync("review-report.txt", "utf8")) + "</pre>\n";
            } else {
              body += "Review step did not produce a report.\n";
            }

            const marker = "<!-- repository-rules-review -->";
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) =>
                comment.user.type === "Bot" &&
                comment.body.includes(marker)
            );

            body += `\n${marker}`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  review-bot-gate:
    name: repository rules review gate
    needs: [review-bot, review-bot-no-llm, review-bot-waived]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: Require review result
        env:
          REVIEW_RESULT: ${{ needs.review-bot.result }}
          NO_LLM_RESULT: ${{ needs.review-bot-no-llm.result }}
          WAIVED_RESULT: ${{ needs.review-bot-waived.result }}
          IS_FORK_PR: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          REVIEW_WAIVE_LABEL: ${{ env.REVIEW_WAIVE_LABEL }}
          REVIEW_NO_LLM_LABEL: ${{ env.REVIEW_NO_LLM_LABEL }}
        run: |
          set -euo pipefail
          # The three review jobs above used to be gated on `head.repo == github.repository`, and
          # `review-bot` additionally on the author's association, so every fork PR reported
          # `skipped` and this gate could only fail it. None of them needs those conditions: each
          # checks out the *base* revision, fetches the PR head for the diff only, and runs the base
          # tree's `scripts/repository-rules-review.py --dry-run` with no secrets, so nothing from the
          # fork is executed and the author's identity changes nothing about what runs. Refusing forks
          # only produced a required check that nobody working from a fork could satisfy.
          #
          # Still fail when a fork PR arrives with no verdict at all.
          if [ "${IS_FORK_PR}" = "true" ] &&
             [ "${REVIEW_RESULT}" = "skipped" ] &&
             [ "${NO_LLM_RESULT}" = "skipped" ] &&
             [ "${WAIVED_RESULT}" = "skipped" ]; then
            echo "Fork PR with no review verdict: all three review jobs were skipped, so there is nothing to gate on. Check that the workflow on the base branch still runs them for forks."
            exit 1
          fi
          if [ "${WAIVED_RESULT}" = "success" ]; then
            echo "Review waived via label ${REVIEW_WAIVE_LABEL}."
            exit 0
          fi
          if [ "${NO_LLM_RESULT}" = "success" ]; then
            echo "LLM review skipped via label ${REVIEW_NO_LLM_LABEL}; deterministic checks passed."
            exit 0
          fi
          if [ "${REVIEW_RESULT}" = "success" ]; then
            exit 0
          fi
          echo "Expected review-bot success, no-LLM skip, or waiver; got review-bot=${REVIEW_RESULT} no-llm=${NO_LLM_RESULT} waived=${WAIVED_RESULT}"
          exit 1
