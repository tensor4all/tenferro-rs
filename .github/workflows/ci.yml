name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  policy:
    name: Classify CI change
    runs-on: ubuntu-latest
    outputs:
      run_rust: ${{ steps.policy.outputs.run_rust }}
      run_blas: ${{ steps.policy.outputs.run_blas }}
      run_docs: ${{ steps.policy.outputs.run_docs }}
      run_ci_config: ${{ steps.policy.outputs.run_ci_config }}
      classification: ${{ steps.policy.outputs.classification }}
      reason: ${{ steps.policy.outputs.reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Classify change
        id: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/ci/change_policy.py
          --event "${EVENT_NAME}"
          --base "${BASE_SHA}"
          --head "${HEAD_SHA}"

  fmt:
    name: rustfmt
    needs: policy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        with:
          components: rustfmt
      - name: Run rustfmt
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        run: python3 scripts/ci/run_profile.py fmt
      - name: Report rustfmt disposition
        if: always()
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          REQUIRED: ${{ needs.policy.outputs.run_rust }}
          REASON: ${{ needs.policy.outputs.reason }}
        run: |
          if [ "${POLICY_RESULT}" != success ]; then echo "Change classification failed"; exit 1; fi
          if [ "${REQUIRED}" != true ]; then echo "rustfmt not required: ${REASON}"; fi

  clippy:
    name: clippy
    needs: policy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
      - name: Test public Result error documentation audit
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        run: python3 scripts/test-check-public-error-docs.py
      - name: Audit public Result error documentation
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          python3 scripts/check-public-error-docs.py
          if [ "${EVENT_NAME}" = pull_request ]; then
            base_sha="${PR_BASE_SHA}"
          else
            base_sha="${PUSH_BASE_SHA}"
          fi
          python3 scripts/check-public-error-docs.py --changed-from "${base_sha}"
      - name: Run workspace clippy
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings -D clippy::missing_errors_doc -D clippy::missing_panics_doc
      - name: Run tropical extension clippy
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        run: cargo clippy --manifest-path ext/tropical/Cargo.toml --all-targets -- -D warnings -D clippy::missing_errors_doc -D clippy::missing_panics_doc
      - name: Run sparse extension clippy
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        run: cargo clippy --manifest-path ext/sparse/Cargo.toml --all-targets -- -D warnings -D clippy::missing_errors_doc -D clippy::missing_panics_doc
      - name: Run TBLIS CPU provider extension clippy
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        run: cargo clippy --manifest-path ext/tenferro-cpu-tblis/Cargo.toml --all-targets -- -D warnings -D clippy::missing_errors_doc -D clippy::missing_panics_doc
      - name: Report clippy disposition
        if: always()
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          REQUIRED: ${{ needs.policy.outputs.run_rust }}
          REASON: ${{ needs.policy.outputs.reason }}
        run: |
          if [ "${POLICY_RESULT}" != success ]; then echo "Change classification failed"; exit 1; fi
          if [ "${REQUIRED}" != true ]; then echo "clippy not required: ${REASON}"; fi

  test-inject-blas:
    name: cargo test (blas inject)
    needs: policy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        if: needs.policy.result == 'success' && needs.policy.outputs.run_blas == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.policy.result == 'success' && needs.policy.outputs.run_blas == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.policy.result == 'success' && needs.policy.outputs.run_blas == 'true'
      - name: Run inject tests for tenferro-cpu
        if: needs.policy.result == 'success' && needs.policy.outputs.run_blas == 'true'
        run: python3 scripts/ci/run_profile.py blas-inject
      - name: Report BLAS inject disposition
        if: always()
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          REQUIRED: ${{ needs.policy.outputs.run_blas }}
          REASON: ${{ needs.policy.outputs.reason }}
        run: |
          if [ "${POLICY_RESULT}" != success ]; then echo "Change classification failed"; exit 1; fi
          if [ "${REQUIRED}" != true ]; then echo "BLAS inject tests not required: ${REASON}"; fi

  tensor-core-deps:
    name: tensor core dependency boundary
    needs: policy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
      - name: Check host-only tensor-core dependencies
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        run: scripts/check-tensor-core-deps.sh
      - name: Report dependency-check disposition
        if: always()
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          REQUIRED: ${{ needs.policy.outputs.run_rust }}
          REASON: ${{ needs.policy.outputs.reason }}
        run: |
          if [ "${POLICY_RESULT}" != success ]; then echo "Change classification failed"; exit 1; fi
          if [ "${REQUIRED}" != true ]; then echo "dependency check not required: ${REASON}"; fi

  coverage:
    name: coverage
    needs: policy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
      - uses: taiki-e/install-action@cargo-llvm-cov
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
      - name: Generate and enforce coverage
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        run: python3 scripts/ci/run_profile.py coverage
      - name: Log CI target disk usage
        if: always() && needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        run: |
          set -euo pipefail
          du -sh target || true
          df -h .
      - name: Report coverage disposition
        if: always()
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          REQUIRED: ${{ needs.policy.outputs.run_rust }}
          REASON: ${{ needs.policy.outputs.reason }}
        run: |
          if [ "${POLICY_RESULT}" != success ]; then echo "Change classification failed"; exit 1; fi
          if [ "${REQUIRED}" != true ]; then echo "coverage not required: ${REASON}"; fi

  docs-site:
    name: docs-site
    needs: policy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        if: needs.policy.result == 'success' && needs.policy.outputs.run_docs == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.policy.result == 'success' && needs.policy.outputs.run_docs == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.policy.result == 'success' && needs.policy.outputs.run_docs == 'true'
      - name: Install Quarto
        if: needs.policy.result == 'success' && needs.policy.outputs.run_docs == 'true'
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Ensure graphviz
        if: needs.policy.result == 'success' && needs.policy.outputs.run_docs == 'true'
        run: |
          if ! command -v dot >/dev/null 2>&1; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends graphviz
          fi
      - name: Validate and build docs site
        if: needs.policy.result == 'success' && needs.policy.outputs.run_docs == 'true'
        run: python3 scripts/ci/run_profile.py docs
      - name: Report docs disposition
        if: always()
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          REQUIRED: ${{ needs.policy.outputs.run_docs }}
          REASON: ${{ needs.policy.outputs.reason }}
        run: |
          if [ "${POLICY_RESULT}" != success ]; then echo "Change classification failed"; exit 1; fi
          if [ "${REQUIRED}" != true ]; then echo "docs-site not required: ${REASON}"; fi

  ci-config:
    name: CI configuration checks
    needs: policy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        if: needs.policy.result == 'success' && needs.policy.outputs.run_ci_config == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        if: needs.policy.result == 'success' && needs.policy.outputs.run_ci_config == 'true'
        with:
          go-version: stable
      - name: Install pinned actionlint
        if: needs.policy.result == 'success' && needs.policy.outputs.run_ci_config == 'true'
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Validate CI configuration
        if: needs.policy.result == 'success' && needs.policy.outputs.run_ci_config == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          STORAGE_OWNERSHIP_PROMOTION_BASE: 402c962c61543f1477e3e3e0ade2c293b9d05ad
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = pull_request ]; then
            BASE_SHA="${PR_BASE_SHA}"
          elif [ "${EVENT_NAME}" = push ]; then
            BASE_SHA="${PUSH_BASE_SHA}"
          else
            echo "Unsupported CI event: ${EVENT_NAME}" >&2
            exit 1
          fi
          # P8-P13 are submitted as one aggregate promotion stream. The main
          # branch still carries the pre-P2 revision-3 manifest, so validate
          # the final state against the last revision-4 promotion base.
          PROMOTION_BASE_SHA="${STORAGE_OWNERSHIP_PROMOTION_BASE}"
          if ! git merge-base --is-ancestor "${PROMOTION_BASE_SHA}" HEAD; then
            echo "promotion base is not an ancestor of the checked-out commit" >&2
            exit 1
          fi
          python3 scripts/ci/run_profile.py ci-config --storage-ownership-base "${PROMOTION_BASE_SHA}"
      - name: Report CI configuration disposition
        if: always()
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          REQUIRED: ${{ needs.policy.outputs.run_ci_config }}
          REASON: ${{ needs.policy.outputs.reason }}
        run: |
          if [ "${POLICY_RESULT}" != success ]; then echo "Change classification failed"; exit 1; fi
          if [ "${REQUIRED}" != true ]; then echo "CI configuration checks not required: ${REASON}"; fi
