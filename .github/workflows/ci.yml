name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  policy:
    name: Classify CI change
    runs-on: ubuntu-24.04
    outputs:
      run_rust: ${{ steps.policy.outputs.run_rust }}
      run_docs: ${{ steps.policy.outputs.run_docs }}
      run_ci_config: ${{ steps.policy.outputs.run_ci_config }}
      classification: ${{ steps.policy.outputs.classification }}
      reason: ${{ steps.policy.outputs.reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Classify change
        id: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/ci/change_policy.py
          --event "${EVENT_NAME}"
          --base "${BASE_SHA}"
          --head "${HEAD_SHA}"

  placement:
    name: single placement implementation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Only threadteam (and vendor wrappers) depend on rayon
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans
      # The public API surface and its registry conformance run in the
      # `api-surface` job of ci-pr-workspace-tests.yml, which the required
      # `CI gate (PR workspace tests)` depends on (#2602).
      # Pinned: rustdoc JSON rendering changes between nightlies, and
      # scripts/check-no-public-rayon.sh uses this exact toolchain (#2552 Q4).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-18
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api@0.52.0
      - name: No rayon type in the public API of tenferro-cpu
        run: scripts/check-no-public-rayon.sh
      - uses: Swatinem/rust-cache@v2
      - name: Placement ledger (live tasks within budget, no pool entry for small work, global pool unstarted)
        run: cargo test -p tenferro-cpu -p tenferro-linalg -p tenferro-einsum --features ledger --no-fail-fast

  fmt:
    name: rustfmt
    needs: policy
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        with:
          components: rustfmt
      - name: Run rustfmt
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        run: python3 scripts/ci/run_profile.py fmt
      - name: Report rustfmt disposition
        if: always()
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          REQUIRED: ${{ needs.policy.outputs.run_rust }}
          REASON: ${{ needs.policy.outputs.reason }}
        run: |
          if [ "${POLICY_RESULT}" != success ]; then echo "Change classification failed"; exit 1; fi
          if [ "${REQUIRED}" != true ]; then echo "rustfmt not required: ${REASON}"; fi

  clippy:
    name: clippy
    needs: policy
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        with:
          prefix-key: v1-rust-ubuntu24
      - name: Test public Result error documentation audit
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        run: python3 scripts/test-check-public-error-docs.py
      - name: Audit public Result error documentation
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          python3 scripts/check-public-error-docs.py
          if [ "${EVENT_NAME}" = pull_request ]; then
            base_sha="${PR_BASE_SHA}"
          else
            base_sha="${PUSH_BASE_SHA}"
          fi
          python3 scripts/check-public-error-docs.py --changed-from "${base_sha}"
      - name: Run workspace clippy
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings -D clippy::missing_errors_doc -D clippy::missing_panics_doc
      - name: Run tropical extension clippy
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        run: cargo clippy --manifest-path ext/tropical/Cargo.toml --all-targets -- -D warnings -D clippy::missing_errors_doc -D clippy::missing_panics_doc
      - name: Run sparse extension clippy
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        run: cargo clippy --manifest-path ext/sparse/Cargo.toml --all-targets -- -D warnings -D clippy::missing_errors_doc -D clippy::missing_panics_doc
      - name: Report clippy disposition
        if: always()
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          REQUIRED: ${{ needs.policy.outputs.run_rust }}
          REASON: ${{ needs.policy.outputs.reason }}
        run: |
          if [ "${POLICY_RESULT}" != success ]; then echo "Change classification failed"; exit 1; fi
          if [ "${REQUIRED}" != true ]; then echo "clippy not required: ${REASON}"; fi

  fftw:
    name: FFTW runtime provider
    needs: policy
    if: needs.policy.outputs.run_rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-ubuntu24-fftw
      - name: Check FFTW dependencies are opt-in
        run: |
          set -o pipefail
          cargo tree --locked -p tenferro-fft --no-default-features --edges normal > fft-dependencies.txt
          if grep -E '(^|[[:space:]])(fftw[^[:space:]]*|libloading) v' fft-dependencies.txt; then exit 1; fi
      - name: Install FFTW runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-double3 libfftw3-single3
      - name: Run FFTW integration tests
        env:
          TENFERRO_TEST_REQUIRE_FFTW: '1'
        run: cargo test --locked -p tenferro-fft --features fftw,autodiff --test fftw

  mpi-adapter:
    name: MPI transport adapter
    needs: policy
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        with:
          components: clippy, rustfmt
      # `tenferro-mpi` is a workspace member with `default = []`; only this lane
      # enables `system`, whose binding needs MPI headers and libclang at build
      # time. The gate is `run_rust`, the output this workflow's `policy` job
      # actually declares; gating on an undeclared output skips every step and
      # reports a green job.
      - name: Install MPI and libclang
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openmpi-bin libopenmpi-dev libclang-dev
      - name: Cache the root workspace target dir
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-ubuntu24
          # tenferro-mpi is a member of the root workspace, not a standalone one.
          workspaces: .
      - name: Run the upstream MPI lane
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        run: python3 scripts/ci/run_profile.py mpi-upstream
      - name: Report MPI adapter disposition
        if: always()
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          REQUIRED: ${{ needs.policy.outputs.run_rust }}
          REASON: ${{ needs.policy.outputs.reason }}
        run: |
          if [ "${POLICY_RESULT}" != success ]; then echo "Change classification failed"; exit 1; fi
          if [ "${REQUIRED}" != true ]; then echo "MPI adapter tests not required: ${REASON}"; fi

  hdf5-adapter:
    name: hdf5 adapter
    needs: policy
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        with:
          prefix-key: v1-hdf5-ubuntu24
          # tenferro-hdf5 is a member of the root workspace, not a standalone one.
          workspaces: .
      - name: Install libhdf5 and h5py
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libhdf5-dev python3-h5py
          python3 -c "import h5py; print('h5py', h5py.__version__, 'libhdf5', h5py.version.hdf5_version)"
      - name: Run rustfmt
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        run: cargo fmt -p tenferro-hdf5 -- --check
      - name: Run clippy
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        run: >-
          cargo clippy -p tenferro-hdf5 --features hdf5 --all-targets --
          -D warnings -D clippy::missing_errors_doc -D clippy::missing_panics_doc
      - name: Run tests and doctests
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        env:
          TENFERRO_HDF5_INTEROP: "1"
        run: cargo test -p tenferro-hdf5 --features hdf5 --locked
      - name: Report hdf5 adapter disposition
        if: always()
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          REQUIRED: ${{ needs.policy.outputs.run_rust }}
          REASON: ${{ needs.policy.outputs.reason }}
        run: |
          if [ "${POLICY_RESULT}" != success ]; then echo "Change classification failed"; exit 1; fi
          if [ "${REQUIRED}" != true ]; then echo "hdf5 adapter not required: ${REASON}"; fi

  tensor-core-deps:
    name: tensor core dependency boundary
    needs: policy
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
      - name: Check host-only tensor-core dependencies
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        run: scripts/check-tensor-core-deps.sh
      - name: Check one version per dependency identity
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        run: scripts/check-single-versions.sh
      - name: Report dependency-check disposition
        if: always()
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          REQUIRED: ${{ needs.policy.outputs.run_rust }}
          REASON: ${{ needs.policy.outputs.reason }}
        run: |
          if [ "${POLICY_RESULT}" != success ]; then echo "Change classification failed"; exit 1; fi
          if [ "${REQUIRED}" != true ]; then echo "dependency check not required: ${REASON}"; fi

  coverage:
    name: coverage
    needs: policy
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        with:
          prefix-key: v1-rust-ubuntu24
      - uses: taiki-e/install-action@v2
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        with:
          tool: cargo-llvm-cov,nextest
      - name: Run external extension authoring fixture
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        run: bash tests/run-extension-authoring-fixture.sh
      - name: Generate and enforce coverage
        if: needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        run: python3 scripts/ci/run_profile.py coverage
      - name: Log CI target disk usage
        if: always() && needs.policy.result == 'success' && needs.policy.outputs.run_rust == 'true'
        run: |
          set -euo pipefail
          du -sh target || true
          df -h .
      - name: Report coverage disposition
        if: always()
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          REQUIRED: ${{ needs.policy.outputs.run_rust }}
          REASON: ${{ needs.policy.outputs.reason }}
        run: |
          if [ "${POLICY_RESULT}" != success ]; then echo "Change classification failed"; exit 1; fi
          if [ "${REQUIRED}" != true ]; then echo "coverage not required: ${REASON}"; fi

  docs-site:
    name: docs-site
    needs: policy
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        if: needs.policy.result == 'success' && needs.policy.outputs.run_docs == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.policy.result == 'success' && needs.policy.outputs.run_docs == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.policy.result == 'success' && needs.policy.outputs.run_docs == 'true'
        with:
          prefix-key: v1-rust-ubuntu24
      - name: Install Quarto
        if: needs.policy.result == 'success' && needs.policy.outputs.run_docs == 'true'
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Ensure graphviz
        if: needs.policy.result == 'success' && needs.policy.outputs.run_docs == 'true'
        run: |
          if ! command -v dot >/dev/null 2>&1; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends graphviz
          fi
      - name: Validate and build docs site
        if: needs.policy.result == 'success' && needs.policy.outputs.run_docs == 'true'
        run: python3 scripts/ci/run_profile.py docs
      - name: Report docs disposition
        if: always()
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          REQUIRED: ${{ needs.policy.outputs.run_docs }}
          REASON: ${{ needs.policy.outputs.reason }}
        run: |
          if [ "${POLICY_RESULT}" != success ]; then echo "Change classification failed"; exit 1; fi
          if [ "${REQUIRED}" != true ]; then echo "docs-site not required: ${REASON}"; fi

  ci-config:
    name: CI configuration checks
    needs: policy
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        if: needs.policy.result == 'success' && needs.policy.outputs.run_ci_config == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        if: needs.policy.result == 'success' && needs.policy.outputs.run_ci_config == 'true'
        with:
          go-version: stable
      - name: Install pinned actionlint
        if: needs.policy.result == 'success' && needs.policy.outputs.run_ci_config == 'true'
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Test the review waiver decision
        if: needs.policy.result == 'success' && needs.policy.outputs.run_ci_config == 'true'
        run: node --test scripts/test-review-waiver.js
      - name: Test the repository rules review gate
        if: needs.policy.result == 'success' && needs.policy.outputs.run_ci_config == 'true'
        run: python3 scripts/test-repository-rules-review.py
      - name: Validate CI configuration
        if: needs.policy.result == 'success' && needs.policy.outputs.run_ci_config == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          STORAGE_OWNERSHIP_PROMOTION_BASE: 402c962c61543f1477e3e3e0ade2c293b9d05ad
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = pull_request ]; then
            BASE_SHA="${PR_BASE_SHA}"
          elif [ "${EVENT_NAME}" = push ]; then
            BASE_SHA="${PUSH_BASE_SHA}"
          else
            echo "Unsupported CI event: ${EVENT_NAME}" >&2
            exit 1
          fi
          # P8-P13 are submitted as one aggregate promotion stream. The main
          # branch still carries the pre-P2 revision-3 manifest, so validate
          # the final state against the last revision-4 promotion base.
          PROMOTION_BASE_SHA="${STORAGE_OWNERSHIP_PROMOTION_BASE:-${BASE_SHA}}"
          if ! git merge-base --is-ancestor "${PROMOTION_BASE_SHA}" HEAD; then
            echo "promotion base is not an ancestor of the checked-out commit" >&2
            exit 1
          fi
          python3 scripts/ci/run_profile.py ci-config --storage-ownership-base "${PROMOTION_BASE_SHA}"
      - name: Report CI configuration disposition
        if: always()
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          REQUIRED: ${{ needs.policy.outputs.run_ci_config }}
          REASON: ${{ needs.policy.outputs.reason }}
        run: |
          if [ "${POLICY_RESULT}" != success ]; then echo "Change classification failed"; exit 1; fi
          if [ "${REQUIRED}" != true ]; then echo "CI configuration checks not required: ${REASON}"; fi
