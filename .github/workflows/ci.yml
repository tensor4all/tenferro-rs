name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  test-workspace:
    name: cargo test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --release

  test-inject-prims:
    name: cargo test (prims inject)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run inject tests for tenferro-prims
        run: cargo test -p tenferro-prims --test inject_tests --release --no-default-features --features "gemm-blas,provider-inject"

  test-inject-linalg:
    name: cargo test (linalg inject)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run inject tests for tenferro-linalg
        run: cargo test -p tenferro-linalg --test inject_tests --release --no-default-features --features "linalg-lapack,provider-inject"

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage JSON
        run: cargo llvm-cov --workspace --json --output-path coverage.json
      - name: Enforce per-file coverage thresholds
        run: python3 scripts/check-coverage.py coverage.json

  docs-site:
    name: docs-site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Install pandoc and graphviz
        run: sudo apt-get update && sudo apt-get install -y pandoc graphviz
      - name: Build docs site
        run: bash scripts/build_docs_site.sh
