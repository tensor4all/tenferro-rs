name: Delete RunPod pod

on:
  workflow_dispatch:
    inputs:
      pod_id:
        description: RunPod pod id to delete
        required: false
        type: string
      pod_name:
        description: RunPod pod name to look up and delete
        required: false
        type: string

permissions:
  contents: read

jobs:
  delete-runpod-pod:
    name: Delete RunPod pod
    runs-on: ubuntu-24.04
    environment: runpod-gpu
    timeout-minutes: 10

    steps:
      - name: Checkout trusted cleanup helper
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Delete RunPod pod
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          POD_ID: ${{ inputs.pod_id }}
          POD_NAME: ${{ inputs.pod_name }}
        run: |
          set -euo pipefail
          if [[ "${POD_ID}" == null ]]; then unset POD_ID; fi
          if [[ -z "${POD_ID:-}" && ( -z "${POD_NAME}" || "${POD_NAME}" == null ) ]]; then
            echo "No POD_ID or POD_NAME; nothing to delete"
            exit 0
          fi
          python3 -m scripts.ci.runpod_http delete --config scripts/ci/runpod_config.json --pod-name "${POD_NAME}"
