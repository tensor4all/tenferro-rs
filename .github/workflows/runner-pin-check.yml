name: RunPod runner pin check

# The RunPod pods register a JIT runner from the actions/runner release
# pinned in runpod-gpu-execute.yml. GitHub stops queueing jobs to runners that
# fall too far behind, and the 2026-09-24..26 outage (#1921) was only noticed
# through paid provision ladders whose pods never registered. This free,
# hosted check reports a stale pin within a day instead (#2002). It is not a
# required check; a failure means "bump the pin" (runbook in
# docs/design/runpod-gpu-provisioning.md). It needs no secret: the release
# listing is public.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/runner-pin-check.yml
      - .github/workflows/runpod-gpu-execute.yml
      - scripts/ci/runner_pin_check.py

permissions:
  contents: read

concurrency:
  group: runner-pin-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-pin:
    name: Check pinned actions/runner release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Compare the pin with actions/runner releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/runner_pin_check.py
