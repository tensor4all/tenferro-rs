# Change-aware workspace and extension tests. Required gate names remain stable;
# intentionally unnecessary lanes execute explicit successful no-ops.
name: CI PR workspace tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select validation matrix
    runs-on: ubuntu-24.04
    outputs:
      backends: ${{ steps.select.outputs.backends }}
      run_workspace: ${{ steps.policy.outputs.run_rust }}
      run_extensions: ${{ steps.policy.outputs.run_extensions }}
      run_macos: ${{ steps.policy.outputs.run_macos }}
      reason: ${{ steps.policy.outputs.reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Classify change
        id: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/ci/change_policy.py
          --event "${EVENT_NAME}"
          --base "${BASE_SHA}"
          --head "${HEAD_SHA}"
      - name: Select backend profiles
        id: select
        env:
          RUN_WORKSPACE: ${{ steps.policy.outputs.run_rust }}
          RUN_BLAS: ${{ steps.policy.outputs.run_blas }}
        run: |
          faer='{"backend":"cpu-faer","profile":"workspace-faer","rustflags":""}'
          blas='{"backend":"cpu-blas","profile":"workspace-blas","rustflags":"-l dylib=openblas -l dylib=lapack"}'
          noop='{"backend":"not-required","profile":"","rustflags":""}'
          if [ "${RUN_WORKSPACE}" != true ]; then
            echo "backends=[${noop}]" >> "${GITHUB_OUTPUT}"
          elif [ "${RUN_BLAS}" = true ]; then
            echo "backends=[${faer},${blas}]" >> "${GITHUB_OUTPUT}"
          else
            echo "backends=[${faer}]" >> "${GITHUB_OUTPUT}"
          fi

  ci-fork:
    name: CI (fork PR / github-hosted)
    needs: changes
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.run_workspace == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.run_workspace == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.run_workspace == 'true'
        with:
          prefix-key: v1-rust-ubuntu24
      - uses: taiki-e/install-action@nextest
        if: needs.changes.outputs.run_workspace == 'true'
      - name: Run workspace faer profile
        if: needs.changes.outputs.run_workspace == 'true'
        run: python3 scripts/ci/run_profile.py workspace-faer
      - name: Report workspace no-op
        if: needs.changes.outputs.run_workspace != 'true'
        env:
          REASON: ${{ needs.changes.outputs.reason }}
        run: echo "Workspace tests not required - ${REASON}"

  ci-maintainer:
    name: CI (same-repo / heavy / ${{ matrix.cfg.backend }})
    needs: changes
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cfg: ${{ fromJSON(needs.changes.outputs.backends) }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../target-${{ matrix.cfg.backend }}
      RUSTFLAGS: ${{ matrix.cfg.rustflags }}
    steps:
      - uses: actions/checkout@v6
        if: matrix.cfg.profile != ''
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.cfg.profile != ''
      - uses: Swatinem/rust-cache@v2
        id: rust_cache
        if: matrix.cfg.profile != ''
        with:
          prefix-key: v1-rust-ubuntu24
          # Cargo writes to CARGO_TARGET_DIR outside the checkout. Without
          # this mapping rust-cache restores ./target and misses faer and
          # strided-rs dependency artifacts in the real target tree.
          workspaces: |
            . -> ../target-${{ matrix.cfg.backend }}
          shared-key: ci-workspace-${{ matrix.cfg.backend }}
      - name: Verify restored dependency artifacts
        if: matrix.cfg.profile != '' && steps.rust_cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          # Cargo before 1.100 keeps dependency artifacts in ci/deps; Cargo
          # 1.100's build-dir layout keeps them in ci/build/<package>/<hash>/out.
          profile_dir="${CARGO_TARGET_DIR}/ci"
          test -d "${profile_dir}"
          has_artifact() {
            local dirs=()
            [ -d "${profile_dir}/deps" ] && dirs+=("${profile_dir}/deps")
            [ -d "${profile_dir}/build" ] && dirs+=("${profile_dir}/build")
            [ "${#dirs[@]}" -gt 0 ] || return 1
            find "${dirs[@]}" \
              \( -path "${profile_dir}/deps/*" -o -path "${profile_dir}/build/*/*/out/*" \) \
              -type f \( -name "lib$1-*.rlib" -o -name "lib$1-*.rmeta" \) \
              -print -quit | grep -q .
          }
          crates="strided_view strided_traits strided_perm strided_basic strided_fused strided_kernel"
          if [ "${{ matrix.cfg.backend }}" = cpu-faer ]; then
            crates="${crates} faer"
          fi
          for crate in ${crates}; do
            has_artifact "${crate}" || {
              echo "restored cache is missing ${crate} artifacts under ${profile_dir}/{deps,build}" >&2
              exit 1
            }
          done
          echo "Verified restored Cargo dependency artifacts under ${profile_dir}."
      - name: Install BLAS/LAPACK runtime libraries
        if: matrix.cfg.backend == 'cpu-blas'
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev
      - uses: taiki-e/install-action@nextest
        if: matrix.cfg.profile != ''
      - name: Verify BLAS/LAPACK runtime libraries
        if: matrix.cfg.backend == 'cpu-blas'
        run: |
          ldconfig -p | grep -E 'libopenblas\.so' >/dev/null
          ldconfig -p | grep -E 'liblapack\.so' >/dev/null
      - name: Run workspace profile
        if: matrix.cfg.profile != ''
        run: python3 scripts/ci/run_profile.py "${{ matrix.cfg.profile }}"
      - name: Log CI target disk usage
        if: always() && matrix.cfg.profile != ''
        run: |
          set -euo pipefail
          echo "CARGO_TARGET_DIR=${CARGO_TARGET_DIR}"
          du -sh "${CARGO_TARGET_DIR}" || true
          df -h "${CARGO_TARGET_DIR}" || df -h .
      - name: Report workspace no-op
        if: matrix.cfg.profile == ''
        env:
          REASON: ${{ needs.changes.outputs.reason }}
        run: echo "Workspace tests not required - ${REASON}"

  ext-samples:
    name: Extension and sample tests
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.run_extensions == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.run_extensions == 'true'
      - name: Cache extension/sample target dirs
        if: needs.changes.outputs.run_extensions == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-ubuntu24
          workspaces: |
            ext/tropical
            ext/sparse
            samples/kdv-pinn
      - name: Run extension profile
        if: needs.changes.outputs.run_extensions == 'true'
        run: python3 scripts/ci/run_profile.py extensions
      - name: Report extension no-op
        if: needs.changes.outputs.run_extensions != 'true'
        env:
          REASON: ${{ needs.changes.outputs.reason }}
        run: echo "Extension tests not required - ${REASON}"

  api-surface:
    # Public API snapshot (#2552) and its registry conformance (#2602) on the
    # surface compiled from this commit. The conformance check reads the
    # api_ops! registries, so an undeclared eager entry point, a duplicate
    # alias or an engine argument outside the session boundary fails even when
    # the snapshots in api/ were regenerated to match.
    name: Public API snapshot and registry conformance
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Registry-conformance checker self-test
        run: python3 scripts/test-check-api-registry-conformance.py
      - name: Committed snapshots conform to the registries
        run: python3 scripts/check-api-registry-conformance.py
      # Pinned: rustdoc JSON rendering changes between nightlies, and
      # scripts/api-snapshot.sh uses this exact toolchain (#2552 Q4).
      - uses: dtolnay/rust-toolchain@master
        if: needs.changes.outputs.run_workspace == 'true'
        with:
          toolchain: nightly-2026-07-18
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.run_workspace == 'true'
      - uses: taiki-e/install-action@v2
        if: needs.changes.outputs.run_workspace == 'true'
        with:
          tool: cargo-public-api@0.52.0
      - name: Compiled public API matches api/ and conforms to the registries
        if: needs.changes.outputs.run_workspace == 'true'
        run: scripts/api-snapshot.sh --check
      - name: Report compiled-surface no-op
        if: needs.changes.outputs.run_workspace != 'true'
        env:
          REASON: ${{ needs.changes.outputs.reason }}
        run: echo "No Rust change; the committed snapshots were checked against the registries - ${REASON}"

  ci-gate:
    name: CI gate (PR workspace tests)
    needs: [changes, ci-fork, ci-maintainer, ext-samples, api-surface]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require selected workspace and extension tests
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          FORK_RESULT: ${{ needs.ci-fork.result }}
          MAINTAINER_RESULT: ${{ needs.ci-maintainer.result }}
          EXT_RESULT: ${{ needs.ext-samples.result }}
          API_RESULT: ${{ needs.api-surface.result }}
          RUN_WORKSPACE: ${{ needs.changes.outputs.run_workspace }}
          RUN_EXTENSIONS: ${{ needs.changes.outputs.run_extensions }}
        run: |
          if [ "${CHANGE_RESULT}" != success ]; then
            echo "Change classification failed: ${CHANGE_RESULT}"
            exit 1
          fi
          if [ "${EXT_RESULT}" != success ]; then
            echo "Expected ext-samples to succeed or no-op; got ${EXT_RESULT}"
            exit 1
          fi
          if [ "${API_RESULT}" != success ]; then
            echo "Expected the public API snapshot and registry conformance to pass; got ${API_RESULT}"
            exit 1
          fi
          if [ "${FORK_RESULT}" != success ] && [ "${MAINTAINER_RESULT}" != success ]; then
            echo "Expected a workspace job to succeed or no-op; fork=${FORK_RESULT} maintainer=${MAINTAINER_RESULT}"
            exit 1
          fi
          echo "Selected policy satisfied: workspace=${RUN_WORKSPACE} extensions=${RUN_EXTENSIONS}"

  macos:
    name: macOS workspace tests
    needs: changes
    if: always()
    runs-on: ${{ needs.changes.result == 'success' && needs.changes.outputs.run_macos == 'true' && 'macos-15' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.result == 'success' && needs.changes.outputs.run_macos == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.result == 'success' && needs.changes.outputs.run_macos == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.result == 'success' && needs.changes.outputs.run_macos == 'true'
        with:
          shared-key: macos-accelerate-v1
      - uses: taiki-e/install-action@nextest
        if: needs.changes.result == 'success' && needs.changes.outputs.run_macos == 'true'
      - name: Run macOS Accelerate and Apple-specific tests
        if: needs.changes.result == 'success' && needs.changes.outputs.run_macos == 'true'
        run: python3 scripts/ci/run_profile.py macos-accelerate
      - name: Report macOS disposition
        if: always()
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          RUN_MACOS: ${{ needs.changes.outputs.run_macos }}
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          if [ "${CHANGE_RESULT}" != success ]; then
            echo "Change classification failed: ${CHANGE_RESULT}"
            exit 1
          fi
          if [ "${RUN_MACOS}" != true ]; then echo "macOS tests not required - ${REASON}"; fi
