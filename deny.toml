# Only `threadteam` starts tasks on a thread pool. Every tenferro crate reaches
# parallelism through `threadteam::Exec` (re-exported by `tenferro-cpu`), so a
# direct `rayon` dependency (normal, dev or build) is rejected. The exceptions
# are the vendor crates of t4a-faer and third-party crates (the einsum path
# optimizer `omeco`, `criterion`) that bring rayon in themselves; they are listed
# as wrappers below. `spindle` is reachable only through t4a-faer, the one faer
# identity of the stack (its scheduling is decided in tensor4all/faer#59).
[graph]
all-features = true

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = [
    { crate = "rayon", wrappers = [
        "threadteam",
        # t4a-faer and the gemm crates it uses (faer's scheduling is tensor4all/faer#59).
        "t4a-faer",
        "spindle",
        # gemm 0.19 became t4a-gemm 0.20 with t4a-faer 0.30 (tensor4all/faer#273):
        # the rayon wrapper is t4a-gemm-common now, and `gemm-common` is gone.
        "t4a-gemm-common",
        "t4a-private-gemm-x86",
        # Third-party crates that bring rayon in themselves.
        "omeco",
        "criterion",
    ] },
    { crate = "rayon-core", wrappers = ["rayon"] },
    { crate = "spindle", wrappers = ["t4a-faer", "t4a-private-gemm-x86"] },
]
