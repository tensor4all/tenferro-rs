[package]
name = "tenferro-linalg-prims"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "Backend-facing linalg kernel contracts for the tenferro workspace."

[features]
default = ["linalg-faer"]
linalg-faer = ["dep:faer"]
linalg-lapack = ["dep:lapack", "dep:cblas-sys"]
provider-src = ["linalg-lapack", "dep:blas-src", "dep:cblas-src", "dep:lapack-src"]
provider-inject = ["linalg-lapack", "dep:cblas-inject", "dep:lapack-inject"]
src-openblas = ["provider-src", "blas-src/openblas", "lapack-src/openblas"]
src-netlib = ["provider-src", "blas-src/netlib", "lapack-src/netlib"]
src-accelerate = ["provider-src", "blas-src/accelerate", "lapack-src/accelerate"]
src-r = ["provider-src", "blas-src/r", "lapack-src/r"]
src-intel-mkl-dynamic-sequential = [
    "provider-src",
    "blas-src/intel-mkl-dynamic-sequential",
    "lapack-src/intel-mkl-dynamic-sequential",
]
src-intel-mkl-dynamic-parallel = [
    "provider-src",
    "blas-src/intel-mkl-dynamic-parallel",
    "lapack-src/intel-mkl-dynamic-parallel",
]
src-intel-mkl-static-sequential = [
    "provider-src",
    "blas-src/intel-mkl-static-sequential",
    "lapack-src/intel-mkl-static-sequential",
]
src-intel-mkl-static-parallel = [
    "provider-src",
    "blas-src/intel-mkl-static-parallel",
    "lapack-src/intel-mkl-static-parallel",
]
cuda = ["dep:cudarc", "tenferro-prims/cuda", "tenferro-tensor/cuda"]

[dependencies]
tenferro-algebra = { path = "../tenferro-algebra" }
tenferro-device = { path = "../tenferro-device" }
tenferro-prims = { path = "../tenferro-prims" }
tenferro-tensor = { path = "../tenferro-tensor" }
faer = { workspace = true, optional = true }
cblas-sys = { workspace = true, optional = true }
cblas-src = { workspace = true, optional = true }
cblas-inject = { workspace = true, optional = true }
blas-src = { workspace = true, optional = true }
lapack = { workspace = true, optional = true }
lapack-src = { workspace = true, optional = true }
lapack-inject = { workspace = true, optional = true }
num-complex = { workspace = true }
num-traits = { workspace = true }
libloading.workspace = true
cudarc = { workspace = true, optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
